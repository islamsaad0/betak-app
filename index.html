<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>

    <title id="page-title">RealEstatePro - الإدارة العقارية الاحترافية</title>

    <!-- FontAwesome -->

    <!-- Chart.js for Analytics -->

    <!-- SheetJS for Excel Import/Export -->

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        royal: {
                            gold: '#D4AF37',
                            goldLight: '#F3E5AB',
                            goldDark: '#AA8C2C',
                            darkBg: '#0f172a',
                            darkCard: '#1e293b',
                        },
                        vivid: {
                            orange: '#FF7F50',
                            orangeDark: '#E06B40',
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'glow-gold': 'glowGold 2s infinite alternate',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        neonRed: { '0%': { boxShadow: '0 0 5px rgba(239, 68, 68, 0.5)' }, '100%': { boxShadow: '0 0 20px rgba(239, 68, 68, 1), 0 0 30px rgba(239, 68, 68, 0.8)' } },
                        neonYellow: { '0%': { boxShadow: '0 0 5px rgba(234, 179, 8, 0.5)' }, '100%': { boxShadow: '0 0 20px rgba(234, 179, 8, 1), 0 0 30px rgba(234, 179, 8, 0.8)' } },
                        glowGold: { '0%': { boxShadow: '0 0 5px rgba(212, 175, 55, 0.5)' }, '100%': { boxShadow: '0 0 20px rgba(212, 175, 55, 1)' } }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            transition: background-color 0.3s, color 0.3s; 
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #AA8C2C; }

        .glass { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255,255,255,0.2); 
        }
        .dark .glass { 
            background: rgba(30, 41, 59, 0.90); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(212, 175, 55, 0.3); 
        }
        
        .royal-input { 
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid #e5e7eb; 
            border-radius: 0.5rem; 
            transition: all 0.3s; 
            background-color: #fff; 
            color: #1f2937; 
        }
        .royal-input:focus { 
            outline: none; 
            border-color: #D4AF37; 
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2); 
        }
        .dark .royal-input { 
            background-color: #0f172a; 
            border-color: #334155; 
            color: #f8fafc; 
        }
        .dark .royal-input:focus { 
            border-color: #D4AF37; 
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.4); 
        }
        
        .status-sold-glow { animation: neonRed 1.5s infinite alternate !important; }
        .status-reserved-glow { animation: neonYellow 1.5s infinite alternate !important; }
        
        .prop-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .prop-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 20px 40px -5px rgba(212, 175, 55, 0.4); 
        }
        .dark .prop-card:hover { 
            box-shadow: 0 20px 40px -5px rgba(212, 175, 55, 0.2); 
        }

        @keyframes pulse-fade {
            0% { opacity: 0.7; transform: scale(0.95); filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.4)); }
            100% { opacity: 1; transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.9)); }
        }
        .logo-animated {
            animation: pulse-fade 2.5s ease-in-out infinite alternate;
        }

        @keyframes rotate-bg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .creator-badge-wrapper {
            position: relative; overflow: hidden; border-radius: 1rem; padding: 2px; margin-top: 1rem;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); transition: all 0.3s ease;
        }
        .creator-badge-wrapper:hover { 
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); 
            transform: translateY(-3px) scale(1.02); 
        }
        .creator-badge-wrapper::before {
            content: ''; position: absolute; top: -100%; left: -100%; width: 300%; height: 300%;
            background: conic-gradient(transparent, transparent, rgba(212, 175, 55, 0.1), #D4AF37, transparent 30%);
            animation: rotate-bg 3s linear infinite;
        }
        .creator-badge-inner { 
            position: relative; background: rgba(255, 255, 255, 0.95); border-radius: 0.9rem; 
            padding: 0.85rem 1rem; display: flex; align-items: center; justify-content: center; 
            gap: 0.6rem; z-index: 10; 
        }
        .dark .creator-badge-inner { background: rgba(15, 23, 42, 0.95); }

        .accordion-content { 
            transition: max-height 0.4s ease-out, opacity 0.4s ease-out; 
            max-height: 0; opacity: 0; overflow: hidden; 
        }
        .accordion-content.open { 
            max-height: 5000px; opacity: 1; overflow: visible; 
        }
        .accordion-icon { transition: transform 0.3s; }
        .accordion-icon.open { transform: rotate(180deg); }

        .timeline-container { position: relative; }
        .timeline-container::before { 
            content: ''; position: absolute; top: 0; bottom: 0; right: 24px; 
            width: 2px; background: #e5e7eb; 
        }
        .dark .timeline-container::before { background: #334155; }
        .timeline-item { position: relative; padding-right: 60px; margin-bottom: 2rem; }
        .timeline-dot { 
            position: absolute; right: 16px; top: 0; width: 18px; height: 18px; 
            border-radius: 50%; background: #D4AF37; border: 4px solid #fff; 
            box-shadow: 0 0 0 2px #D4AF37; z-index: 10; 
        }
        .dark .timeline-dot { border-color: #1e293b; }
        
        /* Custom scrollbar for notifications */
        #noti-list::-webkit-scrollbar { width: 4px; }
        #noti-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark #noti-list::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-royal-darkBg text-gray-800 dark:text-gray-100 antialiased overflow-x-hidden transition-colors duration-300">

    <!-- Audio Element for Reminders -->
    <audio id="reminder-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Global Loader -->
    <div id="global-loader" class="fixed inset-0 bg-gray-900/90 backdrop-blur-md z-[999] hidden flex-col items-center justify-center text-white transition-opacity">
        <i class="fas fa-circle-notch fa-spin text-7xl text-royal-gold mb-6 shadow-lg rounded-full"></i>
        <p id="loader-text" class="text-2xl font-bold tracking-wide animate-pulse font-cairo">جاري المعالجة... برجاء الانتظار</p>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-4 z-[999] flex flex-col gap-2 pointer-events-none font-cairo"></div>

    <!-- APP CONTAINER -->
    <div id="app" class="h-screen flex flex-col md:flex-row"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJ6NSEfC5ZYW37fWLTaljy6Onvw3faSC4",
            authDomain: "betak-real-estate.firebaseapp.com",
            projectId: "betak-real-estate",
            storageBucket: "betak-real-estate.firebasestorage.app",
            messagingSenderId: "1006094091108",
            appId: "1:1006094091108:web:c97a15d550fcf429927071"
        };
        
        if (!firebase.apps.length) { 
            firebase.initializeApp(firebaseConfig); 
        }
        const db = firebase.firestore();
        
        firebase.firestore.setLogLevel('silent');
        
        db.enablePersistence().catch(function(err) { 
            console.error("خطأ في تفعيل وضع الأوفلاين:", err); 
        });

        const auth = firebase.auth();
        auth.signInAnonymously().catch((error) => { 
            console.error("خطأ في الاتصال:", error); 
        });

        const state = {
            settings: { 
                companyName: 'بيتك للتطوير العقاري', 
                logo: 'https://i.ibb.co/v6Z6bVM7/BETAK-logo.png', 
                commissionRate: 0.025 
            },
            currentUser: null,
            theme: localStorage.getItem('theme') || 'light',
            users: [ 
                { id: 1, name: 'المدير العام', username: 'admin', password: '123', role: 'admin', target: {type: 'money', value: 0}, isDeleted: false } 
            ],
            excelFiles: [],
            activeFileId: null,
            clients: [],
            projects: [],
            archive: [], 
            currentView: 'dashboard',
            filters: { 
                projSearch: '', 
                clientSearch: '', 
                clientDateFrom: '', 
                clientDateTo: '', 
                showDeletedClients: false, 
                archiveSearch: '', 
                archiveDateFrom: '', 
                archiveDateTo: '', 
                reportDateFrom: '', 
                reportDateTo: '' 
            },
            viewedProject: null,
            viewedConstructionProject: null
        };

        const rbac = {
            canViewReports: ['admin', 'team_leader'], 
            canManageUsers: ['admin'],
            canManageTargets: ['admin'],
            canManageProjects: ['admin', 'data_entry'],
            canUploadExcel: ['admin', 'marketing', 'employee', 'team_leader', 'data_entry'],
            canChangeStatus: ['admin', 'employee', 'team_leader']
        };

        function checkPerm(action) {
            if(!state.currentUser) return false;
            return rbac[action].includes(state.currentUser.role);
        }

        function logActivity(userId, actionType, details) {
            const newLog = { 
                id: Date.now() + Math.random(), 
                date: new Date().toISOString(), 
                userId: userId, 
                action: actionType, 
                details: details 
            };
            db.collection('Archive').doc(newLog.id.toString()).set(newLog); 
        }

        let unsubscribers = [];
        let cloudStatus = 'pending';

        async function initRealtimeListeners() {
            // تنظيف المستمعين السابقين عند تغيير المستخدم أو تسجيل الخروج
            unsubscribers.forEach(unsub => unsub());
            unsubscribers = [];
            cloudStatus = 'connected';
            
            if(typeof updateSyncStatus === 'function') updateSyncStatus();

            const role = state.currentUser.role;
            const uid = state.currentUser.id;

            // 1. Settings Listener
            unsubscribers.push(
                db.collection('System').doc('Settings').onSnapshot(doc => {
                    if (doc.exists) { 
                        state.settings = doc.data(); 
                        renderActiveViewOnly(); 
                    }
                }, err => handleDbError(err))
            );

            // 2. Users Listener
            unsubscribers.push(
                db.collection('Users').onSnapshot(snap => {
                    state.users = snap.docs.map(d => d.data());
                    const updatedMe = state.users.find(u => u.id === uid && !u.isDeleted);
                    if(updatedMe) {
                        state.currentUser = updatedMe;
                    } else {
                        handleLogout(); 
                        return;
                    }
                    renderActiveViewOnly();
                }, err => handleDbError(err))
            );

            // 3. Projects Listener
            unsubscribers.push(
                db.collection('Projects').onSnapshot(snap => {
                    state.projects = snap.docs.map(d => d.data());
                    renderActiveViewOnly();
                }, err => handleDbError(err))
            );

            // 4. Clients Listener (Server-Side Filtering)
            let clientsQuery = db.collection('Clients');
            if (role === 'employee') {
                clientsQuery = clientsQuery.where('agentId', '==', uid);
            } else if (role === 'team_leader') {
                const teamIds = state.users.filter(u => u.teamLeaderId === uid).map(u => u.id);
                teamIds.push(uid);
                if(teamIds.length <= 10 && teamIds.length > 0) {
                    clientsQuery = clientsQuery.where('agentId', 'in', teamIds);
                }
            }
            
            unsubscribers.push(
                clientsQuery.onSnapshot(snap => {
                    state.clients = snap.docs.map(d => d.data());
                    renderActiveViewOnly();
                    updateNotificationsUI(); // Update bell icon
                }, err => handleDbError(err))
            );

            // 5. ExcelFiles Listener
            let excelQuery = db.collection('ExcelFiles');
            if (role !== 'admin') {
                excelQuery = excelQuery.where('uploadedBy', '==', uid);
            }
            unsubscribers.push(
                excelQuery.onSnapshot(snap => {
                    state.excelFiles = snap.docs.map(d => d.data());
                    if (!state.excelFiles.find(f => f.id === state.activeFileId) && state.excelFiles.length > 0) {
                        state.activeFileId = state.excelFiles[0].id;
                    }
                    renderActiveViewOnly();
                }, err => handleDbError(err))
            );

            // 6. Archive Listener
            unsubscribers.push(
                db.collection('Archive').orderBy('date', 'desc').limit(200).onSnapshot(snap => {
                    state.archive = snap.docs.map(d => d.data());
                    renderActiveViewOnly();
                    updateNotificationsUI(); // Update bell icon
                }, err => handleDbError(err))
            );
        }

        function handleDbError(err) {
            console.error("Firebase Sync Error:", err);
            cloudStatus = 'error';
            if(typeof updateSyncStatus === 'function') updateSyncStatus();
        }

        function updateSyncStatus() {
            const indMain = document.getElementById('sync-indicator');
            const indMobile = document.getElementById('sync-indicator-mobile');
            const isOnline = navigator.onLine;
            
            let isGreen = false;
            let titleText = "";

            if (!isOnline) { 
                isGreen = false; 
                titleText = "أوفلاين (الإنترنت مقطوع)"; 
            } else if (cloudStatus === 'error') { 
                isGreen = false; 
                titleText = "خطأ في الاتصال بقاعدة البيانات"; 
            } else if (cloudStatus === 'pending') { 
                isGreen = false; 
                titleText = "جاري الاتصال..."; 
            } else { 
                isGreen = true; 
                titleText = "متصل لحظياً (Real-time)"; 
            }

            const setStatus = (el) => {
                if(!el) return;
                if(isGreen) {
                    el.className = 'w-3 h-3 rounded-full transition-all duration-500 bg-green-500 shadow-[0_0_8px_#22c55e,0_0_12px_#22c55e] animate-pulse-fast cursor-help';
                } else if (!isOnline) {
                    el.className = 'w-3 h-3 rounded-full transition-all duration-500 bg-gray-400 shadow-[0_0_5px_#9ca3af] cursor-help';
                } else if (cloudStatus === 'pending') {
                    el.className = 'w-3 h-3 rounded-full transition-all duration-500 bg-yellow-400 shadow-[0_0_5px_#facc15] animate-pulse cursor-help';
                } else {
                    el.className = 'w-3 h-3 rounded-full transition-all duration-500 bg-red-500 shadow-[0_0_5px_#ef4444] cursor-help';
                }
                el.title = titleText;
            };
            
            setStatus(indMain); 
            setStatus(indMobile);
        }

        window.addEventListener('online', updateSyncStatus);
        window.addEventListener('offline', updateSyncStatus);

        let focusedElementId = null; 
        let cursorPosition = 0;
        
        function saveFocus() { 
            if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) { 
                focusedElementId = document.activeElement.id; 
                cursorPosition = document.activeElement.selectionStart; 
            } else { 
                focusedElementId = null; 
            } 
        }
        
        function restoreFocus() { 
            if(focusedElementId) { 
                const el = document.getElementById(focusedElementId); 
                if(el) { 
                    el.focus(); 
                    if(el.setSelectionRange && typeof cursorPosition === 'number') {
                        try { el.setSelectionRange(cursorPosition, cursorPosition); } catch(e){}
                    } 
                } 
            } 
        }

        if (state.theme === 'dark') document.documentElement.classList.add('dark');
        
        function toggleTheme() { 
            const html = document.documentElement; 
            html.classList.toggle('dark'); 
            state.theme = html.classList.contains('dark') ? 'dark' : 'light'; 
            localStorage.setItem('theme', state.theme); 
            renderActiveViewOnly(); 
        }

        function showToast(message, type = 'success', persist = false) {
            const container = document.getElementById('toast-container'); 
            const toast = document.createElement('div');
            let bgColor = type === 'success' ? 'bg-green-500' : (type === 'error' ? 'bg-red-500' : (type === 'warning' ? 'bg-vivid-orange' : 'bg-blue-500'));
            
            toast.className = `pointer-events-auto ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 opacity-0 translate-y-[-20px] flex items-center gap-3 font-bold border border-white/20`;
            
            let icon = type === 'error' ? 'fa-exclamation-circle' : (type === 'warning' ? 'fa-bell' : 'fa-check-circle');
            
            // إضافة زر الإغلاق الدائم
            let closeBtnHTML = persist ? `<button onclick="this.parentElement.remove()" class="ml-auto text-white/80 hover:text-white transition-colors bg-white/10 rounded-md px-2 py-1 focus:outline-none"><i class="fas fa-times"></i></button>` : '';
            
            toast.innerHTML = `<i class="fas ${icon} text-xl animate-pulse"></i><span>${message}</span>${closeBtnHTML}`;
            
            container.appendChild(toast); 
            
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-[-20px]'), 10);
            
            if(!persist) {
                setTimeout(() => { 
                    toast.classList.add('opacity-0'); 
                    setTimeout(() => toast.remove(), 300); 
                }, 4000);
            }
        }

        function formatCurrency(num) { 
            return new Intl.NumberFormat('ar-EG', { style: 'currency', currency: 'EGP', maximumFractionDigits: 0 }).format(num).replace('EGP', 'ج.م'); 
        }
        
        function formatDate(dateString, withTime = false) {
            if(!dateString) return '-';
            const options = { year: 'numeric', month: 'short', day: 'numeric', ...(withTime && {hour: '2-digit', minute:'2-digit'}) };
            return new Date(dateString).toLocaleDateString('ar-EG', options);
        }
        
        function getExactDateTime() { return new Date().toISOString(); }

        function showLoader(text) { 
            document.getElementById('loader-text').innerText = text; 
            document.getElementById('global-loader').classList.remove('hidden'); 
            document.getElementById('global-loader').classList.add('flex'); 
        }
        
        function hideLoader() { 
            document.getElementById('global-loader').classList.add('hidden'); 
            document.getElementById('global-loader').classList.remove('flex'); 
        }

        function openModal(htmlContent) { 
            document.getElementById('modals-container').innerHTML = `
                <div class="fixed inset-0 bg-gray-900/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-fade-in" onclick="closeModal()">
                    <div class="w-full max-w-2xl max-h-[90vh] overflow-y-auto animate-slide-up shadow-2xl rounded-2xl bg-white dark:bg-royal-darkCard" onclick="event.stopPropagation()">
                        ${htmlContent}
                    </div>
                </div>`; 
        }
        
        window.closeModal = function() { document.getElementById('modals-container').innerHTML = ''; }

        function showConfirmModal(message, confirmText, btnClass, onConfirm) {
            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-t-2xl flex items-center gap-3">
                    <i class="fas fa-exclamation-circle text-${btnClass.includes('red') ? 'red' : 'vivid-orange'}-500 text-2xl"></i>
                    <h3 class="font-bold text-xl text-gray-800 dark:text-white">تأكيد الإجراء</h3>
                </div>
                <div class="p-6">
                    <p class="text-gray-700 dark:text-gray-300 font-bold text-lg mb-6">${message}</p>
                    <div class="flex gap-4 justify-end">
                        <button type="button" onclick="closeModal()" class="px-5 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-bold hover:bg-gray-300 transition-colors">إلغاء</button>
                        <button type="button" id="confirm-btn-action" class="px-5 py-2 rounded-lg text-white font-bold ${btnClass} transition-colors shadow-lg">${confirmText}</button>
                    </div>
                </div>
            `); 
            document.getElementById('confirm-btn-action').onclick = () => { onConfirm(); closeModal(); };
        }

        function showPromptModal(message, defaultValue, onConfirm) {
            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-t-2xl">
                    <h3 class="font-bold text-xl text-gray-800 dark:text-white">${message}</h3>
                </div>
                <div class="p-6">
                    <input type="text" id="prompt-input-val" class="royal-input" value="${defaultValue}">
                    <div class="mt-6 flex gap-4 justify-end">
                        <button type="button" onclick="closeModal()" class="px-5 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-bold hover:bg-gray-300 transition-colors">إلغاء</button>
                        <button type="button" id="prompt-btn-action" class="px-5 py-2 rounded-lg bg-royal-gold text-white font-bold hover:bg-royal-goldDark transition-colors shadow-lg">حفظ</button>
                    </div>
                </div>
            `); 
            document.getElementById('prompt-btn-action').onclick = () => { onConfirm(document.getElementById('prompt-input-val').value); closeModal(); };
        }

        const readMultipleFiles = async (files) => {
            const cloudName = "ok4jlpdx"; 
            const uploadPreset = "BETAK realestate_preset"; 
            const results = [];
            for (let i = 0; i < files.length; i++) {
                const formData = new FormData(); 
                formData.append("file", files[i]); 
                formData.append("upload_preset", uploadPreset);
                try { 
                    const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, { method: "POST", body: formData }); 
                    const data = await response.json(); 
                    if (data.secure_url) results.push(data.secure_url); 
                } catch (error) { console.error("حصل خطأ في رفع الصورة:", error); }
            } 
            return results; 
        };

        function toggleNotifications(event) {
            if(event) event.stopPropagation();
            const drop = document.getElementById('notification-dropdown');
            if(drop) drop.classList.toggle('hidden');
        }

        // Close dropdown when clicking outside
        window.onclick = function(event) {
            if (!event.target.closest('#noti-wrapper')) {
                const drop = document.getElementById('notification-dropdown');
                if (drop && !drop.classList.contains('hidden')) {
                    drop.classList.add('hidden');
                }
            }
        }

        function handleNotiClick(type, id) {
            toggleNotifications();
            if(type === 'client') {
                changeView('clients');
                setTimeout(() => openClientProfile(id), 100);
            } else if (type === 'archive') {
                changeView('archive');
            }
        }

        function updateNotificationsUI() {
            if(!state.currentUser) return;
            const notiList = document.getElementById('noti-list');
            const notiBadge = document.getElementById('noti-badge');
            if(!notiList || !notiBadge) return;

            const today = new Date().toISOString().split('T')[0];
            
            // 1. تذكيرات العملاء لليوم
            const myClientsToCall = state.clients.filter(c => c.agentId === state.currentUser.id && c.followUpDate === today && !c.isDeleted);
            
            // 2. آخر التحديثات والنشاطات للمستخدم
            const myRecentLogs = state.archive.filter(a => a.userId === state.currentUser.id)
                                              .sort((a,b) => new Date(b.date) - new Date(a.date))
                                              .slice(0, 5); // عرض آخر 5 نشاطات

            const totalCount = myClientsToCall.length; // الإشعار الأحمر يعتمد على المكالمات المطلوبة فقط

            if(totalCount > 0) {
                notiBadge.textContent = totalCount;
                notiBadge.classList.remove('hidden');
            } else {
                notiBadge.classList.add('hidden');
            }

            let html = '';

            if(myClientsToCall.length > 0) {
                html += `<div class="px-3 py-2 bg-red-50 dark:bg-red-900/20 text-xs font-bold text-red-600 dark:text-red-400 border-b border-red-100 dark:border-red-800">متابعات مطلوبة اليوم (${myClientsToCall.length})</div>`;
                myClientsToCall.forEach(c => {
                    html += `
                    <div onclick="handleNotiClick('client', ${c.id})" class="p-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 cursor-pointer transition-colors">
                        <div class="flex items-start gap-3">
                            <div class="mt-1 text-vivid-orange"><i class="fas fa-phone-volume animate-pulse"></i></div>
                            <div>
                                <p class="text-sm font-bold dark:text-white">اتصال بعميل: ${c.name}</p>
                                <p class="text-xs text-gray-500 mt-1">${c.propertyType} - ${formatCurrency(c.budget)}</p>
                            </div>
                        </div>
                    </div>`;
                });
            }

            if(myRecentLogs.length > 0) {
                html += `<div class="px-3 py-2 bg-blue-50 dark:bg-blue-900/20 text-xs font-bold text-blue-600 dark:text-blue-400 border-b border-blue-100 dark:border-blue-800">نشاطاتي الأخيرة</div>`;
                myRecentLogs.forEach(log => {
                    html += `
                    <div onclick="handleNotiClick('archive', null)" class="p-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 cursor-pointer transition-colors">
                        <div class="flex items-start gap-3">
                            <div class="mt-1 text-blue-500"><i class="fas fa-history"></i></div>
                            <div>
                                <p class="text-xs font-bold dark:text-gray-200">${log.action}</p>
                                <p class="text-[10px] text-gray-500 mt-0.5 line-clamp-2">${log.details}</p>
                                <span class="text-[9px] text-gray-400 block mt-1" dir="ltr">${formatDate(log.date, true)}</span>
                            </div>
                        </div>
                    </div>`;
                });
            }

            if(html === '') {
                html = `<div class="p-6 text-center text-gray-400 text-sm font-bold">لا يوجد إشعارات جديدة</div>`;
            }

            notiList.innerHTML = html;
        }

        window.checkReminders = function() {
            if(!state.currentUser) return;
            const today = new Date().toISOString().split('T')[0];
            const myClientsToCall = state.clients.filter(c => c.agentId === state.currentUser.id && c.followUpDate === today && !c.isDeleted);
            if(myClientsToCall.length > 0) {
                const names = myClientsToCall.map(c => c.name).join('، ');
                // Make the toast persistent so the user must acknowledge it
                showToast(`تذكير هام! لديك متابعات اليوم مع: ${names}`, 'warning', true);
                const audio = document.getElementById('reminder-sound');
                if(audio) { 
                    audio.volume = 0.7; 
                    audio.play().catch(e => console.log('Audio blocked.')); 
                }
            }
        };
        
        setInterval(() => { if(window.checkReminders) window.checkReminders(); }, 30 * 60 * 1000);

        function renderApp() { 
            const app = document.getElementById('app'); 
            if (!state.currentUser) {
                app.innerHTML = getLoginHTML(); 
            } else { 
                app.innerHTML = getLayoutHTML(); 
                renderActiveViewOnly(); 
                updateSyncStatus(); // Ensure indicator updates correctly after UI inject
                setTimeout(() => window.checkReminders(), 1000); 
            } 
        }

        function changeView(view) { 
            state.currentView = view; 
            state.viewedProject = null; 
            state.viewedConstructionProject = null; 
            if(window.innerWidth < 768) toggleSidebar(false); 
            renderActiveViewOnly(); 
        }

        function toggleSidebar(forceOpen) { 
            const sidebar = document.getElementById('sidebar'); 
            const overlay = document.getElementById('mobile-overlay'); 
            if(forceOpen) { 
                sidebar.classList.remove('translate-x-full'); 
                sidebar.classList.add('translate-x-0'); 
                overlay.classList.remove('hidden'); 
                setTimeout(() => overlay.classList.remove('opacity-0'), 10); 
            } else { 
                sidebar.classList.add('translate-x-full'); 
                sidebar.classList.remove('translate-x-0'); 
                overlay.classList.add('opacity-0'); 
                setTimeout(() => overlay.classList.add('hidden'), 300); 
            } 
        }

        function toggleAccordion(id) { 
            const content = document.getElementById('acc-content-' + id); 
            const icon = document.getElementById('acc-icon-' + id); 
            content.classList.toggle('open'); 
            icon.classList.toggle('open'); 
        }

        function getAllUnits() { 
            let allUnits = []; 
            (state.projects || []).filter(p=>!p.isDeleted).forEach(p => { 
                (p.floors || []).forEach(f => { 
                    (f.units || []).forEach(u => allUnits.push(u)) 
                }) 
            }); 
            return allUnits; 
        }

                        ${checkPerm('canManageUsers') ? `<a href="#" id="nav-users" onclick="changeView('users')" class="menu-item flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition-all mb-1"><i class="fas fa-user-shield w-5 text-center text-lg"></i> إدارة الموظفين</a>` : ''}

            <main class="flex-1 flex flex-col h-screen overflow-hidden">

                            <div id="notification-dropdown" class="absolute left-0 mt-2 w-80 bg-white dark:bg-royal-darkCard border border-gray-100 dark:border-gray-700 shadow-2xl rounded-xl hidden z-50 overflow-hidden">

                                </div>
                                <div id="noti-list" class="max-h-80 overflow-y-auto">

                        <button onclick="toggleTheme()" class="text-gray-500 hover:text-royal-gold dark:text-gray-300 transition-colors p-2">

        function renderActiveViewOnly() {
            saveFocus(); 
            const mainContent = document.getElementById('main-content');
            if(!mainContent) return; // if in login screen
            
            document.querySelectorAll('.menu-item').forEach(el => { 
                el.classList.remove('bg-royal-gold', 'text-white', 'shadow-lg'); 
                if(el.id !== 'nav-trash') el.classList.add('text-gray-600', 'dark:text-gray-300', 'hover:bg-royal-goldLight/20', 'dark:hover:bg-gray-800'); 
            });
            
            const activeLink = document.getElementById(`nav-${state.currentView === 'construction' ? 'construction' : state.currentView}`);
            if(activeLink && activeLink.id !== 'nav-trash') { 
                activeLink.classList.remove('text-gray-600', 'dark:text-gray-300', 'hover:bg-royal-goldLight/20', 'dark:hover:bg-gray-800'); 
                activeLink.classList.add('bg-royal-gold', 'text-white', 'shadow-lg'); 
            } else if (activeLink && activeLink.id === 'nav-trash') { 
                activeLink.classList.remove('text-red-500', 'hover:bg-red-50'); 
                activeLink.classList.add('bg-red-600', 'text-white', 'shadow-lg'); 
            }

            switch(state.currentView) {
                case 'dashboard': mainContent.innerHTML = getDashboardHTML(); break;
                case 'leads': mainContent.innerHTML = getLeadsHTML(); break;
                case 'clients': mainContent.innerHTML = getClientsHTML(); break;
                case 'properties': mainContent.innerHTML = getProjectsHTML(); break;
                case 'construction': mainContent.innerHTML = getConstructionHTML(); break;
                case 'archive': mainContent.innerHTML = getArchiveHTML(); break;
                case 'reports': if(!checkPerm('canViewReports')) changeView('dashboard'); else mainContent.innerHTML = getReportsHTML(); break;
                case 'users': if(!checkPerm('canManageUsers')) changeView('dashboard'); else mainContent.innerHTML = getUsersHTML(); break;
                case 'targets': if(!checkPerm('canManageTargets')) changeView('dashboard'); else mainContent.innerHTML = getTargetsHTML(); break;
                case 'trash': if(state.currentUser.role !== 'admin') changeView('dashboard'); else mainContent.innerHTML = getTrashHTML(); break;
            }
            restoreFocus(); 
        }

        function getTrashHTML() {
            let trashItems = [];
            state.clients.filter(c => c.isDeleted).forEach(c => trashItems.push({ id: c.id, type: 'client', typeName: 'عميل (CRM)', name: c.name, date: c.deletedAt || '-' }));
            state.projects.filter(p => p.isDeleted).forEach(p => trashItems.push({ id: p.id, type: 'project', typeName: 'مشروع عقاري', name: p.name, date: p.deletedAt || '-' }));
            state.users.filter(u => u.isDeleted).forEach(u => trashItems.push({ id: u.id, type: 'user', typeName: 'موظف/مستخدم', name: u.name, date: u.deletedAt || '-' }));
            state.excelFiles.filter(f => f.isDeleted).forEach(f => trashItems.push({ id: f.id, type: 'excel', typeName: 'ملف إكسيل', name: f.name, date: f.deletedAt || '-' }));
            
            trashItems.sort((a, b) => new Date(b.date) - new Date(a.date));

            const rows = trashItems.map(item => `
                <tr class="border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50">
                    <td class="py-4 px-4 font-bold dark:text-white">${item.name}</td>
                    <td class="py-4 px-4"><span class="px-2 py-1 text-xs font-bold rounded bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300">${item.typeName}</span></td>
                    <td class="py-4 px-4 text-sm font-bold text-gray-500" dir="ltr">${formatDate(item.date, true)}</td>
                    <td class="py-4 px-4 flex gap-2">
                        <button onclick="restoreItem('${item.type}', '${item.id}')" class="bg-green-100 hover:bg-green-200 text-green-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm"><i class="fas fa-recycle mr-1"></i> استرجاع</button>
                        <button onclick="hardDeleteItem('${item.type}', '${item.id}')" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm"><i class="fas fa-trash-alt mr-1"></i> حذف نهائي</button>
                    </td>
                </tr>
            `).join('');

            return `
            <div class="mb-6">
                <h2 class="text-3xl font-black text-red-600 dark:text-red-500"><i class="fas fa-trash-alt mr-2"></i> سلة المهملات المركزية</h2>
                <p class="text-gray-500 mt-2 font-bold">يمكنك استرجاع العناصر المحذوفة، أو إزالتها نهائياً من النظام.</p>
            </div>
            <div class="bg-white dark:bg-royal-darkCard rounded-2xl shadow-sm overflow-hidden border border-gray-100 dark:border-gray-800">
                <div class="overflow-x-auto">
                    <table class="w-full text-right whitespace-nowrap">
                        <thead class="bg-gray-50 dark:bg-gray-800/50">
                            <tr>
                                <th class="py-4 px-4 font-black">الاسم / العنوان</th>
                                <th class="py-4 px-4 font-black">النوع</th>
                                <th class="py-4 px-4 font-black">تاريخ الحذف</th>
                                <th class="py-4 px-4 font-black">إجراءات السلة</th>
                            </tr>
                        </thead>
                        <tbody>${rows || '<tr><td colspan="4" class="p-8 text-center text-gray-400 font-bold">سلة المهملات فارغة تماماً</td></tr>'}</tbody>
                    </table>
                </div>
            </div>`;
        }

        window.restoreItem = function(type, id) {
            if(state.currentUser.role !== 'admin') return;
            let collectionName = '';
            if(type === 'client') collectionName = 'Clients'; 
            else if(type === 'project') collectionName = 'Projects'; 
            else if(type === 'user') collectionName = 'Users'; 
            else if(type === 'excel') collectionName = 'ExcelFiles';
            
            if(collectionName) {
                db.collection(collectionName).doc(id.toString()).update({ isDeleted: false, deletedAt: null }).then(() => {
                    showToast('تم الاسترجاع بنجاح'); 
                    logActivity(state.currentUser.id, 'استرجاع من المهملات', `تم الاسترجاع من سلة المهملات`);
                });
            }
        }

        window.hardDeleteItem = function(type, id) {
            if(state.currentUser.role !== 'admin') return;
            showConfirmModal('سيتم حذف هذا العنصر نهائياً وللأبد من قاعدة البيانات. هل أنت متأكد؟', 'حذف نهائي', 'bg-red-700', () => {
                let collectionName = '';
                if(type === 'client') collectionName = 'Clients'; 
                else if(type === 'project') collectionName = 'Projects'; 
                else if(type === 'user') collectionName = 'Users'; 
                else if(type === 'excel') collectionName = 'ExcelFiles';

                if(collectionName) {
                    db.collection(collectionName).doc(id.toString()).delete().then(() => {
                        logActivity(state.currentUser.id, 'حذف نهائي', `تم الحذف النهائي لعنصر من نوع ${type}`);
                        showToast('تم الحذف من السيرفر نهائياً');
                    });
                }
            });
        }

        function getDashboardHTML() {
            const isAdmin = state.currentUser.role === 'admin'; 
            const isTL = state.currentUser.role === 'team_leader'; 
            const allUnits = getAllUnits();
            const activeUsers = state.users.filter(u => !u.isDeleted && u.role !== 'data_entry' && u.role !== 'admin');
            
            let myClients = state.clients.filter(c => !c.isDeleted && c.agentId === state.currentUser.id);
            let myProps = allUnits.filter(p => p.agentId === state.currentUser.id || p.coAgentId === state.currentUser.id);
            
            if (isAdmin) { 
                myClients = state.clients.filter(c => !c.isDeleted); 
                myProps = allUnits.filter(p => p.status !== 'available'); 
            } 
            else if (isTL) {

                let percent = target > 0 ? Math.round((achieved / target) * 100) : 0;

                const remaining = Math.max(0, target - achieved); 
                const achievedText = isMoney ? formatCurrency(achieved) : `${achieved} وحدة`; 
                const targetText = isMoney ? formatCurrency(target) : `${target} وحدة`;

                        <span class="text-green-600">المحقق: <span class="font-black">${achievedText}</span></span>

                    <h4 class="font-bold text-lg dark:text-white mb-4"><i class="fas fa-trophy text-yellow-500"></i> ترتيب الموظفين (Leaderboard)</h4>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right whitespace-nowrap">
                            <thead class="bg-gray-50 dark:bg-gray-800/50">
                                <tr>
                                    <th class="py-3 px-4 font-black">الموظف</th>

        window.changeActiveFile = function(fileId) { 
            state.activeFileId = fileId; 
            renderActiveViewOnly(); 
        }
        
        window.deleteExcelFile = function(fileId) { 
            if(state.currentUser.role !== 'admin') return;
            showConfirmModal('سيتم نقل الملف للـ سلة المهملات.', 'حذف الملف', 'bg-red-600', () => { 
                db.collection('ExcelFiles').doc(fileId).update({ isDeleted: true, deletedAt: getExactDateTime() }).then(() => {
                    showToast('تم الحذف ونقله للسلة');
                });
            }); 
        }

        window.updateLeadStatus = function(leadId, status) {
            const activeFile = state.excelFiles.find(f => f.id === state.activeFileId);
            if(activeFile) {
                const leadIndex = activeFile.leads.findIndex(l => l.id === leadId);
                if(leadIndex !== -1) {
                    if(status === 'follow-up') {
                        showPromptModal('ملاحظة المتابعة:', activeFile.leads[leadIndex].notes, (val) => { 
                            activeFile.leads[leadIndex].status = status; activeFile.leads[leadIndex].notes = val;
                            db.collection('ExcelFiles').doc(activeFile.id).update({ leads: activeFile.leads });
                        });
                    } else {
                        activeFile.leads[leadIndex].status = status;
                        db.collection('ExcelFiles').doc(activeFile.id).update({ leads: activeFile.leads });
                    }
                }
            }
        }

            if(!lead) return;

            let agentsOptions = '';
            
            if(isAdminOrTL) {
                const agents = state.currentUser.role === 'admin' ? state.users : state.users.filter(u => u.teamLeaderId === state.currentUser.id || u.id === state.currentUser.id);
                agentsOptions = agents.filter(u => u.role !== 'data_entry' && !u.isDeleted).map(u => `<option value="${u.id}" ${u.id === state.currentUser.id ? 'selected' : ''}>${u.name}</option>`).join('');

            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 flex justify-between rounded-t-2xl">

                            <label class="block text-sm font-bold mb-1 dark:text-gray-300">نوع العقار المهتم به *</label>

                                <option value="سكني">سكني</option>
                                <option value="تجاري">تجاري</option>

                            </select>

                        <div>
                            <label class="block text-sm font-bold mb-1 dark:text-gray-300">الميزانية المتوقعة *</label>

                            <label class="block text-sm font-bold mb-1 dark:text-gray-300">مصدر العميل *</label>
                            <select id="cv-source" class="royal-input" required>
                                <option value="أورجانيك">أورجانيك (Organic)</option>
                                <option value="كامبين">كامبين (Campaign)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1 dark:text-gray-300">تاريخ المتابعة القادم *</label>
                            <input type="date" id="cv-date" class="royal-input" required value="${new Date().toISOString().split('T')[0]}">
                        </div>
                        ${isAdminOrTL ? `
                        <div class="col-span-2">
                            <label class="block text-sm font-bold mb-1 dark:text-gray-300">إسناد العميل للموظف</label>
                            <select id="cv-agent" class="royal-input">${agentsOptions}</select>
                        </div>` : ''}
                    </div>
                    <button type="submit" class="w-full mt-4 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl shadow-lg transition-transform hover:-translate-y-1">
                        تأكيد ونقل للـ CRM
                    </button>
                </form>
            `);

        window.confirmConvertLead = function(e, leadId) {
            e.preventDefault();
            const activeFile = state.excelFiles.find(f => f.id === state.activeFileId);
            const leadIndex = activeFile.leads.findIndex(l => l.id === leadId);
            const lead = activeFile.leads[leadIndex];
            const isAdminOrTL = ['admin', 'team_leader'].includes(state.currentUser.role);
            const targetAgentId = isAdminOrTL && document.getElementById('cv-agent') ? parseInt(document.getElementById('cv-agent').value) : state.currentUser.id;

            activeFile.leads[leadIndex].status = 'converted';
            db.collection('ExcelFiles').doc(activeFile.id).update({ leads: activeFile.leads });

            const newClient = {
                id: Date.now(), 
                name: lead.name, 
                phone: lead.phone, 
                email: '', 
                address: '', 
                propertyType: document.getElementById('cv-type').value, 
                budget: parseInt(document.getElementById('cv-budget').value) || 0, 
                interests: lead.notes || 'تأهيل من الإكسيل', 
                agentId: targetAgentId, 
                source: `إكسيل: ${activeFile.name}`, 
                sourceType: document.getElementById('cv-source').value, 
                followUpDate: document.getElementById('cv-date').value, 
                isDeleted: false, 
                history: [{date: getExactDateTime(), note: 'تم تأهيل العميل ونقله من الإكسيل.'}], 
                clientNotes: []
            };
            
            db.collection('Clients').doc(newClient.id.toString()).set(newClient);
            
            logActivity(state.currentUser.id, 'تأهيل عميل', `نقل العميل (${lead.name}) للـ CRM.`);
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            showToast('تم النقل بنجاح!'); 
            closeModal();
        }

        window.handleExcelUploadWorker = function(e) {
            const file = e.target.files[0]; 
            if(!file) return; 
            showLoader("جاري قراءة الشيت...");
            const reader = new FileReader();
            reader.onload = function(evt) {
                const workerCode = `
                    importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); 
                    self.onmessage = function(e) { 
                        try { 
                            const workbook = XLSX.read(e.data, { type: 'binary' }); 
                            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 }); 
                            self.postMessage({ success: true, data: json }); 
                        } catch (err) { 
                            self.postMessage({ success: false, error: err.message }); 
                        } 
                    };
                `;
                const blob = new Blob([workerCode], { type: 'application/javascript' }); 
                const workerUrl = URL.createObjectURL(blob); 
                const worker = new Worker(workerUrl);
                
                worker.onmessage = function(msg) {
                    if(msg.data.success) {
                        let extractedLeads = [];
                        for(let i=1; i<msg.data.data.length; i++) { 
                            const row = msg.data.data[i]; 
                            if(row[0] && row[1]) {
                                extractedLeads.push({ id: Date.now() + i, name: row[0], phone: String(row[1]), status: 'new', agentId: state.currentUser.id, notes: row[2] || '' }); 
                            }
                        }
                        const newFile = { 
                            id: 'f' + Date.now(), 
                            name: file.name, 
                            date: new Date().toISOString().split('T')[0], 
                            leads: extractedLeads, 
                            isDeleted: false, 
                            uploadedBy: state.currentUser.id 
                        };
                        
                        db.collection('ExcelFiles').doc(newFile.id).set(newFile);
                        logActivity(state.currentUser.id, 'رفع إكسيل', `تم رفع ملف (${file.name}) يحتوي على ${extractedLeads.length} عميل.`);
                        hideLoader(); 
                        showToast(`تم استيراد ${extractedLeads.length} عميل`);
                    } else { 
                        hideLoader(); 
                        showToast('خطأ في الملف المرفوع', 'error'); 
                    }
                    worker.terminate(); 
                    URL.revokeObjectURL(workerUrl);
                }; 
                worker.postMessage(evt.target.result);
            }; 
            reader.readAsBinaryString(file); 
            e.target.value = '';
        }

                    return c.name.toLowerCase().includes(term) || c.phone.includes(term) || c.interests.toLowerCase().includes(term) || agentName.toLowerCase().includes(term);

        window.saveClientNote = function(clientId) {
            const noteText = document.getElementById('new-client-note').value.trim(); 
            const noteDateEl = document.getElementById('new-client-note-date');
            const noteDateVal = noteDateEl ? noteDateEl.value : null;
            
            if(!noteText) return; 
            
            const c = state.clients.find(x => x.id === clientId); 
            if(!c.clientNotes) c.clientNotes = [];
            
            const finalDate = noteDateVal ? new Date(noteDateVal).toISOString() : new Date().toISOString();

            const newNote = { id: Date.now(), text: noteText, date: finalDate }; 
            c.clientNotes.push(newNote); 
            c.history.push({ date: new Date().toISOString(), note: 'تم إضافة ملاحظة جديدة للعميل.' });
            
            db.collection('Clients').doc(clientId.toString()).update({ 
                clientNotes: c.clientNotes, 
                history: c.history 
            }).then(() => { 
                logActivity(state.currentUser.id, 'ملاحظة عميل', `أضاف ملاحظة للعميل ${c.name}`); 
                openClientProfile(clientId); 
                showToast('تم حفظ الملاحظة'); 
            });
        }

        window.deleteClientNote = function(clientId, noteId) {
            showConfirmModal('هل أنت متأكد من حذف هذه الملاحظة؟', 'حذف', 'bg-red-600', () => {
                const c = state.clients.find(x => x.id === clientId); 
                c.clientNotes = c.clientNotes.filter(n => n.id !== noteId);
                db.collection('Clients').doc(clientId.toString()).update({ clientNotes: c.clientNotes }).then(() => { 
                    openClientProfile(clientId); 
                });
            });
        }

        window.loadWaFloors = function(projId) { 
            const floorSel = document.getElementById('wa-floor'); 
            const unitSel = document.getElementById('wa-unit'); 
            if(!projId) { 
                floorSel.innerHTML = '<option value="">-- اختر المشروع أولاً --</option>'; 
                floorSel.disabled=true; 
                unitSel.innerHTML='<option value="">-- اختر الدور أولاً --</option>'; 
                unitSel.disabled=true; 
                return; 
            } 
            const proj = state.projects.find(p => p.id == projId); 
            let opts = '<option value="">-- اختر الدور --</option>'; 
            (proj.floors || []).forEach(f => { opts += `<option value="${f.id}">${f.name}</option>`; }); 
            floorSel.innerHTML = opts; 
            floorSel.disabled = false; 
            unitSel.innerHTML = '<option value="">-- اختر الدور أولاً --</option>'; 
            unitSel.disabled = true; 
        }

        window.loadWaUnits = function(floorId) { 
            const projId = document.getElementById('wa-proj').value; 
            const unitSel = document.getElementById('wa-unit'); 
            if(!floorId) { 
                unitSel.innerHTML = '<option value="">-- اختر الدور أولاً --</option>'; 
                unitSel.disabled = true; 
                return; 
            } 
            const proj = state.projects.find(p => p.id == projId); 
            const floor = (proj.floors || []).find(f => f.id == floorId); 
            let opts = '<option value="">-- اختر الوحدة --</option>'; 
            (floor.units || []).forEach(u => { opts += `<option value="${u.id}">${u.title} - ${formatCurrency(u.price)}</option>`; }); 
            unitSel.innerHTML = opts; 
            unitSel.disabled = false; 
        }

        window.sendWhatsAppFlow = function(clientId) {
            const client = state.clients.find(c => c.id === clientId); 
            const projId = document.getElementById('wa-proj').value; 
            const floorId = document.getElementById('wa-floor').value; 
            const unitId = document.getElementById('wa-unit').value;
            
            if(!unitId) return showToast('يرجى تحديد الوحدة للإرسال!', 'error');
            
            const proj = state.projects.find(p => p.id == projId); 
            const floor = (proj.floors || []).find(f => f.id == floorId); 
            const unit = (floor.units || []).find(u => u.id == unitId);
            
            let msg = `*عرض وحدة مميزة من ${state.settings.companyName}* 🌟\n\n`; 
            msg += `🏢 *المشروع:* ${proj.name}\n📍 *الموقع:* ${proj.location}\n`; 
            msg += `🚪 *الدور:* ${floor.name}\n`; 
            msg += `🏘️ *الوحدة:* ${unit.title}\n`; 
            msg += `💰 *السعر:* ${formatCurrency(unit.price)}\n`; 
            msg += `📐 *المساحة:* ${unit.area}م²\n`; 
            
            if(unit.type === 'سكني') { 
                msg += `🛏️ *عدد الغرف:* ${unit.beds}\n`; 
                if(unit.baths > 0) msg += `🛁 *الحمامات:* ${unit.baths}\n`; 
            }
            
            const compSlug = state.settings.companyName.replace(/\s+/g, '').toLowerCase(); 
            const smartLink = `https://system.${compSlug}.com/unit/${proj.id}/${floor.id}/${unit.id}`; 
            msg += `\n*🖼️ لمشاهدة جميع صور الوحدة (${(unit.images || []).length} صور) والتفاصيل، برجاء الضغط على الرابط التالي:*\n`; 
            msg += `${smartLink}\n\nنسعد بتواصلكم معنا.`;
            
            let phone = client.phone.trim(); 
            if(phone.startsWith('01')) phone = '+20' + phone.substring(1); 
            
            const whatsappUrl = `https://wa.me/${phone.replace(/[^0-9\+]/g, '')}?text=${encodeURIComponent(msg)}`;
            
            client.history.push({ date: getExactDateTime(), note: `إرسال تفاصيل وحدة (${unit.title}) عبر الواتساب.` }); 
            db.collection('Clients').doc(clientId.toString()).update({ history: client.history }).then(() => { 
                logActivity(state.currentUser.id, 'مراسلة عميل', `قام بإرسال تفاصيل الوحدة (${unit.title}) بمشروع (${proj.name}) للعميل (${client.name}) عبر الواتساب.`); 
                window.open(whatsappUrl, '_blank'); 
                closeModal(); 
                showToast('جاري فتح الواتساب...'); 
            });
        }

                <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">بحث في أسماء المشاريع والمواقع</label>
                <input type="text" id="fps-search" class="royal-input text-lg font-bold" placeholder="اكتب اسم المشروع أو الموقع للبحث..." value="${state.filters.projSearch}" oninput="updateProjFilters()">

            openModal(`

        window.handleAddProject = async function(e) {
            e.preventDefault(); 
            const fileInput = document.getElementById('npr-imgs'); 
            let imagesArray = ['https://placehold.co/800x400/1e293b/D4AF37?text=No+Image'];
            
            if (fileInput.files.length > 0) { 
                showLoader('جاري الرفع...'); 
                try { imagesArray = await readMultipleFiles(fileInput.files); } catch (err) {} 
                hideLoader(); 
            }
            
            const newProj = { 
                id: Date.now(), 
                name: document.getElementById('npr-name').value, 
                location: document.getElementById('npr-loc').value, 
                images: imagesArray, 
                floors: [], 
                constructionStages: [], 
                isDeleted: false 
            };
            
            db.collection('Projects').doc(newProj.id.toString()).set(newProj).then(() => { 
                logActivity(state.currentUser.id, 'مشاريع', `تم إنشاء مشروع جديد: ${newProj.name}`); 
                closeModal(); 
                showToast('تم إنشاء المشروع بنجاح.'); 
            });
        }

        function renderProjectDetails(projId) {
            const proj = state.projects.find(p => p.id === projId); 
            const isDataEntryOrAdmin = ['admin', 'data_entry'].includes(state.currentUser.role); 
            const isSuperAdmin = state.currentUser.role === 'admin'; 
            let totalAvail = 0;
            
            const floorsHTML = (proj.floors || []).map(floor => {
                const availUnits = (floor.units || []).filter(u => u.status === 'available').length; 
                totalAvail += availUnits; 
                const isClosed = (floor.units || []).length > 0 && availUnits === 0;
                
                const unitsHTML = (floor.units || []).map(u => {
                    const isMine = u.agentId === state.currentUser.id || u.coAgentId === state.currentUser.id; 
                    const canInteract = u.status === 'available' || ['admin', 'team_leader'].includes(state.currentUser.role) || isMine;
                    
                    const steps = [{id:'available',lbl:'متاح',c:'bg-green-500'},{id:'negotiation',lbl:'تفاوض',c:'bg-gray-500'},{id:'reserved',lbl:'حجز',c:'bg-yellow-500'},{id:'sold',lbl:'مباع',c:'bg-red-600'}]; 
                    const cIdx = steps.findIndex(s => s.id === u.status);
                    
                    let stepHTML = `<div class="flex justify-between items-center mt-3 relative before:absolute before:w-full before:h-1 before:bg-gray-200 dark:before:bg-gray-700 before:-z-10 before:top-2">`; 
                    steps.forEach((s, i) => { 
                        const isPast = i <= cIdx; 
                        const isCur = i === cIdx; 
                        let cls = isPast ? s.c + ' text-white' : 'bg-gray-200 text-transparent'; 
                        if(isCur && s.id==='sold') cls += ' status-sold-glow scale-110'; 
                        if(isCur && s.id==='reserved') cls += ' status-reserved-glow scale-110'; 
                        stepHTML += `<div class="flex flex-col items-center z-10"><div class="w-5 h-5 rounded flex items-center justify-center text-[10px] ${cls}"><i class="fas fa-check"></i></div><span class="text-[10px] font-bold mt-1 text-gray-500">${s.lbl}</span></div>`; 
                    }); 
                    stepHTML += `</div>`;
                    
                    let specifics = `<span class="text-xs font-bold dark:text-gray-300"><i class="fas fa-ruler text-royal-gold"></i> ${u.area}م²</span>`; 
                    if(u.type === 'سكني') specifics += `<span class="text-xs font-bold dark:text-gray-300 ml-2"><i class="fas fa-bed text-royal-gold"></i> ${u.beds} غرف</span>`;
                    
                    return `
                    <div class="prop-card bg-white dark:bg-royal-darkCard rounded-xl shadow border border-gray-100 dark:border-gray-700 overflow-hidden flex flex-col ${u.status==='sold'?'border-red-500':''}">

        window.openEditProjectModal = function(projId) { 
            const proj = state.projects.find(p => p.id === projId); 
            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 rounded-t-2xl flex justify-between">

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg mt-6">حفظ التعديلات</button>
                </form>
            `); 
        }
        
        window.handleEditProject = async function(e, projId) { 
            e.preventDefault(); 
            const proj = state.projects.find(p => p.id === projId); 
            const fileInput = document.getElementById('eproj-imgs'); 
            
            if (fileInput.files.length > 0) { 
                showLoader('جاري التحديث...'); 
                try { proj.images = await readMultipleFiles(fileInput.files); } catch (err) {} 
                hideLoader(); 
            } 
            
            proj.name = document.getElementById('eproj-name').value; 
            proj.location = document.getElementById('eproj-loc').value; 
            
            db.collection('Projects').doc(projId.toString()).update({ name: proj.name, location: proj.location, images: proj.images }).then(() => { 
                logActivity(state.currentUser.id, 'مشاريع', `تم تعديل بيانات المشروع: ${proj.name}`); 
                closeModal(); 
                showToast('تم تعديل المشروع بنجاح.'); 
            }); 
        }

        window.openAddFloorModal = function(projId) { 
            showPromptModal('أدخل اسم الدور الجديد (مثال: الدور الأرضي، الدور الأول...):', '', (val) => { 
                if(val.trim()) { 
                    const proj = state.projects.find(p => p.id === projId); 
                    if(!proj.floors) proj.floors = []; 
                    proj.floors.push({ id: Date.now(), name: val, units: [] }); 
                    
                    db.collection('Projects').doc(projId.toString()).update({ floors: proj.floors }).then(() => { 
                        logActivity(state.currentUser.id, 'مشاريع', `إضافة ${val} لمشروع ${proj.name}`); 
                        showToast('تم إضافة الدور.'); 
                    }); 
                } 
            }); 
        }

            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 rounded-t-2xl flex justify-between">
                    <h3 class="font-black text-xl dark:text-white"><i class="fas fa-plus text-blue-500"></i> إضافة وحدة</h3>

                        <select id="nu-type" class="royal-input" onchange="toggleUnitBeds(this.value, 'nu-beds-wrap')">

                        <input type="file" id="nu-imgs" multiple accept="image/*" class="royal-input text-sm">

            `); 
        }
        
        window.toggleUnitBeds = function(val, wrapId) { 
            document.getElementById(wrapId).style.display = (val === 'سكني') ? 'block' : 'none'; 
        }

        window.handleAddUnit = async function(e, projId, floorId) {
            e.preventDefault(); 
            const fileInput = document.getElementById('nu-imgs'); 
            let imagesArray = ['https://placehold.co/800x400/1e293b/D4AF37?text=Unit+Image']; 
            
            if (fileInput.files.length > 0) { 
                showLoader('جاري رفع الصور...'); 
                try { imagesArray = await readMultipleFiles(fileInput.files); } catch(err){} 
                hideLoader(); 
            }
            
            const proj = state.projects.find(p => p.id === projId); 
            const floor = proj.floors.find(f => f.id === floorId); 
            const type = document.getElementById('nu-type').value; 
            const beds = type === 'سكني' ? parseInt(document.getElementById('nu-beds').value) || 0 : 0;
            
            const newUnit = { 
                id: Date.now(), 
                title: document.getElementById('nu-title').value, 
                type: type, 
                price: parseInt(document.getElementById('nu-price').value), 
                area: parseInt(document.getElementById('nu-area').value), 
                beds: beds, 
                baths: type === 'سكني' ? 1 : 0, 
                images: imagesArray, 
                status: 'available', 
                agentId: null, 
                coAgentId: null, 
                clientId: null, 
                notes: '', 
                history: [{date: getExactDateTime(), note: 'تم إضافة الوحدة للنظام.'}] 
            };
            
            if(!floor.units) floor.units = []; 
            floor.units.push(newUnit); 
            
            db.collection('Projects').doc(projId.toString()).update({ floors: proj.floors }).then(() => { 
                logActivity(state.currentUser.id, 'مشاريع', `تم إضافة وحدة (${newUnit.title}) بـ ${proj.name}`); 
                closeModal(); 
                showToast('تم الحفظ'); 
            });
        }

        window.openEditUnitModal = function(projId, floorId, unitId) { 
            const proj = state.projects.find(p => p.id === projId); 
            const floor = proj.floors.find(f => f.id === floorId); 
            const unit = floor.units.find(u => u.id === unitId); 
            
            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 rounded-t-2xl flex justify-between">
                    <h3 class="font-black text-xl dark:text-white"><i class="fas fa-pencil-alt text-blue-500"></i> تعديل بيانات الوحدة</h3>

                        <input type="file" id="eu-imgs" multiple accept="image/*" class="royal-input text-sm">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg mt-4">حفظ التعديلات</button>

        }
        
        window.handleEditUnit = async function(e, pId, fId, uId) { 
            e.preventDefault(); 
            const p = state.projects.find(pr=>pr.id===pId); 
            const u = p.floors.find(f=>f.id===fId).units.find(x=>x.id===uId); 
            
            u.title = document.getElementById('eu-title').value; 
            u.price = parseInt(document.getElementById('eu-price').value); 
            u.type = document.getElementById('eu-type').value; 
            u.area = parseInt(document.getElementById('eu-area').value); 
            u.beds = u.type === 'سكني' ? parseInt(document.getElementById('eu-beds').value) : 0; 
            
            const fileInput = document.getElementById('eu-imgs'); 
            if (fileInput.files.length > 0) { 
                showLoader('جاري التحديث...'); 
                try { u.images = await readMultipleFiles(fileInput.files); } catch(err){} 
                hideLoader(); 
            } 
            
            db.collection('Projects').doc(pId.toString()).update({ floors: p.floors }).then(() => { 
                logActivity(state.currentUser.id, 'وحدة', `قام بتعديل وحدة: ${u.title}`); 
                closeModal(); 
                showToast('تم التعديل بنجاح'); 
            }); 
        }

        window.cancelUnitNegotiation = function(pId, fId, uId) { 
            showConfirmModal('إلغاء التفاوض وجعل الوحدة متاحة؟', 'نعم، إتاحة', 'bg-red-600', () => { 
                const p = state.projects.find(pr=>pr.id===pId); 
                const u = p.floors.find(f=>f.id===fId).units.find(x=>x.id===uId); 
                
                u.status = 'available'; 
                u.clientId = null; 
                u.agentId = null; 
                u.coAgentId = null; 
                u.notes = ''; 
                u.history.push({date: getExactDateTime(), note: 'تم إلغاء التفاوض وإتاحة الوحدة.'}); 
                
                db.collection('Projects').doc(pId.toString()).update({ floors: p.floors }).then(() => { 
                    logActivity(state.currentUser.id, 'إلغاء تفاوض', `أتاح الوحدة: ${u.title}`); 
                    showToast('الوحدة الآن متاحة للجميع'); 
                }); 
            }); 
        }

            const usersOpts = state.users.filter(u => u.id !== state.currentUser.id && u.role !== 'data_entry' && !u.isDeleted).map(u => `<option value="${u.id}">${u.name}</option>`).join('');

        window.saveHelpUnit = function(pId, fId, uId) { 
            const hId = document.getElementById('help-agent').value; 
            if(!hId) return; 
            
            const p = state.projects.find(pr=>pr.id===pId); 
            const u = p.floors.find(f=>f.id===fId).units.find(x=>x.id===uId); 
            u.coAgentId = parseInt(hId);

            db.collection('Projects').doc(pId.toString()).update({ floors: p.floors }).then(() => {

        window.handleUnitStatusChange = function(e, pId, fId, uId) {
            e.preventDefault(); 
            const p = state.projects.find(pr=>pr.id===pId); 
            const u = p.floors.find(f=>f.id===fId).units.find(x=>x.id===uId); 
            const newStatus = document.getElementById('us-status').value; 
            const clientId = document.getElementById('us-client').value; 
            const notes = document.getElementById('us-notes').value; 
            const client = clientId ? state.clients.find(c => c.id == clientId) : null;
            
            if(newStatus !== 'available' && !client) return showToast('يجب اختيار عميل!', 'error');
            
            u.status = newStatus; 
            u.clientId = client ? client.id : null; 
            
            if(u.status === 'available') { 
                u.agentId = null; 
                u.coAgentId = null; 
            } else if(!u.agentId) {
                u.agentId = state.currentUser.id; 
            }
            
            u.notes = notes;
            
            const stTxt = { 'available':'متاح', 'negotiation':'تفاوض', 'reserved':'حجز', 'sold':'مباع' }[newStatus]; 
            const actionTime = getExactDateTime(); 
            u.history.push({ date: actionTime, note: `الحالة: ${stTxt}. الملاحظات: ${notes}` });
            
            if(client) { 
                client.history.push({ date: actionTime, note: `تحديث تفاوض على (${u.title}): ${notes || stTxt}` }); 
                db.collection('Clients').doc(client.id.toString()).update({ history: client.history }); 
            }
            
            db.collection('Projects').doc(pId.toString()).update({ floors: p.floors }).then(() => { 
                if(newStatus === 'sold') { 
                    const comm = u.price * state.settings.commissionRate; 
                    confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } }); 
                    showToast('ألف مبروك! تم إقفال الديل بنجاح.', 'success'); 
                    logActivity(state.currentUser.id, 'تحديث وحدة', `غيّر حالة الوحدة [${u.title}] إلى ${stTxt}. العميل: ${client.name}. **(عمولة: ${formatCurrency(comm)})**`); 
                } else { 
                    showToast('تم التحديث بنجاح'); 
                    logActivity(state.currentUser.id, 'تحديث وحدة', `غيّر حالة الوحدة [${u.title}] إلى ${stTxt}.${client ? ' العميل: ' + client.name : ''}`); 
                } 
                closeModal(); 
            });
        }

        window.handleAddStage = async function(e, projId) { 
            e.preventDefault(); 
            const fileInput = document.getElementById('ns-imgs'); 
            let imagesArray = []; 
            if (fileInput.files.length > 0) { 
                showLoader('جاري الرفع...'); 
                try { imagesArray = await readMultipleFiles(fileInput.files); } catch(err){} 
                hideLoader(); 
            } 
            const proj = state.projects.find(p => p.id === projId); 
            if(!proj.constructionStages) proj.constructionStages = []; 
            
            const newStage = { 
                id: Date.now(), 
                title: document.getElementById('ns-title').value, 
                date: document.getElementById('ns-date').value, 
                description: document.getElementById('ns-desc').value, 
                images: imagesArray 
            }; 
            
            proj.constructionStages.push(newStage); 
            db.collection('Projects').doc(projId.toString()).update({ constructionStages: proj.constructionStages }).then(() => { 
                logActivity(state.currentUser.id, 'مراحل الإنشاء', `تحديث إنشاءات بمشروع ${proj.name}`); 
                closeModal(); 
                showToast('تم النشر بنجاح'); 
            }); 
        }

        window.handleUserSubmit = function(e, id) { 
            e.preventDefault(); 
            const n = document.getElementById('u-name').value; 
            const un = document.getElementById('u-username').value; 
            const r = document.getElementById('u-role') ? document.getElementById('u-role').value : 'admin'; 
            const pass = document.getElementById('u-pass').value; 
            const tlId = r === 'employee' ? (parseInt(document.getElementById('u-tl').value) || null) : null; 
            
            if(id) { 
                const u = state.users.find(x => x.id === id); 
                if(u.username !== un && state.users.find(x => x.username === un && !x.isDeleted)) return showToast('اسم المستخدم محجوز', 'error'); 
                
                const uData = { name: n, username: un, role: r, teamLeaderId: tlId }; 
                if(pass.trim() !== '') uData.password = pass; 
                
                db.collection('Users').doc(id.toString()).update(uData).then(() => { 
                    logActivity(state.currentUser.id, 'إدارة', `تعديل الموظف: ${n}`); 
                    closeModal(); 
                    showToast('تم التعديل'); 
                }); 
            } else { 
                if(state.users.find(x => x.username === un && !x.isDeleted)) return showToast('اسم المستخدم محجوز', 'error'); 
                
                const newUser = { id: Date.now(), name: n, username: un, password: pass, role: r, teamLeaderId: tlId, target: {type: 'money', value: 0}, isDeleted: false }; 
                
                db.collection('Users').doc(newUser.id.toString()).set(newUser).then(() => { 
                    logActivity(state.currentUser.id, 'إدارة', `إنشاء موظف: ${n}`); 
                    closeModal(); 
                    showToast('تمت الإضافة');

        function getReportsHTML() {
            const isTL = state.currentUser.role === 'team_leader'; 
            let myTeamIds = state.users.filter(u => u.teamLeaderId === state.currentUser.id).map(u => u.id); 
            if(isTL) myTeamIds.push(state.currentUser.id);

            const allUnits = getAllUnits(); 
            let filteredProps = allUnits.filter(p => p.status === 'sold');
            
            if(state.filters.reportDateFrom || state.filters.reportDateTo) { 
                const soldEvents = state.archive.filter(a => a.action === 'مباع' || a.action.includes('بيع')); 
                filteredProps = filteredProps.filter(p => { 
                    const event = soldEvents.find(e => e.details.includes(p.title)); 
                    if(event) { 
                        let valid = true; 
                        const evDate = new Date(event.date); 
                        if(state.filters.reportDateFrom && evDate < new Date(state.filters.reportDateFrom)) valid = false; 
                        if(state.filters.reportDateTo) { 
                            const toD = new Date(state.filters.reportDateTo); 
                            toD.setDate(toD.getDate() + 1); 
                            if(evDate >= toD) valid = false; 
                        } 
                        return valid; 
                    } 
                    return true; 
                }); 
            }

            let usersToReport = state.users.filter(u => !u.isDeleted && u.role !== 'data_entry' && u.role !== 'admin'); 
            if(isTL) usersToReport = usersToReport.filter(u => myTeamIds.includes(u.id));

            const empStats = usersToReport.map(u => { 
                const myClients = state.clients.filter(c => !c.isDeleted && c.agentId === u.id).length; 
                const mySoldProps = filteredProps.filter(p => p.agentId === u.id || p.coAgentId === u.id); 
                const salesVol = mySoldProps.reduce((sum, p) => sum + p.price, 0); 
                const myComm = salesVol * state.settings.commissionRate; 
                return { ...u, clients: myClients, deals: mySoldProps.length, vol: salesVol, comm: myComm }; 
            });

            const totalSystemSales = empStats.reduce((sum, u) => sum + u.vol, 0);

            const tableRows = empStats.sort((a,b) => b.vol - a.vol).map(u => `

                </tr>`).join('');

                <div class="flex gap-2 w-full md:w-auto">
