                </div>
            </div>
            <div class="bg-white dark:bg-royal-darkCard p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-xs font-bold text-gray-500 mb-1">الفترة (من)</label><input type="date" id="fr-from" class="royal-input text-sm" value="${state.filters.reportDateFrom}" onchange="updateReportFilters()"></div>

            </div>

                <div class="bg-gray-900 rounded-2xl p-6 text-white shadow-xl relative overflow-hidden">
                    <i class="fas fa-chart-bar absolute -left-4 -bottom-4 text-7xl opacity-20"></i>
                    <p class="text-gray-400 font-bold mb-1">المبيعات المحققة</p><h3 class="text-4xl font-black text-white">${formatCurrency(totalSystemSales)}</h3>
                </div>
            </div>
            <div class="bg-white dark:bg-royal-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden" id="pdf-report-container">
                <div class="p-5 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex justify-between items-center">

        window.exportReportPDF = function() {

            const btns = document.querySelectorAll('.pdf-hide, td:last-child, th:last-child');

        function getArchiveHTML() {
            let filteredArchive = state.archive;

            if (state.currentUser.role !== 'admin') {
                filteredArchive = filteredArchive.filter(a => a.userId === state.currentUser.id);
            }

            if(state.filters.archiveSearch) { 
                const term = state.filters.archiveSearch.toLowerCase(); 
                filteredArchive = filteredArchive.filter(a => { 
                    const user = state.users.find(u => u.id === a.userId); 
                    return a.details.toLowerCase().includes(term) || a.action.toLowerCase().includes(term) || (user && user.name.toLowerCase().includes(term)); 
                }); 
            } 
            
            if(state.filters.archiveDateFrom) {
                filteredArchive = filteredArchive.filter(a => a.date >= state.filters.archiveDateFrom); 
            }

            }

                    <div class="mt-8 text-center pb-2">
                        <div class="creator-badge-wrapper inline-block cursor-pointer mx-auto" title="Developer & Designer">
                            <div class="creator-badge-inner py-1 px-3">
                                <i class="fas fa-paint-brush text-royal-gold animate-pulse-fast text-xs"></i>
                                <span class="font-bold text-gray-800 dark:text-gray-200 text-[10px] tracking-wide font-sans">
                                    Designed by <span class="text-transparent bg-clip-text bg-gradient-to-r from-royal-gold to-vivid-orange font-black">Islam Mahmoud Saad</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`; 
        }

        window.handleLogin = async function(e) { 
            e.preventDefault(); 
            showLoader("جاري تسجيل الدخول...");
            try {
                const snap = await db.collection('Users').get();
                state.users = snap.docs.map(doc => doc.data());
                
                const u = state.users.find(x => x.username === document.getElementById('l-user').value && x.password === document.getElementById('l-pass').value && !x.isDeleted); 
                
                if(u) { 
                    state.currentUser = u; 
                    state.currentView = 'dashboard'; 
                    await initRealtimeListeners(); 
                    logActivity(u.id, 'تسجيل دخول', 'تسجيل دخول للنظام'); 
                    renderApp(); 
                    showToast(`أهلاً بك، ${u.name}!`); 
                } else { 
                    showToast('البيانات غير صحيحة أو الحساب موقوف', 'error'); 
                }
            } catch (err) {
                showToast('خطأ في الاتصال بالخادم', 'error');
            }
            hideLoader();
        }

        window.handleLogout = function() { 
            if(state.currentUser) { 
                logActivity(state.currentUser.id, 'تسجيل خروج', 'تسجيل خروج من النظام'); 
                state.currentUser = null; 
                unsubscribers.forEach(u => u()); 
                unsubscribers=[]; 
                renderApp(); 
            } 
        }

        renderApp();
    </script>
</body>
</html>
