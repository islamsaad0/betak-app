        function renderProjectDetails(projId) {
            const proj = state.projects.find(p => p.id === projId);
            const isAdmin = ['admin', 'data_entry'].includes(state.currentUser.role);
            
            let totalAvail = 0;
            const floorsHTML = (proj.floors || []).map(floor => {
                const availUnits = (floor.units || []).filter(u => u.status === 'available').length;
                totalAvail += availUnits;
                const isClosed = (floor.units || []).length > 0 && availUnits === 0;

                const unitsHTML = (floor.units || []).map(u => {
                    const isMine = u.agentId === state.currentUser.id || u.coAgentId === state.currentUser.id;
                    const canInteract = u.status === 'available' || isAdmin || isMine;
                    
                    const steps = [{id:'available',lbl:'متاح',c:'bg-green-500'},{id:'negotiation',lbl:'تفاوض',c:'bg-gray-500'},{id:'reserved',lbl:'حجز',c:'bg-yellow-500'},{id:'sold',lbl:'مباع',c:'bg-red-600'}];
                    const cIdx = steps.findIndex(s => s.id === u.status);
                    let stepHTML = `<div class="flex justify-between items-center mt-3 relative before:absolute before:w-full before:h-1 before:bg-gray-200 dark:before:bg-gray-700 before:-z-10 before:top-2">`;
                    steps.forEach((s, i) => {
                        const isPast = i <= cIdx; const isCur = i === cIdx;
                        let cls = isPast ? s.c + ' text-white' : 'bg-gray-200 text-transparent';
                        if(isCur && s.id==='sold') cls += ' status-sold-glow scale-110';
                        if(isCur && s.id==='reserved') cls += ' status-reserved-glow scale-110';
                        stepHTML += `<div class="flex flex-col items-center z-10"><div class="w-5 h-5 rounded flex items-center justify-center text-[10px] ${cls}"><i class="fas fa-check"></i></div><span class="text-[10px] font-bold mt-1 text-gray-500">${s.lbl}</span></div>`;
                    }); stepHTML += `</div>`;

                    let specifics = `<span class="text-xs font-bold dark:text-gray-300"><i class="fas fa-ruler text-royal-gold"></i> ${u.area}م²</span>`;
                    if(u.type === 'سكني') specifics += `<span class="text-xs font-bold dark:text-gray-300 ml-2"><i class="fas fa-bed text-royal-gold"></i> ${u.beds} غرف</span>`;

                    return `
                    <div class="prop-card bg-white dark:bg-royal-darkCard rounded-xl shadow border border-gray-100 dark:border-gray-700 overflow-hidden flex flex-col ${u.status==='sold'?'border-red-500':''}">
                        <div class="h-32 relative group">
                            <img src="${(u.images || ['https://placehold.co/800x400/1e293b/D4AF37?text=No+Image'])[0]}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                            ${isAdmin ? `
                            <div class="absolute top-2 right-2 flex gap-1 z-20">
                                <button onclick="event.stopPropagation(); openEditUnitModal(${projId}, ${floor.id}, ${u.id})" class="bg-blue-600/80 hover:bg-blue-700 text-white w-7 h-7 rounded-full flex items-center justify-center shadow-lg transition-transform hover:scale-110" title="تعديل الوحدة"><i class="fas fa-pencil-alt text-xs"></i></button>
                                <button onclick="event.stopPropagation(); deleteUnit(${projId}, ${floor.id}, ${u.id})" class="bg-red-600/80 hover:bg-red-700 text-white w-7 h-7 rounded-full flex items-center justify-center shadow-lg transition-transform hover:scale-110" title="حذف الوحدة نهائياً"><i class="fas fa-trash-alt text-xs"></i></button>
                            </div>
                            ` : ''}
                            <div class="absolute bottom-2 right-2 left-2"><h4 class="text-white font-bold text-sm truncate">${u.title}</h4><p class="text-royal-goldLight font-black text-sm">${formatCurrency(u.price)}</p></div>
                        </div>
                        <div class="p-3 flex-1 flex flex-col">
                            <div class="flex justify-between border-b border-gray-100 dark:border-gray-700 pb-2 mb-2">${specifics}</div>
                            ${stepHTML}
                            <div class="mt-auto pt-4 flex flex-col gap-2">
                                ${canInteract && u.status !== 'sold' ? `
                                    <button onclick="openChangeUnitStatusModal(${projId}, ${floor.id}, ${u.id})" class="w-full bg-gray-50 hover:bg-royal-gold hover:text-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 py-1.5 rounded-lg text-sm font-bold border border-gray-200 dark:border-gray-700 transition-colors">متابعة العميل والتحديث</button>
                                    ${u.status !== 'available' ? `
                                    <div class="flex gap-2">
                                        <button onclick="cancelUnitNegotiation(${projId}, ${floor.id}, ${u.id})" class="flex-1 bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400 py-1 rounded text-[10px] font-bold hover:bg-red-100 transition-colors">إلغاء التفاوض</button>
                                        <button onclick="openHelpUnitModal(${projId}, ${floor.id}, ${u.id})" class="flex-1 bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 py-1 rounded text-[10px] font-bold hover:bg-blue-100 transition-colors">طلب مساعدة</button>
                                    </div>
                                    ` : ''}
                                ` : u.status === 'sold' ? `<div class="w-full bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400 text-center py-1.5 rounded-lg font-bold text-sm"><i class="fas fa-lock mr-1"></i> مباع</div>` : `
                                    <div class="w-full bg-gray-100 text-gray-500 dark:bg-gray-800 text-center py-1.5 rounded-lg font-bold text-xs"><i class="fas fa-lock mr-1"></i> مع ${state.users.find(x=>x.id===u.agentId)?.name}</div>
                                `}
                            </div>
                        </div>
                    </div>`;
                }).join('');

                return `
                <div class="mb-4 bg-white dark:bg-royal-darkCard rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
                    <div class="p-4 bg-gray-50 dark:bg-gray-800/50 flex justify-between items-center cursor-pointer select-none" onclick="toggleAccordion(${floor.id})">
                        <div class="flex items-center gap-3">
                            <h3 class="font-black text-lg dark:text-white">${floor.name}</h3>
                            ${isClosed ? `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">مغلق (Sold Out)</span>` : `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">${availUnits} متاح من ${(floor.units || []).length}</span>`}
                        </div>
                        <div class="flex items-center gap-4">
                            ${isAdmin ? `
                            <button onclick="event.stopPropagation(); deleteFloor(${projId}, ${floor.id})" class="text-red-600 hover:text-red-800 text-sm font-bold bg-red-50 hover:bg-red-100 px-3 py-1 rounded transition-colors" title="حذف الدور بجميع وحداته"><i class="fas fa-trash-alt"></i></button>
                            <button onclick="event.stopPropagation(); openAddUnitModal(${projId}, ${floor.id})" class="text-blue-600 hover:text-blue-800 text-sm font-bold bg-blue-50 px-3 py-1 rounded"><i class="fas fa-plus"></i> إضافة وحدة</button>
                            ` : ''}
                            <i id="acc-icon-${floor.id}" class="fas fa-chevron-down text-gray-400 accordion-icon"></i>
                        </div>
                    </div>
                    <div id="acc-content-${floor.id}" class="accordion-content p-4 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 bg-gray-50/50 dark:bg-royal-darkBg">
                        ${unitsHTML || '<div class="col-span-full text-center text-gray-400 py-6 font-bold">لم يتم إضافة وحدات لهذا الدور بعد</div>'}
                    </div>
                </div>`;
            }).join('');

            return `
            <div class="mb-6 flex gap-4 items-center">
                <button onclick="state.viewedProject=null; renderView();" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 text-gray-700 dark:text-gray-200 px-4 py-2 rounded-xl font-bold shadow transition-colors"><i class="fas fa-arrow-right ml-2"></i>عودة للمشاريع</button>
                <h2 class="text-3xl font-black dark:text-white text-royal-gold">${proj.name}</h2>
            </div>
            
            <div class="bg-white dark:bg-royal-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 p-6 mb-6 flex flex-col md:flex-row gap-6 relative overflow-hidden">
                <div class="w-full md:w-1/3 h-48 rounded-xl overflow-hidden shadow-inner"><img src="${(proj.images || [])[0] || 'https://placehold.co/800x400/1e293b/D4AF37?text=No+Image'}" class="w-full h-full object-cover"></div>
                <div class="flex-1 flex flex-col justify-center">
                    <p class="text-gray-500 dark:text-gray-400 font-bold mb-2"><i class="fas fa-map-marker-alt text-vivid-orange"></i> ${proj.location}</p>
                    <div class="flex gap-6 mt-4">
                        <div class="text-center"><span class="block text-2xl font-black dark:text-white">${(proj.floors || []).length}</span><span class="text-sm text-gray-500 font-bold">إجمالي الأدوار</span></div>
                        <div class="text-center"><span class="block text-2xl font-black text-green-500">${totalAvail}</span><span class="text-sm text-gray-500 font-bold">إجمالي الوحدات المتاحة</span></div>
                    </div>
                </div>
                <div class="flex gap-2 mt-4 md:mt-0 md:absolute md:bottom-6 md:left-6">
                    ${isAdmin ? `
                    <button onclick="openEditProjectModal(${projId})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-bold shadow-lg transition-transform hover:-translate-y-1 text-sm"><i class="fas fa-edit"></i> تعديل</button>
                    <button onclick="openAddFloorModal(${projId})" class="bg-vivid-orange hover:bg-vivid-orangeDark text-white px-4 py-2.5 rounded-xl font-bold shadow-lg transition-transform hover:-translate-y-1 text-sm"><i class="fas fa-layer-group"></i> دور جديد</button>
                    ` : ''}
                </div>
            </div>

            <div class="mb-10">
                <h3 class="text-xl font-black dark:text-white mb-4"><i class="fas fa-building text-royal-gold"></i> المخطط الداخلي للمشروع (الأدوار والوحدات)</h3>
                ${floorsHTML || '<div class="text-center p-10 bg-white dark:bg-royal-darkCard rounded-xl shadow-sm text-gray-400 font-bold border border-gray-100 dark:border-gray-800">لا يوجد أدوار مسجلة في هذا المشروع</div>'}
            </div>`;
        }

        window.openEditProjectModal = function(projId) {
            const proj = state.projects.find(p => p.id === projId);
            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 rounded-t-2xl flex justify-between">
                    <h3 class="font-black text-xl dark:text-white"><i class="fas fa-edit text-blue-500"></i> تعديل المشروع</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
                </div>
                <form onsubmit="handleEditProject(event, ${projId})" class="p-6 bg-white dark:bg-royal-darkCard rounded-b-2xl space-y-4">
                    <div><label class="block text-sm font-bold mb-1 dark:text-gray-300">اسم المشروع *</label><input type="text" id="eproj-name" class="royal-input text-lg font-bold" required value="${proj.name}"></div>
                    <div><label class="block text-sm font-bold mb-1 dark:text-gray-300">موقع المشروع *</label><input type="text" id="eproj-loc" class="royal-input" required value="${proj.location}"></div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">صورة الواجهة الرئيسية (اتركه فارغاً للحفاظ على الصورة القديمة)</label>
                        <input type="file" id="eproj-imgs" multiple accept="image/*" class="royal-input text-sm file:bg-gray-200 file:border-0 file:rounded-lg file:px-4 file:py-2">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg mt-6 transition-colors">حفظ التعديلات</button>
                </form>
            `);
        }

        window.handleEditProject = async function(e, projId) {
            e.preventDefault();
            const proj = state.projects.find(p => p.id === projId);
            proj.name = document.getElementById('eproj-name').value;
            proj.location = document.getElementById('eproj-loc').value;
            
            const fileInput = document.getElementById('eproj-imgs');
            if (fileInput.files.length > 0) {
                showLoader('جاري تحديث واجهة المشروع...');
                try { 
                    proj.images = await readMultipleFiles(fileInput.files); 
                } catch (err) { 
                    showToast('خطأ بالصور', 'error'); 
                }
                hideLoader();
            }
            
            logActivity(state.currentUser.id, 'إدارة مشاريع', `تم تعديل بيانات المشروع: ${proj.name}`);
            closeModal(); 
            showToast('تم تعديل المشروع بنجاح.'); 
            renderView();
        }

        window.openAddFloorModal = function(projId) {
            showPromptModal('أدخل اسم الدور الجديد (مثال: الدور الأرضي، الدور الأول...):', '', (val) => {
                if(val.trim()) {
                    const proj = state.projects.find(p => p.id === projId);
                    if(!proj.floors) proj.floors = [];
                    proj.floors.push({ id: Date.now(), name: val, units: [] });
                    logActivity(state.currentUser.id, 'إدارة مشاريع', `إضافة ${val} لمشروع ${proj.name}`);
                    showToast('تم إضافة الدور. يمكنك إضافة وحدات بداخله الآن.'); renderView();
                }
            });
        }

        window.openAddUnitModal = function(projId, floorId) {
            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 rounded-t-2xl flex justify-between">
                    <h3 class="font-black text-xl dark:text-white"><i class="fas fa-plus text-blue-500"></i> إضافة وحدة جديدة للدور</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
                </div>
                <form onsubmit="handleAddUnit(event, ${projId}, ${floorId})" class="p-6 bg-white dark:bg-royal-darkCard rounded-b-2xl space-y-4">
                    <input type="text" id="nu-title" class="royal-input" required placeholder="اسم/رقم الوحدة (مثال: شقة 101)">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="nu-price" class="royal-input" required placeholder="السعر" min="0">
                        <select id="nu-type" class="royal-input" onchange="toggleUnitBeds(this.value, 'nu-beds-wrap')"><option value="سكني">سكني</option><option value="تجاري">تجاري/إداري</option></select>
                        <input type="number" id="nu-area" class="royal-input" required placeholder="المساحة (م²)" min="0">
                        <div id="nu-beds-wrap"><input type="number" id="nu-beds" class="royal-input" placeholder="عدد الغرف" value="0"></div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">صور الوحدة الداخية (متاح أكثر من صورة)</label>
                        <input type="file" id="nu-imgs" multiple accept="image/*" class="royal-input text-sm file:bg-gray-200 file:border-0 file:rounded-lg file:px-4 file:py-2">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg mt-4">حفظ الوحدة بالدور</button>
                </form>
            `);
        }

        window.toggleUnitBeds = function(val, wrapId) { document.getElementById(wrapId).style.display = (val === 'سكني') ? 'block' : 'none'; }

        window.handleAddUnit = async function(e, projId, floorId) {
            e.preventDefault();
            const fileInput = document.getElementById('nu-imgs');
            let imagesArray = ['https://placehold.co/800x400/1e293b/D4AF37?text=Unit+Image'];
            if (fileInput.files.length > 0) { showLoader('جاري رفع الصور...'); try { imagesArray = await readMultipleFiles(fileInput.files); } catch(err){} hideLoader(); }
            
            const proj = state.projects.find(p => p.id === projId);
            const floor = proj.floors.find(f => f.id === floorId);
            const type = document.getElementById('nu-type').value;
            const beds = type === 'سكني' ? parseInt(document.getElementById('nu-beds').value) || 0 : 0;

            const newUnit = {
                id: Date.now(), title: document.getElementById('nu-title').value, type: type,
                price: parseInt(document.getElementById('nu-price').value), area: parseInt(document.getElementById('nu-area').value),
                beds: beds, baths: type === 'سكني' ? 1 : 0, images: imagesArray, status: 'available',
                agentId: null, coAgentId: null, clientId: null, notes: '', history: [{date: getExactDateTime(), note: 'تم إضافة الوحدة للنظام.'}]
            };
            if(!floor.units) floor.units = [];
            floor.units.push(newUnit);
            logActivity(state.currentUser.id, 'إدارة مشاريع', `تم إضافة وحدة (${newUnit.title}) بـ ${proj.name}`);
            closeModal(); showToast('تم الحفظ'); renderView();
            setTimeout(() => toggleAccordion(floorId), 100); 
        }

        window.openEditUnitModal = function(projId, floorId, unitId) {
            const proj = state.projects.find(p => p.id === projId);
            const floor = proj.floors.find(f => f.id === floorId);
            const unit = floor.units.find(u => u.id === unitId);
            
            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 rounded-t-2xl flex justify-between">
                    <h3 class="font-black text-xl dark:text-white"><i class="fas fa-pencil-alt text-blue-500"></i> تعديل بيانات الوحدة</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
                </div>
                <form onsubmit="handleEditUnit(event, ${projId}, ${floorId}, ${unitId})" class="p-6 bg-white dark:bg-royal-darkCard rounded-b-2xl space-y-4">
                    <input type="text" id="eu-title" class="royal-input" required value="${unit.title}">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="eu-price" class="royal-input" required value="${unit.price}">
                        <select id="eu-type" class="royal-input" onchange="toggleUnitBeds(this.value, 'eu-beds-wrap')">
                            <option value="سكني" ${unit.type==='سكني'?'selected':''}>سكني</option>
                            <option value="تجاري" ${unit.type==='تجاري'?'selected':''}>تجاري</option>
                        </select>
                        <input type="number" id="eu-area" class="royal-input" required value="${unit.area}">
                        <div id="eu-beds-wrap" style="display:${unit.type==='سكني'?'block':'none'}"><input type="number" id="eu-beds" class="royal-input" value="${unit.beds}"></div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">تحديث الصور (سيتم الاستبدال إذا رفعت صور جديدة)</label>
                        <input type="file" id="eu-imgs" multiple accept="image/*" class="royal-input text-sm file:bg-gray-200 file:border-0 file:rounded-lg file:px-4 file:py-2">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg mt-4">حفظ التعديلات</button>
                </form>
            `);
        }

        window.handleEditUnit = async function(e, pId, fId, uId) {
            e.preventDefault();
            const u = state.projects.find(p=>p.id===pId).floors.find(f=>f.id===fId).units.find(x=>x.id===uId);
            u.title = document.getElementById('eu-title').value;
            u.price = parseInt(document.getElementById('eu-price').value);
            u.type = document.getElementById('eu-type').value;
            u.area = parseInt(document.getElementById('eu-area').value);
            u.beds = u.type === 'سكني' ? parseInt(document.getElementById('eu-beds').value) : 0;
            
            const fileInput = document.getElementById('eu-imgs');
            if (fileInput.files.length > 0) {
                showLoader('جاري التحديث...');
                try { u.images = await readMultipleFiles(fileInput.files); } catch(err){}
                hideLoader();
            }
            logActivity(state.currentUser.id, 'تعديل وحدة', `قام بتعديل وحدة: ${u.title}`);
            closeModal(); showToast('تم التعديل بنجاح'); renderView();
            setTimeout(() => { const el = document.getElementById('acc-content-'+fId); if(el) el.classList.add('open'); document.getElementById('acc-icon-'+fId).classList.add('open'); }, 100);
        }

        window.cancelUnitNegotiation = function(pId, fId, uId) {
            showConfirmModal('إلغاء التفاوض وجعل الوحدة متاحة؟', 'نعم، إتاحة', 'bg-red-600', () => {
                const u = state.projects.find(p=>p.id===pId).floors.find(f=>f.id===fId).units.find(x=>x.id===uId);
                u.status = 'available'; u.clientId = null; u.agentId = null; u.coAgentId = null; u.notes = '';
                u.history.push({date: getExactDateTime(), note: 'تم إلغاء التفاوض وإتاحة الوحدة.'});
                logActivity(state.currentUser.id, 'إلغاء تفاوض', `أتاح الوحدة: ${u.title}`);
                showToast('الوحدة الآن متاحة للجميع'); renderView();
            });
        }

        window.openHelpUnitModal = function(pId, fId, uId) {
            const usersOpts = state.users.filter(u => u.id !== state.currentUser.id && u.role !== 'data_entry' && !u.isDeleted).map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 rounded-t-2xl flex justify-between"><h3 class="font-black text-xl dark:text-white">طلب مساعدة زميل</h3><button onclick="closeModal()" class="text-gray-400 hover:text-red-500"><i class="fas fa-times"></i></button></div>
                <div class="p-6 bg-white dark:bg-royal-darkCard rounded-b-2xl space-y-4">
                    <p class="font-bold text-gray-700 dark:text-gray-300">اختر الزميل ليشاركك التفاوض على هذه الوحدة.</p>
                    <select id="help-agent" class="royal-input"><option value="">-- اختر الزميل --</option>${usersOpts}</select>
                    <button onclick="saveHelpUnit(${pId}, ${fId}, ${uId})" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg mt-4">إرسال طلب المساعدة</button>
                </div>
            `);
        }

        window.saveHelpUnit = function(pId, fId, uId) {

            const u = state.projects.find(p=>p.id===pId).floors.find(f=>f.id===fId).units.find(x=>x.id===uId);
            const isAdmin = ['admin', 'team_leader'].includes(state.currentUser.role);
            const availableClients = isAdmin ? state.clients : state.clients.filter(c => c.agentId === state.currentUser.id);
            const clientsOptions = availableClients.filter(c => !c.isDeleted).map(c => `<option value="${c.id}" ${u.clientId == c.id ? 'selected' : ''}>${c.name}</option>`).join('');

                    </div>

                        <textarea id="us-notes" class="royal-input" rows="2" placeholder="اكتب تفاصيل المفاوضات...">${u.notes || ''}</textarea>
                    </div>

            `);

        window.toggleUnitClientReq = function(val) { document.getElementById('uclient-wrap').style.display = (val === 'available') ? 'none' : 'block'; }

        window.handleUnitStatusChange = function(e, pId, fId, uId) {
            e.preventDefault();
            const u = state.projects.find(p=>p.id===pId).floors.find(f=>f.id===fId).units.find(x=>x.id===uId);
            const newStatus = document.getElementById('us-status').value;
            const clientId = document.getElementById('us-client').value;
            const notes = document.getElementById('us-notes').value;
            const client = clientId ? state.clients.find(c => c.id == clientId) : null;
            
            if(newStatus !== 'available' && !client) return showToast('يجب اختيار عميل!', 'error');

            u.status = newStatus; u.clientId = client ? client.id : null; 
            if(u.status === 'available') { u.agentId = null; u.coAgentId = null; }
            else if(!u.agentId) u.agentId = state.currentUser.id;
            u.notes = notes;

            const stTxt = { 'available':'متاح', 'negotiation':'تفاوض', 'reserved':'حجز', 'sold':'مباع' }[newStatus];
            let details = `غيّر حالة الوحدة [${u.title}] إلى ${stTxt}.`;
            const actionTime = getExactDateTime();
            
            u.history.push({ date: actionTime, note: `الحالة: ${stTxt}. الملاحظات: ${notes}` });

            if(client) {
                client.history.push({ date: actionTime, note: `تحديث تفاوض على (${u.title}): ${notes || stTxt}` });
            }

            if(newStatus === 'sold') {
                const comm = u.price * state.settings.commissionRate;
                details += ` العميل: ${client.name}. **(عمولة: ${formatCurrency(comm)})**`;
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });
                showToast('ألف مبروك! تم إقفال الديل بنجاح.', 'success');
            } else {
                if(client) details += ` العميل: ${client.name}`;
                showToast('تم التحديث بنجاح');
            }

            logActivity(state.currentUser.id, 'تحديث وحدة', details);
            closeModal(); renderView();
            setTimeout(() => { const el = document.getElementById('acc-content-'+fId); if(el) el.classList.add('open'); document.getElementById('acc-icon-'+fId).classList.add('open'); }, 100);
        }

                const proj = state.projects.find(p => p.id === projId);
                proj.isDeleted = true;

                logActivity(state.currentUser.id, 'نقل لمهملات', `تم نقل مشروع لسلة المهملات: ${proj.name}`);

                if(state.viewedProject === projId) state.viewedProject = null;
                if(state.viewedConstructionProject === projId) state.viewedConstructionProject = null;
                renderView();
            });
        }

                const floor = proj.floors.find(f => f.id === floorId);
                proj.floors = proj.floors.filter(f => f.id !== floorId);

        window.deleteUnit = function(projId, floorId, unitId) {

                const proj = state.projects.find(p => p.id === projId);

                </form>
            `);
        }

        window.handleAddStage = async function(e, projId) {
            e.preventDefault();
            const fileInput = document.getElementById('ns-imgs');
            let imagesArray = [];
            if (fileInput.files.length > 0) {
                showLoader('جاري رفع الصور والتحديث...');
                try { imagesArray = await readMultipleFiles(fileInput.files); } catch(err){}
                hideLoader();
            }
            
            const proj = state.projects.find(p => p.id === projId);
            if(!proj.constructionStages) proj.constructionStages = [];
            
            const newStage = { id: Date.now(), title: document.getElementById('ns-title').value, date: document.getElementById('ns-date').value, description: document.getElementById('ns-desc').value, images: imagesArray };
            
            proj.constructionStages.push(newStage);
            logActivity(state.currentUser.id, 'مراحل الإنشاء', `تحديث إنشاءات بمشروع ${proj.name}: ${newStage.title}`);
            closeModal(); showToast('تم نشر التحديث بنجاح'); renderView();
        }

            const tlOptions = state.users.filter(u => !u.isDeleted && u.role === 'team_leader').map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            openModal(`

        window.openEditUserModal = function(id) {
            const u = state.users.find(x => x.id === id);
            const tlOptions = state.users.filter(x => !x.isDeleted && x.role === 'team_leader' && x.id !== u.id).map(x => `<option value="${x.id}" ${x.id===u.teamLeaderId?'selected':''}>${x.name}</option>`).join('');

                    <h3 class="font-black text-xl dark:text-white">تعديل بيانات: ${u.name}</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-red-500"><i class="fas fa-times"></i></button>
                </div>
                <form onsubmit="handleUserSubmit(event, ${u.id})" class="p-6 bg-white dark:bg-royal-darkCard rounded-b-2xl space-y-4">
                    <div><label class="block font-bold mb-1 dark:text-white">الاسم الكامل</label><input type="text" id="u-name" class="royal-input" required value="${u.name}"></div>
                    <div><label class="block font-bold mb-1 dark:text-white">اسم المستخدم</label><input type="text" id="u-username" class="royal-input" required value="${u.username}" dir="ltr" ${u.id===1?'readonly':''}></div>

                        <div>
                            <label class="block font-bold mb-1 dark:text-white">الدور الوظيفي</label>

                                <option value="marketing" ${u.role==='marketing'?'selected':''}>تسويق</option>
                                <option value="team_leader" ${u.role==='team_leader'?'selected':''}>تيم ليدر</option>
                                <option value="data_entry" ${u.role==='data_entry'?'selected':''}>مدخل بيانات</option>

                </form>
            `);
        }

        window.toggleTLSelect = function(val, wrapId) { document.getElementById(wrapId).style.display = (val === 'employee') ? 'block' : 'none'; }

        window.handleUserSubmit = function(e, id) {
            e.preventDefault();
            const n = document.getElementById('u-name').value; const un = document.getElementById('u-username').value;
            const r = document.getElementById('u-role') ? document.getElementById('u-role').value : 'admin';
            const pass = document.getElementById('u-pass').value;
            const tlId = r === 'employee' ? (parseInt(document.getElementById('u-tl').value) || null) : null;
            
            if(id) {
                const u = state.users.find(x => x.id === id);
                if(u.username !== un && state.users.find(x => x.username === un)) return showToast('اسم المستخدم محجوز', 'error');
                u.name = n; u.username = un; 
                if(id !== 1) u.role = r; 
                u.teamLeaderId = tlId;
                if(pass.trim() !== '') u.password = pass; 
                showToast('تم تعديل بيانات الموظف'); logActivity(state.currentUser.id, 'إدارة', `تعديل بيانات الموظف: ${u.name}`);
            } else {
                if(state.users.find(x => x.username === un)) return showToast('اسم المستخدم محجوز', 'error');
                state.users.push({ id: Date.now(), name: n, username: un, password: pass, role: r, teamLeaderId: tlId, target: {type: 'money', value: 0}, isDeleted: false });
                showToast('تم إضافة الموظف الجديد بنجاح'); logActivity(state.currentUser.id, 'إدارة', `إنشاء حساب جديد: ${n}`);
            }
            closeModal(); renderView();
        }

        window.deleteUser = function(id) {
            showConfirmModal('سيتم إيقاف حساب الموظف ونقله لسلة المهملات. متأكد؟', 'نقل للمهملات', 'bg-red-600', () => {
                const u = state.users.find(x => x.id === id);
                u.isDeleted = true;
                u.deletedAt = getExactDateTime();
                state.projects.forEach(p => (p.floors || []).forEach(f => (f.units || []).forEach(un => { if(un.agentId === id) un.agentId = null; if(un.coAgentId === id) un.coAgentId = null; })));
                state.clients.forEach(c => { if(c.agentId === id) c.agentId = null; });
                showToast('تم إيقاف الموظف ونقله للمهملات'); logActivity(state.currentUser.id, 'إيقاف موظف', `تم نقل الموظف لسلة المهملات: ${u.name}`); renderView();
            });
        }

        window.openPersonalPasswordModal = function() {
            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-t-2xl flex justify-between"><h3 class="font-black text-xl dark:text-white"><i class="fas fa-key text-royal-gold"></i> تغيير كلمتي المرور</h3><button onclick="closeModal()" class="text-gray-400 hover:text-red-500"><i class="fas fa-times"></i></button></div>
                <form onsubmit="handlePersonalPasswordChange(event)" class="p-6 bg-white dark:bg-royal-darkCard rounded-b-2xl space-y-4">
                    <div><label class="block font-bold mb-1 dark:text-white">كلمة المرور الجديدة *</label><input type="password" id="my-new-pass" class="royal-input" required minlength="4" dir="ltr"></div>
                    <button type="submit" class="w-full bg-royal-gold text-white font-bold py-3 rounded-xl shadow-lg">تحديث كلمة المرور</button>
                </form>
            `);
        }
        window.handlePersonalPasswordChange = function(e) { e.preventDefault(); const p = document.getElementById('my-new-pass').value; state.users.find(x=>x.id===state.currentUser.id).password = p; state.currentUser.password = p; showToast('تم التحديث'); closeModal(); }

        // --- Targets ---
        function getTargetsHTML() {
            const rows = state.users.filter(u => !u.isDeleted && (u.role === 'employee' || u.role === 'team_leader')).map(u => {
                const targetData = u.target || { type: 'money', value: 0 };
                const isMoney = targetData.type === 'money';

                    <td class="py-4 px-4 font-bold dark:text-white">${u.name}</td>
                    <td class="py-4 px-4 text-gray-600 dark:text-gray-300">${u.role === 'team_leader' ? 'تيم ليدر' : 'مبيعات'}</td>
                    <td class="py-4 px-4"><span class="px-2 py-1 text-xs font-bold rounded bg-blue-100 text-blue-700">${isMoney ? 'مبيعات (مالي)' : 'عدد (رقمي)'}</span></td>
                    <td class="py-4 px-4 font-black text-green-600">${displayVal}</td>
                    <td class="py-4 px-4"><button onclick="openEditTargetModal(${u.id})" class="bg-royal-gold text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow hover:bg-royal-goldDark"><i class="fas fa-edit"></i> تعديل</button></td>
                </tr>`;
            }).join('');

            return `
            <div class="mb-6"><h2 class="text-3xl font-black dark:text-white">إدارة أهداف الموظفين (Targets)</h2></div>
            <div class="bg-white dark:bg-royal-darkCard rounded-2xl shadow-sm overflow-hidden border border-gray-100 dark:border-gray-800">
                <div class="overflow-x-auto">
                    <table class="w-full text-right whitespace-nowrap"><thead class="bg-gray-50 dark:bg-gray-800/50"><tr><th class="py-4 px-4 font-black">الموظف</th><th class="py-4 px-4 font-black">الوظيفة</th><th class="py-4 px-4 font-black">نوع التارجت</th><th class="py-4 px-4 font-black">القيمة</th><th class="py-4 px-4 font-black">إجراء</th></tr></thead><tbody>${rows}</tbody></table>
                </div>
            </div>`;

        window.openEditTargetModal = function(id) {
            const u = state.users.find(x => x.id === id);
            const targetData = u.target || { type: 'money', value: 0 };
            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 flex justify-between rounded-t-2xl"><h3 class="font-black text-xl dark:text-white">تحديد تارجت: ${u.name}</h3><button onclick="closeModal()" class="text-gray-400 hover:text-red-500"><i class="fas fa-times"></i></button></div>
                <form onsubmit="handleEditTarget(event, ${u.id})" class="p-6 bg-white dark:bg-royal-darkCard rounded-b-2xl space-y-4">
                    <div><label class="block font-bold mb-1 dark:text-white">نوع التارجت</label><select id="t-type" class="royal-input font-bold"><option value="money" ${targetData.type==='money'?'selected':''}>مبيعات (بالجنيه)</option><option value="units" ${targetData.type==='units'?'selected':''}>عدد وحدات مباعة</option></select></div>
                    <div><label class="block font-bold mb-1 dark:text-white">قيمة التارجت</label><input type="number" id="t-val" class="royal-input text-lg font-black" required min="0" value="${targetData.value}"></div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-blue-700">اعتماد التارجت</button>
                </form>
            `);
        }
        window.handleEditTarget = function(e, id) { e.preventDefault(); const u = state.users.find(x => x.id === id); u.target = { type: document.getElementById('t-type').value, value: parseInt(document.getElementById('t-val').value) || 0 }; logActivity(state.currentUser.id, 'إدارة أهداف', `تعيين تارجت جديد لـ ${u.name}`); closeModal(); showToast('تم الحفظ'); renderView(); }

        function getReportsHTML() {
            const isTL = state.currentUser.role === 'team_leader';
            let myTeamIds = state.users.filter(u => u.teamLeaderId === state.currentUser.id).map(u => u.id);
            if(isTL) myTeamIds.push(state.currentUser.id); // Include TL themselves

            const allUnits = getAllUnits();
            let filteredProps = allUnits.filter(p => p.status === 'sold');
            
            if(state.filters.reportDateFrom || state.filters.reportDateTo) {
                const soldEvents = state.archive.filter(a => a.action === 'مباع' || a.action.includes('بيع'));
                filteredProps = filteredProps.filter(p => {
                    const event = soldEvents.find(e => e.details.includes(p.title));
                    if(event) {
                        let valid = true;
                        const evDate = new Date(event.date);
                        if(state.filters.reportDateFrom && evDate < new Date(state.filters.reportDateFrom)) valid = false;
                        if(state.filters.reportDateTo) { const toD = new Date(state.filters.reportDateTo); toD.setDate(toD.getDate() + 1); if(evDate >= toD) valid = false; }
                        return valid;
                    }
                    return true;
                });
            }

            let usersToReport = state.users.filter(u => !u.isDeleted && u.role !== 'data_entry' && u.role !== 'admin');
            if(isTL) usersToReport = usersToReport.filter(u => myTeamIds.includes(u.id));

            const empStats = usersToReport.map(u => {
                const myClients = state.clients.filter(c => !c.isDeleted && c.agentId === u.id).length;
                const mySoldProps = filteredProps.filter(p => p.agentId === u.id || p.coAgentId === u.id);
                const salesVol = mySoldProps.reduce((sum, p) => sum + p.price, 0);
                const myComm = salesVol * state.settings.commissionRate;
                return { ...u, clients: myClients, deals: mySoldProps.length, vol: salesVol, comm: myComm };
            });

            const totalSystemSales = empStats.reduce((sum, u) => sum + u.vol, 0);

            const tableRows = empStats.sort((a,b) => b.vol - a.vol).map(u => `
                <tr class="border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50">
                    <td class="py-4 px-4 font-bold dark:text-white flex items-center gap-2"><i class="fas fa-user-circle text-gray-400"></i> ${u.name}</td>
                    <td class="py-4 px-4 text-center font-bold text-blue-600">${u.clients}</td>
                    <td class="py-4 px-4 text-center font-bold text-green-600">${u.deals}</td>
                    <td class="py-4 px-4 font-black dark:text-gray-200">${formatCurrency(u.vol)}</td>
                    <td class="py-4 px-4 font-black text-royal-gold">${formatCurrency(u.comm)}</td>
                    <td class="py-4 px-4 text-center"><button onclick="viewEmployeeLog(${u.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-md"><i class="fas fa-list-alt mr-1"></i> كشف العمليات</button></td>
                </tr>
            `).join('');

            return `
            <div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <h2 class="text-3xl font-black dark:text-white">تقارير الأداء التفصيلية ${isTL?'(لفريقي)':''}</h2>
                <div class="flex gap-2 w-full md:w-auto">
                    <button onclick="exportReportExcel()" class="flex-1 md:w-auto bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg transition-transform flex items-center justify-center gap-2"><i class="fas fa-file-excel"></i> تحميل إكسيل</button>
                    <button onclick="exportReportPDF()" class="flex-1 md:w-auto bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg transition-transform flex items-center justify-center gap-2"><i class="fas fa-file-pdf"></i> طباعة PDF</button>
                </div>
            </div>
            
            <div class="bg-white dark:bg-royal-darkCard p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-xs font-bold text-gray-500 mb-1">الفترة (من)</label><input type="date" id="fr-from" class="royal-input text-sm" value="${state.filters.reportDateFrom}" onchange="updateReportFilters()"></div>
                <div><label class="block text-xs font-bold text-gray-500 mb-1">الفترة (إلى)</label><input type="date" id="fr-to" class="royal-input text-sm" value="${state.filters.reportDateTo}" onchange="updateReportFilters()"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-gray-900 rounded-2xl p-6 text-white shadow-xl relative overflow-hidden">
                    <i class="fas fa-chart-bar absolute -left-4 -bottom-4 text-7xl opacity-20"></i>
                    <p class="text-gray-400 font-bold mb-1">إجمالي المبيعات المحققة</p><h3 class="text-4xl font-black text-white">${formatCurrency(totalSystemSales)}</h3>
                </div>
            </div>
            <div class="bg-white dark:bg-royal-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden" id="pdf-report-container">
                <div class="p-5 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex justify-between items-center">
                    <h4 class="font-bold text-lg dark:text-white"><i class="fas fa-medal text-royal-gold"></i> كشف أداء الموظفين</h4>
                    <img src="${state.settings.logo}" class="h-8 hidden" id="pdf-logo">
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-right whitespace-nowrap" id="report-table"><thead class="bg-white dark:bg-royal-darkCard border-b border-gray-100 dark:border-gray-700"><tr><th class="py-3 px-4 font-black">الموظف</th><th class="py-3 px-4 font-black text-center">عملاء (نشطين)</th><th class="py-3 px-4 font-black text-center">إقفال ديل</th><th class="py-3 px-4 font-black">حجم المبيعات</th><th class="py-3 px-4 font-black">العمولة</th><th class="py-3 px-4 font-black text-center html2pdf__page-break-avoid pdf-hide">السجل</th></tr></thead><tbody>${tableRows}</tbody></table>
                </div>
            </div>`;
        }
        window.updateReportFilters = function() { state.filters.reportDateFrom = document.getElementById('fr-from').value; state.filters.reportDateTo = document.getElementById('fr-to').value; renderView(); }

        window.exportReportExcel = function() {
            showLoader("جاري تجهيز ملف الإكسيل...");
            setTimeout(() => {
                const table = document.getElementById('report-table');
                const wb = XLSX.utils.table_to_book(table, {sheet: "التقرير الشهري"});
                XLSX.writeFile(wb, `Sales_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
                hideLoader(); showToast("تم تنزيل ملف الإكسيل بنجاح!");
            }, 500);
        }

        window.exportReportPDF = function() {
            showLoader("جاري إنشاء ملف الـ PDF...");
            const logo = document.getElementById('pdf-logo');
            if(logo) logo.classList.remove('hidden');
            const btns = document.querySelectorAll('.pdf-hide, td:last-child');
            btns.forEach(b => b.style.display = 'none');

            const element = document.getElementById('pdf-report-container');
            const opt = { margin: 0.5, filename: `Company_Report_${new Date().toISOString().split('T')[0]}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' } };

            html2pdf().set(opt).from(element).save().then(() => {
                if(logo) logo.classList.add('hidden');
                btns.forEach(b => b.style.display = '');
                hideLoader(); showToast("تم تنزيل تقرير الـ PDF!");
            });
        }

        window.viewEmployeeLog = function(userId) {
            const user = state.users.find(u => u.id === userId);
            const logs = state.archive.filter(a => a.userId === userId).sort((a,b) => new Date(b.date) - new Date(a.date));
            const logHTML = logs.length > 0 ? logs.map(l => `
                <div class="mb-3 border-r-2 border-royal-gold pl-3 pb-2 border-b border-gray-50 dark:border-gray-800">
                    <div class="flex justify-between items-center"><span class="font-bold text-sm text-blue-600">${l.action}</span><span class="text-xs text-gray-400 font-semibold" dir="ltr">${formatDate(l.date, true)}</span></div>
                    <p class="text-sm font-semibold text-gray-700 dark:text-gray-300 mt-1">${l.details}</p>
                </div>
            `).join('') : '<p class="text-center text-gray-400 font-bold p-6">لا يوجد نشاط.</p>';
            openModal(`<div class="p-6 border-b border-gray-100 bg-gray-50 rounded-t-2xl flex justify-between"><h3 class="font-black text-xl"><i class="fas fa-history text-royal-gold mr-2"></i>سجل: ${user.name}</h3><button onclick="closeModal()" class="text-gray-400 hover:text-red-500"><i class="fas fa-times"></i></button></div><div class="p-6 bg-white rounded-b-2xl max-h-96 overflow-y-auto">${logHTML}</div>`);
        }

        function getArchiveHTML() {
            let filteredArchive = state.archive;
            if(state.filters.archiveSearch) {
                const term = state.filters.archiveSearch.toLowerCase();
                filteredArchive = filteredArchive.filter(a => {
                    const user = state.users.find(u => u.id === a.userId);
                    return a.details.toLowerCase().includes(term) || a.action.toLowerCase().includes(term) || (user && user.name.toLowerCase().includes(term));
                });
            }
            if(state.filters.archiveDateFrom) filteredArchive = filteredArchive.filter(a => a.date >= state.filters.archiveDateFrom);
            if(state.filters.archiveDateTo) { const toD = new Date(state.filters.archiveDateTo); toD.setDate(toD.getDate() + 1); filteredArchive = filteredArchive.filter(a => new Date(a.date) < toD); }

            const timeline = filteredArchive.sort((a, b) => new Date(b.date) - new Date(a.date)).map(item => {
                const u = state.users.find(x => x.id === item.userId);
                return `
                <div class="relative pl-4 pr-6 py-3 border-r-2 border-gray-200 dark:border-gray-700">
                    <div class="absolute right-[-7px] top-4 w-3 h-3 rounded-full bg-royal-gold border-2 border-white dark:border-gray-900"></div>
                    <div class="bg-white dark:bg-royal-darkCard p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
                        <div class="flex justify-between mb-1"><span class="font-bold text-sm dark:text-white">${u?u.name:'النظام'} - <span class="text-blue-600">${item.action}</span></span><span class="text-xs text-gray-400" dir="ltr">${formatDate(item.date, true)}</span></div>
                        <p class="text-gray-700 dark:text-gray-300 text-sm font-semibold">${item.details}</p>
                    </div>
                </div>`;
            }).join('');
            
            return `
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4"><h2 class="text-3xl font-black dark:text-white">سجل النشاط العام (Log)</h2></div>
            <div class="bg-white dark:bg-royal-darkCard p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div><label class="block text-xs font-bold text-gray-500 mb-1">بحث شامل</label><input type="text" id="fa-search" class="royal-input text-sm" placeholder="اسم الموظف، العملية..." value="${state.filters.archiveSearch}" oninput="updateArchiveFilters()"></div>
                <div><label class="block text-xs font-bold text-gray-500 mb-1">التاريخ (من)</label><input type="date" id="fa-from" class="royal-input text-sm" value="${state.filters.archiveDateFrom}" onchange="updateArchiveFilters()"></div>
                <div><label class="block text-xs font-bold text-gray-500 mb-1">التاريخ (إلى)</label><input type="date" id="fa-to" class="royal-input text-sm" value="${state.filters.archiveDateTo}" onchange="updateArchiveFilters()"></div>
            </div>
            <div class="max-w-4xl py-2">${timeline || '<p class="text-center font-bold text-gray-500">لا توجد بيانات مطابقة للبحث</p>'}</div>`;
        }
        window.updateArchiveFilters = function() { state.filters.archiveSearch = document.getElementById('fa-search').value; state.filters.archiveDateFrom = document.getElementById('fa-from').value; state.filters.archiveDateTo = document.getElementById('fa-to').value; renderView(); }

        function getLoginHTML() {
            return `
            <div class="flex-1 flex items-center justify-center bg-[url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3')] bg-cover bg-center relative">
                <div class="absolute inset-0 bg-gray-900/80 backdrop-blur-md"></div>
                <div class="relative z-10 glass p-8 rounded-2xl shadow-2xl w-[90%] max-w-md border-t-4 border-royal-gold">
                    <div class="text-center mb-8">
                        <div class="relative inline-block">
                            <img src="${state.settings.logo}" onerror="this.src='https://placehold.co/400x100/transparent/D4AF37?text=BETAK'" alt="Logo" class="logo-animated drop-shadow-2xl h-24 w-auto object-contain mx-auto mb-4 relative z-10">
                        </div>
                        <h1 class="text-3xl font-black text-gray-800 dark:text-white tracking-wide mt-2">${state.settings.companyName}</h1>
                        <p class="text-gray-500 dark:text-gray-400 mt-2 font-bold text-sm">نظام إدارة الأملاك والمبيعات العقارية</p>
                    </div>
                    <form onsubmit="handleLogin(event)" class="space-y-5">
                        <div class="relative">
                            <i class="fas fa-user absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="l-user" class="royal-input text-lg font-bold text-center pr-10" required placeholder="اسم المستخدم" dir="ltr">
                        </div>
                        <div class="relative">
                            <i class="fas fa-lock absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="password" id="l-pass" class="royal-input text-lg font-bold text-center pr-10" required placeholder="كلمة المرور" dir="ltr">
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-royal-gold to-royal-goldDark hover:from-royal-goldDark hover:to-royal-gold text-white font-black py-3.5 rounded-xl shadow-[0_0_20px_rgba(212,175,55,0.4)] transition-all duration-300 transform hover:-translate-y-1">
                            تسجيل الدخول <i class="fas fa-sign-in-alt ml-2"></i>
                        </button>
                    </form>
                </div>
            </div>`;
        }

        window.handleLogin = function(e) {
            e.preventDefault();
            const u = state.users.find(x => x.username === document.getElementById('l-user').value && x.password === document.getElementById('l-pass').value && !x.isDeleted);
            if(u) { state.currentUser = u; state.currentView = 'dashboard'; logActivity(u.id, 'تسجيل دخول', 'تسجيل دخول للنظام'); renderApp(); showToast(`أهلاً بك، ${u.name}!`); } 
            else { showToast('اسم المستخدم غير صحيح أو الحساب موقوف', 'error'); }
        }

        window.handleLogout = function() { if(state.currentUser) { logActivity(state.currentUser.id, 'تسجيل خروج', 'تسجيل خروج من النظام'); state.currentUser = null; renderApp(); } }

        renderApp();
    </script>
</body>
</html>
