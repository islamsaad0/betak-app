<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">RealEstatePro - الإدارة العقارية الاحترافية</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Cairo ONLY) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- SheetJS for Excel Import/Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- html2pdf for PDF Export -->

    <!-- Canvas Confetti for Celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        royal: {
                            gold: '#D4AF37',
                            goldLight: '#F3E5AB',
                            goldDark: '#AA8C2C',
                            darkBg: '#0f172a',
                            darkCard: '#1e293b',
                        },
                        vivid: {
                            orange: '#FF7F50',
                            orangeDark: '#E06B40',
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'glow-gold': 'glowGold 2s infinite alternate',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        neonRed: { '0%': { boxShadow: '0 0 5px rgba(239, 68, 68, 0.5)' }, '100%': { boxShadow: '0 0 20px rgba(239, 68, 68, 1), 0 0 30px rgba(239, 68, 68, 0.8)' } },
                        neonYellow: { '0%': { boxShadow: '0 0 5px rgba(234, 179, 8, 0.5)' }, '100%': { boxShadow: '0 0 20px rgba(234, 179, 8, 1), 0 0 30px rgba(234, 179, 8, 0.8)' } },
                        glowGold: { '0%': { boxShadow: '0 0 5px rgba(212, 175, 55, 0.5)' }, '100%': { boxShadow: '0 0 20px rgba(212, 175, 55, 1)' } }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Cairo', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #AA8C2C; }

        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2); }
        .dark .glass { background: rgba(30, 41, 59, 0.90); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.3); }
        
        .royal-input { width: 100%; padding: 0.75rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; transition: all 0.3s; background-color: #fff; color: #1f2937; }
        .royal-input:focus { outline: none; border-color: #D4AF37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2); }
        .dark .royal-input { background-color: #0f172a; border-color: #334155; color: #f8fafc; }
        .dark .royal-input:focus { border-color: #D4AF37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.4); }
        
        .status-sold-glow { animation: neonRed 1.5s infinite alternate !important; }
        .status-reserved-glow { animation: neonYellow 1.5s infinite alternate !important; }
        
        .prop-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .prop-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px -5px rgba(212, 175, 55, 0.4); }
        .dark .prop-card:hover { box-shadow: 0 20px 40px -5px rgba(212, 175, 55, 0.2); }

        /* Custom Logo Animation */
        @keyframes pulse-fade {
            0% { opacity: 0.7; transform: scale(0.95); filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.4)); }
            100% { opacity: 1; transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.9)); }
        }
        .logo-animated {
            animation: pulse-fade 2.5s ease-in-out infinite alternate;
        }

        /* Creator Badge Animation */
        @keyframes rotate-bg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .creator-badge-wrapper {
            position: relative; overflow: hidden; border-radius: 1rem; padding: 2px; margin-top: 2rem;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); transition: all 0.3s ease;
        }
        .creator-badge-wrapper:hover { box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); transform: translateY(-3px) scale(1.02); }
        .creator-badge-wrapper::before {
            content: ''; position: absolute; top: -100%; left: -100%; width: 300%; height: 300%;
            background: conic-gradient(transparent, transparent, rgba(212, 175, 55, 0.1), #D4AF37, transparent 30%);
            animation: rotate-bg 3s linear infinite;
        }
        .creator-badge-inner { position: relative; background: rgba(255, 255, 255, 0.95); border-radius: 0.9rem; padding: 0.85rem 1rem; display: flex; align-items: center; justify-content: center; gap: 0.6rem; z-index: 10; }
        .dark .creator-badge-inner { background: rgba(15, 23, 42, 0.95); }

        /* Accordion transition */
        .accordion-content { transition: max-height 0.4s ease-out, opacity 0.4s ease-out; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 5000px; opacity: 1; overflow: visible; }
        .accordion-icon { transition: transform 0.3s; }
        .accordion-icon.open { transform: rotate(180deg); }

        /* Timeline for construction */
        .timeline-container { position: relative; }
        .timeline-container::before { content: ''; position: absolute; top: 0; bottom: 0; right: 24px; width: 2px; background: #e5e7eb; }
        .dark .timeline-container::before { background: #334155; }
        .timeline-item { position: relative; padding-right: 60px; margin-bottom: 2rem; }
        .timeline-dot { position: absolute; right: 16px; top: 0; width: 18px; height: 18px; border-radius: 50%; background: #D4AF37; border: 4px solid #fff; box-shadow: 0 0 0 2px #D4AF37; z-index: 10; }
        .dark .timeline-dot { border-color: #1e293b; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-royal-darkBg text-gray-800 dark:text-gray-100 antialiased overflow-x-hidden transition-colors duration-300">

    <!-- Audio Element for Reminders -->
    <audio id="reminder-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Global Loader -->
    <div id="global-loader" class="fixed inset-0 bg-gray-900/90 backdrop-blur-md z-[999] hidden flex-col items-center justify-center text-white transition-opacity">
        <i class="fas fa-circle-notch fa-spin text-7xl text-royal-gold mb-6 shadow-lg rounded-full"></i>
        <p id="loader-text" class="text-2xl font-bold tracking-wide animate-pulse font-cairo">جاري المعالجة... برجاء الانتظار</p>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-4 z-[999] flex flex-col gap-2 pointer-events-none font-cairo"></div>

    <!-- APP CONTAINER -->
    <div id="app" class="h-screen flex flex-col md:flex-row"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJ6NSEfC5ZYW37fWLTaljy6Onvw3faSC4",
            authDomain: "betak-real-estate.firebaseapp.com",
            projectId: "betak-real-estate",
            storageBucket: "betak-real-estate.firebasestorage.app",
            messagingSenderId: "1006094091108",
            appId: "1:1006094091108:web:c97a15d550fcf429927071"
        };
        if (!firebase.apps.length) { 
            firebase.initializeApp(firebaseConfig); 
        }
        const db = firebase.firestore();
        
        db.enablePersistence().catch(function(err) {
            console.error("خطأ في تفعيل وضع الأوفلاين:", err);
        });

        const auth = firebase.auth();
        auth.signInAnonymously().catch((error) => {
            console.error("خطأ في الاتصال:", error);
        });

        const readMultipleFiles = async (files) => {
            const cloudName = "ok4jlpdx"; 
            const uploadPreset = "BETAK realestate_preset"; 
            
            const results = [];
            for (let i = 0; i < files.length; i++) {
                const formData = new FormData();
                formData.append("file", files[i]);
                formData.append("upload_preset", uploadPreset);

                try {
                    const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
                        method: "POST",
                        body: formData
                    });
                    const data = await response.json();
                    if (data.secure_url) {
                        results.push(data.secure_url);
                    }
                } catch (error) {
                    console.error("حصل خطأ في رفع الصورة:", error);
                }
            }
            return results; 
        };

        const state = {
            settings: { companyName: 'بيتك للتطوير العقاري', logo: 'https://i.ibb.co/v6Z6bVM7/BETAK-logo.png', commissionRate: 0.025 },
            currentUser: null,
            theme: localStorage.getItem('theme') || 'light',
            users: [ { id: 1, name: 'المدير العام', username: 'admin', password: '123', role: 'admin', target: {type: 'money', value: 0}, isDeleted: false } ],
            excelFiles: [],
            activeFileId: null,
            clients: [],
            projects: [],
            archive: [], 
            currentView: 'dashboard',
            filters: { projSearch: '', clientSearch: '', clientDateFrom: '', clientDateTo: '', archiveSearch: '', archiveDateFrom: '', archiveDateTo: '', reportDateFrom: '', reportDateTo: '' },
            viewedProject: null,
            viewedConstructionProject: null
        };

        const rbac = {
            canViewReports: ['admin', 'team_leader'], 
            canManageUsers: ['admin'],
            canManageTargets: ['admin'],
            canManageProjects: ['admin', 'data_entry'],
            canUploadExcel: ['admin', 'marketing', 'employee', 'team_leader', 'data_entry'],
            canChangeStatus: ['admin', 'employee', 'team_leader']
        };

        function checkPerm(action) {
            if(!state.currentUser) return false;
            return rbac[action].includes(state.currentUser.role);
        }

        function logActivity(userId, actionType, details) {
            state.archive.push({ id: Date.now() + Math.random(), date: new Date().toISOString(), userId: userId, action: actionType, details: details });
        }

        let isDataLoaded = false; 
        let cloudStatus = 'pending'; 
        let lastSavedItems = {}; 
        
        async function loadDataFromCollections() {
            try {
                cloudStatus = 'pending'; 
                if(typeof updateSyncStatus === 'function') updateSyncStatus();
                
                const settingsDoc = await db.collection('System').doc('Settings').get();
                if (settingsDoc.exists) state.settings = settingsDoc.data();
                
                const loadCollection = async (colName) => {
                    const snap = await db.collection(colName).get();
                    return snap.docs.map(doc => doc.data());
                };

                // Load pure collections ONLY. Completely ignoring the old 'MainData' to stop zombie files.
                const loadedUsers = await loadCollection('Users');
                const loadedClients = await loadCollection('Clients');
                const loadedProjects = await loadCollection('Projects');
                const loadedArchive = await loadCollection('Archive');
                const loadedExcelFiles = await loadCollection('ExcelFiles');

                if(loadedUsers.length > 0) state.users = loadedUsers;
                state.clients = loadedClients;
                state.projects = loadedProjects;
                state.archive = loadedArchive;
                state.excelFiles = loadedExcelFiles;

                if(settingsDoc.exists) lastSavedItems['Settings'] = JSON.stringify(state.settings);
                
                const initSavedItems = (col, arr) => {
                    arr.forEach(item => { lastSavedItems[col + '_' + item.id] = JSON.stringify(item); });
                };
                initSavedItems('Users', state.users);
                initSavedItems('Clients', state.clients);
                initSavedItems('Projects', state.projects);
                initSavedItems('Archive', state.archive);
                initSavedItems('ExcelFiles', state.excelFiles);

                isDataLoaded = true;
                cloudStatus = 'connected';
                if(typeof updateSyncStatus === 'function') updateSyncStatus();

                if (state.currentUser) {
                    const updatedUser = state.users.find(u => u.id === state.currentUser.id && !u.isDeleted);
                    if(updatedUser) {
                        state.currentUser = updatedUser;
                        renderView();
                    } else { 
                        handleLogout(); 
                    } 
                }
            } catch (error) {
                console.error("خطأ في قراءة البيانات:", error);
                cloudStatus = 'error';
                if(typeof updateSyncStatus === 'function') updateSyncStatus();
                isDataLoaded = true;
            }
        }

        loadDataFromCollections();

        async function syncStateToCollections() {
            if (!isDataLoaded) return;
            try {
                const batch = db.batch();
                let hasChanges = false;
                
                const settingsStr = JSON.stringify(state.settings);
                if(lastSavedItems['Settings'] !== settingsStr) {
                    batch.set(db.collection('System').doc('Settings'), state.settings);
                    lastSavedItems['Settings'] = settingsStr;
                    hasChanges = true;
                }
                
                const syncArray = (collectionName, itemsArray) => {
                    itemsArray.forEach(item => {
                        if(item && item.id) {
                            const itemStr = JSON.stringify(item);
                            const key = collectionName + '_' + item.id;
                            if(lastSavedItems[key] !== itemStr) {
                                const docRef = db.collection(collectionName).doc(item.id.toString());
                                batch.set(docRef, item);
                                lastSavedItems[key] = itemStr;
                                hasChanges = true;
                            }
                        }
                    });
                };

                syncArray('Users', state.users);
                syncArray('Clients', state.clients);
                syncArray('Projects', state.projects);
                syncArray('Archive', state.archive);
                syncArray('ExcelFiles', state.excelFiles);

                if(hasChanges) {
                    cloudStatus = 'pending';
                    if(typeof updateSyncStatus === 'function') updateSyncStatus();
                    await batch.commit();
                    cloudStatus = 'connected';
                    if(typeof updateSyncStatus === 'function') updateSyncStatus();
                }
            } catch (error) {
                console.error("خطأ في الحفظ:", error);
                cloudStatus = 'error';
                if(typeof updateSyncStatus === 'function') updateSyncStatus();
            }
        }

        setInterval(syncStateToCollections, 3000);

        function updateSyncStatus() {
            const indMain = document.getElementById('sync-indicator');
            const indMobile = document.getElementById('sync-indicator-mobile');
            const isOnline = navigator.onLine;
            let isGreen = false, titleText = "";

            if (!isOnline) { isGreen = false; titleText = "أوفلاين"; } 
            else if (cloudStatus === 'error') { isGreen = false; titleText = "خطأ في الاتصال بالسحابة"; } 
            else if (!isDataLoaded || cloudStatus === 'pending') { isGreen = false; titleText = "جاري الحفظ..."; } 
            else { isGreen = true; titleText = "متصل ومحفوظ"; }

            const setStatus = (el) => {
                if(!el) return;
                if(isGreen) el.className = 'w-2.5 h-2.5 rounded-full transition-all duration-500 bg-green-500 shadow-[0_0_8px_#22c55e,0_0_12px_#22c55e] animate-pulse-fast';
                else if (!isOnline) el.className = 'w-2.5 h-2.5 rounded-full transition-all duration-500 bg-gray-400 shadow-[0_0_5px_#9ca3af]';
                else if (cloudStatus === 'pending') el.className = 'w-2.5 h-2.5 rounded-full transition-all duration-500 bg-yellow-400 shadow-[0_0_5px_#facc15] animate-pulse';
                else el.className = 'w-2.5 h-2.5 rounded-full transition-all duration-500 bg-red-500 shadow-[0_0_5px_#ef4444]';
                el.title = titleText;
            };
            
            setStatus(indMain); setStatus(indMobile);
        }

        window.addEventListener('online', updateSyncStatus);
        window.addEventListener('offline', updateSyncStatus);

        let focusedElementId = null;
        let cursorPosition = 0;

        function saveFocus() {
            if(document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'text') {
                focusedElementId = document.activeElement.id; cursorPosition = document.activeElement.selectionStart;
            } else { focusedElementId = null; }
        }
        function restoreFocus() {
            if(focusedElementId) {
                const el = document.getElementById(focusedElementId);
                if(el) { el.focus(); if(el.setSelectionRange) el.setSelectionRange(cursorPosition, cursorPosition); }
            }
        }

        if (state.theme === 'dark') document.documentElement.classList.add('dark');

        function toggleTheme() {
            const html = document.documentElement; html.classList.toggle('dark');
            state.theme = html.classList.contains('dark') ? 'dark' : 'light'; localStorage.setItem('theme', state.theme); renderApp();
        }

        function showToast(message, type = 'success', persist = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgColor = type === 'success' ? 'bg-green-500' : (type === 'error' ? 'bg-red-500' : (type === 'warning' ? 'bg-vivid-orange' : 'bg-blue-500'));
            toast.className = `${bgColor} text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 opacity-0 translate-y-[-20px] flex items-center gap-3 font-bold border border-white/20`;
            let icon = type === 'error' ? 'fa-exclamation-circle' : (type === 'warning' ? 'fa-bell' : 'fa-check-circle');
            toast.innerHTML = `<i class="fas ${icon} text-xl animate-pulse"></i><span>${message}</span>`;
            if(persist) toast.innerHTML += `<button onclick="this.parentElement.remove()" class="ml-auto text-white hover:text-gray-200"><i class="fas fa-times"></i></button>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-[-20px]'), 10);
            if(!persist) setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 4000);
        }

        function formatCurrency(num) { return new Intl.NumberFormat('ar-EG', { style: 'currency', currency: 'EGP', maximumFractionDigits: 0 }).format(num).replace('EGP', 'ج.م'); }
        function formatDate(dateString, withTime = false) {
            if(!dateString) return '-';
            const options = { year: 'numeric', month: 'short', day: 'numeric', ...(withTime && {hour: '2-digit', minute:'2-digit'}) };
            return new Date(dateString).toLocaleDateString('ar-EG', options);
        }
        function getExactDateTime() { return new Date().toISOString(); }

        function showLoader(text) { document.getElementById('loader-text').innerText = text; document.getElementById('global-loader').classList.remove('hidden'); document.getElementById('global-loader').classList.add('flex'); }
        function hideLoader() { document.getElementById('global-loader').classList.add('hidden'); document.getElementById('global-loader').classList.remove('flex'); }

        function openModal(htmlContent) {
            document.getElementById('modals-container').innerHTML = `
                <div class="fixed inset-0 bg-gray-900/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-fade-in" onclick="closeModal(event)">
                    <div class="w-full max-w-2xl max-h-[90vh] overflow-y-auto animate-slide-up shadow-2xl rounded-2xl bg-white dark:bg-royal-darkCard" onclick="event.stopPropagation()">${htmlContent}</div>
                </div>`;
        }
        window.closeModal = function() { document.getElementById('modals-container').innerHTML = ''; }

        function showConfirmModal(message, confirmText, btnClass, onConfirm) {
            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-t-2xl flex items-center gap-3">
                    <i class="fas fa-exclamation-circle text-${btnClass.includes('red') ? 'red' : 'vivid-orange'}-500 text-2xl"></i>
                    <h3 class="font-bold text-xl text-gray-800 dark:text-white">تأكيد الإجراء</h3>
                </div>
                <div class="p-6">
                    <p class="text-gray-700 dark:text-gray-300 font-bold text-lg mb-6">${message}</p>
                    <div class="flex gap-4 justify-end">
                        <button type="button" onclick="closeModal()" class="px-5 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-bold hover:bg-gray-300 transition-colors">إلغاء</button>
                        <button type="button" id="confirm-btn-action" class="px-5 py-2 rounded-lg text-white font-bold ${btnClass} transition-colors shadow-lg">${confirmText}</button>
                    </div>
                </div>
            `);
            document.getElementById('confirm-btn-action').onclick = () => { onConfirm(); closeModal(); };
        }

        function showPromptModal(message, defaultValue, onConfirm) {
            openModal(`
                <div class="p-6 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-t-2xl"><h3 class="font-bold text-xl text-gray-800 dark:text-white">${message}</h3></div>
                <div class="p-6">
                    <input type="text" id="prompt-input-val" class="royal-input" value="${defaultValue}">
                    <div class="mt-6 flex gap-4 justify-end">
                        <button type="button" onclick="closeModal()" class="px-5 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-bold hover:bg-gray-300 transition-colors">إلغاء</button>
                        <button type="button" id="prompt-btn-action" class="px-5 py-2 rounded-lg bg-royal-gold text-white font-bold hover:bg-royal-goldDark transition-colors shadow-lg">حفظ</button>
                    </div>
                </div>
            `);
            document.getElementById('prompt-btn-action').onclick = () => { onConfirm(document.getElementById('prompt-input-val').value); closeModal(); };
        }

        function checkReminders() {
            if(!state.currentUser) return;
            const today = new Date().toISOString().split('T')[0];
            const myClientsToCall = state.clients.filter(c => c.agentId === state.currentUser.id && c.followUpDate === today && !c.isDeleted);
            if(myClientsToCall.length > 0) {
                const names = myClientsToCall.map(c => c.name).join('، ');
                showToast(`تذكير هام! لديك متابعات اليوم مع: ${names}`, 'warning', true);
                const audio = document.getElementById('reminder-sound');
                if(audio) { audio.volume = 0.7; audio.play().catch(e => console.log('Audio blocked.')); }
            }
        }
        setInterval(checkReminders, 30 * 60 * 1000);

        function renderApp() {
            const app = document.getElementById('app');
            if (!state.currentUser) app.innerHTML = getLoginHTML();
            else { app.innerHTML = getLayoutHTML(); renderView(); setTimeout(checkReminders, 1000); }
        }

        function changeView(view) {
            state.currentView = view; state.viewedProject = null; state.viewedConstructionProject = null;
            if(window.innerWidth < 768) toggleSidebar(false);
            renderView();
        }

        function toggleSidebar(forceOpen) {
            const sidebar = document.getElementById('sidebar'); const overlay = document.getElementById('mobile-overlay');
            if(forceOpen) { sidebar.classList.remove('translate-x-full'); sidebar.classList.add('translate-x-0'); overlay.classList.remove('hidden'); setTimeout(() => overlay.classList.remove('opacity-0'), 10); } 
            else { sidebar.classList.add('translate-x-full'); sidebar.classList.remove('translate-x-0'); overlay.classList.add('opacity-0'); setTimeout(() => overlay.classList.add('hidden'), 300); }
        }

        function toggleAccordion(id) {

            return allUnits;
        }

                    <div class="flex-1 overflow-hidden">
                        <p class="text-base font-bold text-gray-800 dark:text-white truncate">${state.currentUser.name}</p>
                        <p class="text-xs font-semibold text-royal-goldDark dark:text-royal-goldLight">${{admin:'المدير العام', employee:'مبيعات', marketing:'تسويق', team_leader:'تيم ليدر', data_entry:'مدخل بيانات'}[state.currentUser.role]}</p>
                    </div>
                </div>

                <nav class="flex-1 px-4 py-2 space-y-1.5 overflow-y-auto">
                    <a href="#" id="nav-dashboard" onclick="changeView('dashboard')" class="menu-item flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition-all"><i class="fas fa-chart-pie w-5 text-center text-lg"></i> اللوحة الرئيسية</a>
                    <a href="#" id="nav-leads" onclick="changeView('leads')" class="menu-item flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition-all"><i class="fas fa-filter w-5 text-center text-lg"></i> فلترة Leads</a>
                    <a href="#" id="nav-clients" onclick="changeView('clients')" class="menu-item flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition-all"><i class="fas fa-users w-5 text-center text-lg"></i> العملاء (CRM)</a>
                    <a href="#" id="nav-properties" onclick="changeView('properties')" class="menu-item flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition-all"><i class="fas fa-building w-5 text-center text-lg"></i> المعرض العقاري (المشروعات)</a>
                    <a href="#" id="nav-construction" onclick="changeView('construction')" class="menu-item flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition-all"><i class="fas fa-hard-hat w-5 text-center text-lg text-vivid-orange"></i> مراحل الإنشاء (Updates)</a>
                    <a href="#" id="nav-archive" onclick="changeView('archive')" class="menu-item flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition-all"><i class="fas fa-history w-5 text-center text-lg"></i> سجل النشاط العام</a>
                    
                    ${checkPerm('canViewReports') || checkPerm('canManageUsers') ? `
                    <div class="pt-4 mt-4 border-t border-gray-200 dark:border-gray-700">
                        <p class="px-4 text-xs font-black text-gray-400 dark:text-gray-500 mb-3 uppercase">الإدارة والتقارير</p>
                        ${checkPerm('canManageTargets') ? `<a href="#" id="nav-targets" onclick="changeView('targets')" class="menu-item flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition-all mb-1"><i class="fas fa-bullseye w-5 text-center text-lg text-blue-500"></i> إدارة أهداف الموظفين</a>` : ''}
                        ${checkPerm('canViewReports') ? `<a href="#" id="nav-reports" onclick="changeView('reports')" class="menu-item flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition-all mb-1"><i class="fas fa-file-invoice-dollar w-5 text-center text-lg"></i> تقارير الموظفين والأداء</a>` : ''}
                        ${checkPerm('canManageUsers') ? `<a href="#" id="nav-users" onclick="changeView('users')" class="menu-item flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition-all mb-1"><i class="fas fa-user-shield w-5 text-center text-lg"></i> إدارة الموظفين</a>` : ''}
                    </div>` : ''}

                    ${isAdmin ? `
                    <div class="pt-2 mt-2">
                        <a href="#" id="nav-trash" onclick="changeView('trash')" class="menu-item flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition-all text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20"><i class="fas fa-trash-alt w-5 text-center text-lg"></i> سلة المهملات</a>
                    </div>
                    ` : ''}
                </nav>

                <div class="p-4 border-t border-gray-200 dark:border-gray-800 flex flex-col gap-2 bg-gray-50 dark:bg-royal-darkBg">
                    <button onclick="openPersonalPasswordModal()" class="w-full flex items-center justify-center gap-2 bg-gray-200 text-gray-700 hover:bg-gray-300 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 py-2.5 rounded-lg font-bold transition-colors mb-1"><i class="fas fa-key"></i> تغيير كلمتي المرور</button>
                    <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white dark:bg-red-900/20 dark:text-red-400 dark:hover:bg-red-600 py-2.5 rounded-lg font-bold transition-colors"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</button>
                </div>
            </aside>

            <main class="flex-1 flex flex-col h-screen overflow-hidden">
                <header class="bg-white dark:bg-royal-darkCard shadow-sm border-b border-gray-200 dark:border-gray-800 p-4 flex justify-between items-center z-30">
                    <div class="flex items-center gap-3">
                        <button onclick="toggleSidebar(true)" class="md:hidden text-gray-700 dark:text-gray-300 p-1"><i class="fas fa-bars text-2xl"></i></button>
                        <div class="hidden md:flex items-center gap-3">
                            <img src="${state.settings.logo}" class="h-10 w-auto object-contain logo-animated hidden md:block" onerror="this.src='https://placehold.co/400x100/transparent/D4AF37?text=BETAK'">
                            <div id="sync-indicator" class="w-2.5 h-2.5 rounded-full bg-gray-400 shadow-[0_0_5px_#9ca3af]"></div>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <button onclick="checkReminders()" class="text-vivid-orange hover:text-vivid-orangeDark transition-colors p-2" title="التحقق من التنبيهات"><i class="fas fa-bell text-xl"></i></button>
                        <button onclick="toggleTheme()" class="text-gray-500 hover:text-royal-gold dark:text-gray-300 transition-colors p-2"><i class="fas ${state.theme === 'dark' ? 'fa-sun text-yellow-400' : 'fa-moon'} text-xl"></i></button>
                    </div>
                </header>
                <div id="main-content" class="flex-1 overflow-y-auto p-4 md:p-8 animate-fade-in relative"></div>
            </main>
            <div id="modals-container"></div>
            `;
        }

        function renderView() {
            saveFocus(); 
            const mainContent = document.getElementById('main-content');
            document.querySelectorAll('.menu-item').forEach(el => {
                el.classList.remove('bg-royal-gold', 'text-white', 'shadow-lg');
                if(el.id !== 'nav-trash') el.classList.add('text-gray-600', 'dark:text-gray-300', 'hover:bg-royal-goldLight/20', 'dark:hover:bg-gray-800');
            });
            const activeLink = document.getElementById(`nav-${state.currentView === 'construction' ? 'construction' : state.currentView}`);
            if(activeLink && activeLink.id !== 'nav-trash') {
                activeLink.classList.remove('text-gray-600', 'dark:text-gray-300', 'hover:bg-royal-goldLight/20', 'dark:hover:bg-gray-800');
                activeLink.classList.add('bg-royal-gold', 'text-white', 'shadow-lg');
            } else if (activeLink && activeLink.id === 'nav-trash') {
                activeLink.classList.remove('text-red-500', 'hover:bg-red-50');
                activeLink.classList.add('bg-red-600', 'text-white', 'shadow-lg');
            }

            switch(state.currentView) {
                case 'dashboard': mainContent.innerHTML = getDashboardHTML(); break;
                case 'leads': mainContent.innerHTML = getLeadsHTML(); break;
                case 'clients': mainContent.innerHTML = getClientsHTML(); break;
                case 'properties': mainContent.innerHTML = getProjectsHTML(); break;
                case 'construction': mainContent.innerHTML = getConstructionHTML(); break;
                case 'archive': mainContent.innerHTML = getArchiveHTML(); break;
                case 'reports': if(!checkPerm('canViewReports')) changeView('dashboard'); else mainContent.innerHTML = getReportsHTML(); break;
                case 'users': if(!checkPerm('canManageUsers')) changeView('dashboard'); else mainContent.innerHTML = getUsersHTML(); break;
                case 'targets': if(!checkPerm('canManageTargets')) changeView('dashboard'); else mainContent.innerHTML = getTargetsHTML(); break;
                case 'trash': if(state.currentUser.role !== 'admin') changeView('dashboard'); else mainContent.innerHTML = getTrashHTML(); break;
            }
            restoreFocus(); 
        }

        function getTrashHTML() {
            let trashItems = [];
            
            state.clients.filter(c => c.isDeleted).forEach(c => trashItems.push({ id: c.id, type: 'client', typeName: 'عميل (CRM)', name: c.name, date: c.deletedAt || '-' }));
            state.projects.filter(p => p.isDeleted).forEach(p => trashItems.push({ id: p.id, type: 'project', typeName: 'مشروع عقاري', name: p.name, date: p.deletedAt || '-' }));
            state.users.filter(u => u.isDeleted).forEach(u => trashItems.push({ id: u.id, type: 'user', typeName: 'موظف/مستخدم', name: u.name, date: u.deletedAt || '-' }));
            state.excelFiles.filter(f => f.isDeleted).forEach(f => trashItems.push({ id: f.id, type: 'excel', typeName: 'ملف إكسيل (Leads)', name: f.name, date: f.deletedAt || '-' }));

            trashItems.sort((a, b) => new Date(b.date) - new Date(a.date));

            const rows = trashItems.map(item => `
                <tr class="border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50">
                    <td class="py-4 px-4 font-bold dark:text-white">${item.name}</td>
                    <td class="py-4 px-4"><span class="px-2 py-1 text-xs font-bold rounded bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300">${item.typeName}</span></td>
                    <td class="py-4 px-4 text-sm font-bold text-gray-500" dir="ltr">${formatDate(item.date, true)}</td>
                    <td class="py-4 px-4 flex gap-2">
                        <button onclick="restoreItem('${item.type}', '${item.id}')" class="bg-green-100 hover:bg-green-200 text-green-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm"><i class="fas fa-recycle mr-1"></i> استرجاع</button>
                        <button onclick="hardDeleteItem('${item.type}', '${item.id}')" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm"><i class="fas fa-trash-alt mr-1"></i> حذف نهائي</button>
                    </td>
                </tr>
            `).join('');

            return `
            <div class="mb-6">
                <h2 class="text-3xl font-black text-red-600 dark:text-red-500"><i class="fas fa-trash-alt mr-2"></i> سلة المهملات المركزية</h2>
                <p class="text-gray-500 mt-2 font-bold">يمكنك استرجاع العناصر المحذوفة لتعود لمكانها الأصلي، أو إزالتها نهائياً من النظام والسيرفر.</p>
            </div>
            <div class="bg-white dark:bg-royal-darkCard rounded-2xl shadow-sm overflow-hidden border border-gray-100 dark:border-gray-800">
                <div class="overflow-x-auto">
                    <table class="w-full text-right whitespace-nowrap"><thead class="bg-gray-50 dark:bg-gray-800/50"><tr><th class="py-4 px-4 font-black">الاسم / العنوان</th><th class="py-4 px-4 font-black">النوع</th><th class="py-4 px-4 font-black">تاريخ الحذف</th><th class="py-4 px-4 font-black">إجراءات السلة</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="p-8 text-center text-gray-400 font-bold">سلة المهملات فارغة تماماً</td></tr>'}</tbody></table>
                </div>
            </div>`;
        }

        window.restoreItem = function(type, id) {
            let item = null;
            if(type === 'client') item = state.clients.find(x => x.id == id);
            else if(type === 'project') item = state.projects.find(x => x.id == id);
            else if(type === 'user') item = state.users.find(x => x.id == id);
            else if(type === 'excel') item = state.excelFiles.find(x => x.id == id);

            if(item) {
                item.isDeleted = false;
                item.deletedAt = null;
                logActivity(state.currentUser.id, 'استرجاع من المهملات', `استرجاع (${item.name}) من سلة المهملات`);
                showToast('تم الاسترجاع بنجاح');
                renderView();
            }
        }

        window.hardDeleteItem = function(type, id) {
            showConfirmModal('سيتم حذف هذا العنصر نهائياً وللأبد من قاعدة البيانات. هل أنت متأكد؟', 'حذف نهائي', 'bg-red-700', () => {
                let collectionName = '';
                if(type === 'client') { state.clients = state.clients.filter(x => x.id != id); collectionName = 'Clients'; }
                else if(type === 'project') { state.projects = state.projects.filter(x => x.id != id); collectionName = 'Projects'; }
                else if(type === 'user') { state.users = state.users.filter(x => x.id != id); collectionName = 'Users'; }
                else if(type === 'excel') { state.excelFiles = state.excelFiles.filter(x => x.id != id); collectionName = 'ExcelFiles'; }

                if(collectionName) {
                    db.collection(collectionName).doc(id.toString()).delete();
                    delete lastSavedItems[collectionName + '_' + id]; 
                }

                logActivity(state.currentUser.id, 'حذف نهائي', `تم الحذف النهائي لعنصر من نوع ${type}`);
                showToast('تم الحذف من السيرفر نهائياً');
                renderView();
            });
        }

        function getDashboardHTML() {
            const isAdmin = state.currentUser.role === 'admin';
            const isTL = state.currentUser.role === 'team_leader';
            const allUnits = getAllUnits();
            const activeUsers = state.users.filter(u => !u.isDeleted && u.role !== 'data_entry' && u.role !== 'admin');
            
            let myClients = state.clients.filter(c => !c.isDeleted && c.agentId === state.currentUser.id);
            let myProps = allUnits.filter(p => p.agentId === state.currentUser.id || p.coAgentId === state.currentUser.id);
            
            if (isAdmin) {
                myClients = state.clients.filter(c => !c.isDeleted);
                myProps = allUnits.filter(p => p.status !== 'available');
            } else if (isTL) {
                const myTeamIds = state.users.filter(u => u.teamLeaderId === state.currentUser.id).map(u => u.id);
                myTeamIds.push(state.currentUser.id);
                myClients = state.clients.filter(c => !c.isDeleted && myTeamIds.includes(c.agentId));
                myProps = allUnits.filter(p => myTeamIds.includes(p.agentId) || myTeamIds.includes(p.coAgentId));
            }

            const mySoldProps = myProps.filter(p => p.status === 'sold');
            const mySales = mySoldProps.reduce((sum, p) => sum + p.price, 0);
            
            const activeProps = myProps.filter(p => p.status === 'negotiation' || p.status === 'reserved');
            const activeDeals = activeProps.map(p => `
                <div class="flex justify-between items-center p-3 bg-gray-50 dark:bg-gray-800 rounded-xl mb-2 border border-gray-100 dark:border-gray-700">
                    <div>
                        <p class="font-bold dark:text-white text-sm">${p.title}</p>
                        <p class="text-xs text-gray-500">${p.notes || 'لا يوجد ملاحظات'}</p>
                    </div>
                    <div class="text-left">
                        <p class="font-black text-blue-600">${formatCurrency(p.price)}</p>
                        <span class="text-[10px] font-bold px-2 py-1 rounded ${p.status==='reserved'?'bg-yellow-100 text-yellow-700':'bg-blue-100 text-blue-700'}">${p.status==='reserved'?'حجز':'تفاوض'}</span>
                    </div>
                </div>
            `).join('');

            let html = `
            <div class="mb-8">
                <h2 class="text-3xl font-black text-gray-800 dark:text-white">مرحباً، ${state.currentUser.name} 👋</h2>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1 font-semibold">${isAdmin ? 'نظرة عامة على أداء الشركة' : (isTL ? 'نظرة عامة على أداء فريقك' : 'نظرة سريعة على أرقامك ومبيعاتك')}</p>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white dark:bg-royal-darkCard p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 border-b-4 border-b-blue-500">
                    <p class="text-gray-500 dark:text-gray-400 text-sm font-bold mb-1">${isAdmin||isTL ? 'إجمالي العملاء' : 'عملائي النشطين'}</p><h3 class="text-3xl font-black dark:text-white">${myClients.length}</h3>
                </div>
                <div class="bg-white dark:bg-royal-darkCard p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 border-b-4 border-b-yellow-500">
                    <p class="text-gray-500 dark:text-gray-400 text-sm font-bold mb-1">وحدات قيد التفاوض</p><h3 class="text-3xl font-black dark:text-white">${activeProps.length}</h3>
                </div>
                <div class="bg-white dark:bg-royal-darkCard p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 border-b-4 border-b-green-500">
                    <p class="text-gray-500 dark:text-gray-400 text-sm font-bold mb-1">إقفال بيع (وحدة)</p><h3 class="text-3xl font-black dark:text-white">${mySoldProps.length}</h3>
                </div>
                <div class="bg-white dark:bg-royal-darkCard p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 border-b-4 border-b-royal-gold">
                    <p class="text-gray-500 dark:text-gray-400 text-sm font-bold mb-1">${isAdmin||isTL ? 'إجمالي المبيعات' : 'عمولتي المتوقعة'}</p><h3 class="text-3xl font-black dark:text-white">${isAdmin||isTL ? formatCurrency(mySales) : formatCurrency(mySales * state.settings.commissionRate)}</h3>
                </div>
            </div>

            <div class="bg-white dark:bg-royal-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 p-5 mb-8">
                <h4 class="font-bold text-lg dark:text-white mb-4"><i class="fas fa-handshake text-royal-gold"></i> الصفقات الجارية والوحدات تحت المتابعة</h4>
                ${activeDeals || '<p class="text-gray-500 text-sm font-bold">لا يوجد صفقات قيد التفاوض حالياً.</p>'}
            </div>
            `;

            if (isAdmin || isTL) {
                let teamUsers = activeUsers;
                if(isTL) {
                    teamUsers = activeUsers.filter(u => u.teamLeaderId === state.currentUser.id || u.id === state.currentUser.id);
                }

                const empStats = teamUsers.map(u => {
                    const uClients = state.clients.filter(c => !c.isDeleted && c.agentId === u.id).length;
                    const uSoldProps = allUnits.filter(p => p.status === 'sold' && (p.agentId === u.id || p.coAgentId === u.id));
                    const uSalesVol = uSoldProps.reduce((sum, p) => sum + p.price, 0);
                    return { ...u, clients: uClients, deals: uSoldProps.length, vol: uSalesVol };
                }).sort((a, b) => b.vol - a.vol);

                const leaderboardRows = empStats.map((u, i) => `
                    <tr class="border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50">
                        <td class="py-3 px-4 font-bold dark:text-white flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full bg-gray-200 dark:bg-gray-700 text-xs flex items-center justify-center">${i+1}</span>
                            ${u.name} <span class="text-xs text-gray-400">(${u.role === 'team_leader' ? 'ليدر' : 'مبيعات'})</span>
                        </td>
                        <td class="py-3 px-4 text-center font-bold text-blue-600">${u.clients}</td>
                        <td class="py-3 px-4 text-center font-bold text-green-600">${u.deals}</td>
                        <td class="py-3 px-4 font-black dark:text-gray-200">${formatCurrency(u.vol)}</td>
                    </tr>
                `).join('');

                html += `
                <div class="bg-white dark:bg-royal-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 p-5">
                    <h4 class="font-bold text-lg dark:text-white mb-4"><i class="fas fa-trophy text-yellow-500"></i> ترتيب الموظفين (Leaderboard)</h4>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right whitespace-nowrap">
                            <thead class="bg-gray-50 dark:bg-gray-800/50">
                                <tr>
                                    <th class="py-3 px-4 font-black">الموظف</th>
                                    <th class="py-3 px-4 font-black text-center">العملاء النشطين</th>
                                    <th class="py-3 px-4 font-black text-center">صفقات مباعة</th>
                                    <th class="py-3 px-4 font-black">حجم المبيعات</th>
                                </tr>
                            </thead>
                            <tbody>${leaderboardRows || '<tr><td colspan="4" class="text-center py-4 text-gray-500 font-bold">لا يوجد موظفين لعرضهم</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
                `;
            }

            return html;
        }

        function getLeadsHTML() {
            const isAdmin = ['admin'].includes(state.currentUser.role);
            
            // فلترة الملفات المتاحة بناءً على الصلاحيات
            let availableFiles = state.excelFiles.filter(f => !f.isDeleted);
            if (!isAdmin) {
                // الموظف العادي والتيم ليدر يرى ملفاته فقط
                availableFiles = availableFiles.filter(f => f.uploadedBy === state.currentUser.id);
            }

        function handleExcelUploadWorker(e) {
            const file = e.target.files[0];
            if(!file) return;
            showLoader("جاري قراءة الشيت لاستخراج البيانات...");
            const reader = new FileReader();
            reader.onload = function(evt) {
                const workerCode = `
                    importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
                    self.onmessage = function(e) {
                        try {
                            const workbook = XLSX.read(e.data, { type: 'binary' });
                            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                            self.postMessage({ success: true, data: json });
                        } catch (err) { self.postMessage({ success: false, error: err.message }); }
                    };
                `;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const workerUrl = URL.createObjectURL(blob);
                const worker = new Worker(workerUrl);
                
                worker.onmessage = function(msg) {
                    if(msg.data.success) {
                        let extractedLeads = [];
                        for(let i=1; i<msg.data.data.length; i++) {
                            const row = msg.data.data[i];
                            if(row[0] && row[1]) extractedLeads.push({ id: Date.now() + i, name: row[0], phone: String(row[1]), status: 'new', agentId: state.currentUser.id, notes: row[2] || '' });
                        }
                        // ربط الملف المرفوع بالـ ID الخاص بالموظف الذي رفعه
                        const newFile = { id: 'f' + Date.now(), name: file.name, date: new Date().toISOString().split('T')[0], leads: extractedLeads, isDeleted: false, uploadedBy: state.currentUser.id };
                        state.excelFiles.unshift(newFile); state.activeFileId = newFile.id;
                        logActivity(state.currentUser.id, 'رفع إكسيل', `تم رفع ملف (${file.name}) يحتوي على ${extractedLeads.length} عميل.`);
                        hideLoader(); showToast(`تم استيراد ${extractedLeads.length} عميل بنجاح`); if(state.currentView==='leads') renderView();
                    } else { hideLoader(); showToast('خطأ في الملف المرفوع', 'error'); }
                    worker.terminate(); URL.revokeObjectURL(workerUrl);
                };
                worker.postMessage(evt.target.result);
            };
            reader.readAsBinaryString(file); e.target.value = '';
        }

            const isAdmin = ['admin'].includes(state.currentUser.role);
            const isTL = state.currentUser.role === 'team_leader';

        window.loadWaFloors = function(projId) {

            if(!projId) { floorSel.innerHTML = '<option value="">-- اختر المشروع أولاً --</option>'; floorSel.disabled=true; unitSel.innerHTML='<option value="">-- اختر الدور أولاً --</option>'; unitSel.disabled=true; return; }
            
            const proj = state.projects.find(p => p.id == projId);
            let opts = '<option value="">-- اختر الدور --</option>';
            (proj.floors || []).forEach(f => { opts += `<option value="${f.id}">${f.name}</option>`; });
            floorSel.innerHTML = opts; floorSel.disabled = false;
            unitSel.innerHTML = '<option value="">-- اختر الدور أولاً --</option>'; unitSel.disabled = true;
        }

        window.loadWaUnits = function(floorId) {
            const projId = document.getElementById('wa-proj').value;
            const unitSel = document.getElementById('wa-unit');
            if(!floorId) { unitSel.innerHTML = '<option value="">-- اختر الدور أولاً --</option>'; unitSel.disabled = true; return; }
            
            const proj = state.projects.find(p => p.id == projId);
            const floor = (proj.floors || []).find(f => f.id == floorId);
            let opts = '<option value="">-- اختر الوحدة --</option>';
            (floor.units || []).forEach(u => { opts += `<option value="${u.id}">${u.title} - ${formatCurrency(u.price)}</option>`; });
            unitSel.innerHTML = opts; unitSel.disabled = false;
        }

        window.sendWhatsAppFlow = function(clientId) {
            const client = state.clients.find(c => c.id === clientId);
            const projId = document.getElementById('wa-proj').value;
            const floorId = document.getElementById('wa-floor').value;
            const unitId = document.getElementById('wa-unit').value;

            if(!unitId) return showToast('يرجى تحديد الوحدة للإرسال!', 'error');

            const proj = state.projects.find(p => p.id == projId);
            const floor = (proj.floors || []).find(f => f.id == floorId);
            const unit = (floor.units || []).find(u => u.id == unitId);

            let msg = `*عرض وحدة مميزة من ${state.settings.companyName}* 🌟\n\n`;
            msg += `🏢 *المشروع:* ${proj.name}\n📍 *الموقع:* ${proj.location}\n`;
            msg += `🚪 *الدور:* ${floor.name}\n`;
            msg += `🏘️ *الوحدة:* ${unit.title}\n`;
            msg += `💰 *السعر:* ${formatCurrency(unit.price)}\n`;
            msg += `📐 *المساحة:* ${unit.area}م²\n`;
            if(unit.type === 'سكني') {
                msg += `🛏️ *عدد الغرف:* ${unit.beds}\n`;
                if(unit.baths > 0) msg += `🛁 *الحمامات:* ${unit.baths}\n`;
            }
            
            const compSlug = state.settings.companyName.replace(/\s+/g, '').toLowerCase();
            const smartLink = `https://system.${compSlug}.com/unit/${proj.id}/${floor.id}/${unit.id}`;
            msg += `\n*🖼️ لمشاهدة جميع صور الوحدة (${(unit.images || []).length} صور) والتفاصيل، برجاء الضغط على الرابط التالي:*\n`;
            msg += `${smartLink}\n\nنسعد بتواصلكم معنا.`;

            let phone = client.phone.trim();
            if(phone.startsWith('01')) phone = '+20' + phone.substring(1);

            const whatsappUrl = `https://wa.me/${phone.replace(/[^0-9\+]/g, '')}?text=${encodeURIComponent(msg)}`;
            
            logActivity(state.currentUser.id, 'مراسلة عميل', `قام بإرسال تفاصيل الوحدة (${unit.title}) بمشروع (${proj.name}) للعميل (${client.name}) عبر الواتساب.`);
            client.history.push({ date: getExactDateTime(), note: `إرسال تفاصيل وحدة (${unit.title}) عبر الواتساب.` });
            
            window.open(whatsappUrl, '_blank');
            closeModal();
            showToast('جاري فتح الواتساب...');
        }

        window.handleAddProject = async function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('npr-imgs');
            let imagesArray = ['https://placehold.co/800x400/1e293b/D4AF37?text=No+Image'];
            if (fileInput.files.length > 0) {
                showLoader('جاري رفع واجهة المشروع...');
                try { imagesArray = await readMultipleFiles(fileInput.files); } catch (err) { showToast('خطأ بالصور', 'error'); }
                hideLoader();
            }
            const newProj = { id: Date.now(), name: document.getElementById('npr-name').value, location: document.getElementById('npr-loc').value, images: imagesArray, floors: [], constructionStages: [], isDeleted: false };
