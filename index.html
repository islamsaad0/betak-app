        .royal-input { 
            width: 100%; 
            padding: 0.75rem;

        .status-reserved-glow { animation: neonYellow 1.5s infinite alternate !important; }

        .prop-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 20px 40px -5px rgba(212, 175, 55, 0.4); 
        }
        .dark .prop-card:hover { 
            box-shadow: 0 20px 40px -5px rgba(212, 175, 55, 0.2); 
        }

        @keyframes pulse-fade {
            0% { opacity: 0.7; transform: scale(0.95); filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.4)); }

        }
        .logo-animated {
            animation: pulse-fade 2.5s ease-in-out infinite alternate;
        }

        @keyframes rotate-bg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .creator-badge-wrapper {
            position: relative; overflow: hidden; border-radius: 1rem; padding: 2px; margin-top: 1rem;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); transition: all 0.3s ease;
        }
        .creator-badge-wrapper:hover { 
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); 
            transform: translateY(-3px) scale(1.02); 
        }
        .creator-badge-wrapper::before {
            content: ''; position: absolute; top: -100%; left: -100%; width: 300%; height: 300%;
            background: conic-gradient(transparent, transparent, rgba(212, 175, 55, 0.1), #D4AF37, transparent 30%);
            animation: rotate-bg 3s linear infinite;
        }
        .creator-badge-inner { 
            position: relative; background: rgba(255, 255, 255, 0.95); border-radius: 0.9rem; 
            padding: 0.85rem 1rem; display: flex; align-items: center; justify-content: center; 
            gap: 0.6rem; z-index: 10; 
        }
        .dark .creator-badge-inner { background: rgba(15, 23, 42, 0.95); }

        .accordion-content { 
            transition: max-height 0.4s ease-out, opacity 0.4s ease-out; 
            max-height: 0; opacity: 0; overflow: hidden; 
        }
        .accordion-content.open { 
            max-height: 5000px; opacity: 1; overflow: visible; 
        }
        .accordion-icon { transition: transform 0.3s; }
        .accordion-icon.open { transform: rotate(180deg); }

                }
                key = 'tl:' + teamIds.slice().sort().join(',');
            }
            return { query, key };
        }

        // Idempotent: re-subscribes only when the visible scope changes (e.g. a team leader gets a new team member)
        function subscribeClients() {
            if (!state.currentUser) return;
            const info = getClientsQueryInfo();
            if (clientsUnsub && clientsListenerKey === info.key) return;
            if (clientsUnsub) { clientsUnsub(); clientsUnsub = null; }
            clientsListenerKey = info.key;
            clientsUnsub = info.query.onSnapshot(snap => {
                state.clients = snap.docs.map(d => d.data());
                renderActiveViewOnly();
                updateNotificationsUI(); // Update bell icon
                if (window.checkReminders) window.checkReminders();
            }, err => handleDbError(err));
        }

        let excelUnsubs = [];
        let excelListenerKey = null;

        function getExcelScopeInfo() {
            const role = state.currentUser.role;
            const uid = state.currentUser.id;
            if (role === 'admin') return { key: 'all', queries: [db.collection('ExcelFiles')] };
            const ids = [uid];
            if (role === 'team_leader') {
                state.users.filter(u => u.teamLeaderId === uid).forEach(u => { if (!ids.includes(u.id)) ids.push(u.id); });
            }
            const chunks = [];
            for (let k = 0; k < ids.length; k += 10) chunks.push(ids.slice(k, k + 10)); // حد Firestore: 10 في الـ in
            const queries = chunks.map(ch => ch.length === 1
                ? db.collection('ExcelFiles').where('uploadedBy', '==', ch[0])
                : db.collection('ExcelFiles').where('uploadedBy', 'in', ch));
            return { key: (role === 'team_leader' ? 'tl:' : 'own:') + ids.slice().sort().join(','), queries };
        }

        // Idempotent: يعيد الاشتراك فقط لو نطاق الرؤية اتغير (مثلاً انضم موظف جديد لفريق التيم ليدر)
        function subscribeExcelFiles() {
            if (!state.currentUser) return;
            const info = getExcelScopeInfo();
            if (excelUnsubs.length && excelListenerKey === info.key) return;
            excelUnsubs.forEach(u => u());
            excelUnsubs = [];
            excelListenerKey = info.key;
            const results = info.queries.map(() => []);
            const publish = () => {
                state.excelFiles = [].concat(...results);
                const visible = getVisibleExcelFiles();
                if (!visible.find(f => f.id === state.activeFileId)) {
                    state.activeFileId = visible.length ? visible[0].id : null;
                }
                renderActiveViewOnly();
            };
            excelUnsubs = info.queries.map((q, idx) => q.onSnapshot(snap => {
                results[idx] = snap.docs.map(d => d.data());
                publish();
            }, err => handleDbError(err)));
        }

        // طبقة حماية إضافية على الشاشة: كل دور يشوف ملفاته المسموحة فقط (ومبيشوفش الملفات المحذوفة)
        function getVisibleExcelFiles() {
            if (!state.currentUser) return [];
            const role = state.currentUser.role;
            const uid = state.currentUser.id;
            const files = state.excelFiles.filter(f => !f.isDeleted);
            if (role === 'admin') return files;
            const allowed = [uid];
            if (role === 'team_leader') state.users.filter(u => u.teamLeaderId === uid).forEach(u => allowed.push(u.id));
            return files.filter(f => allowed.includes(f.uploadedBy));
        }

        function getActiveExcelFile() {
            return getVisibleExcelFiles().find(f => f.id === state.activeFileId);
        }

        async function initRealtimeListeners() {
            // تنظيف المستمعين السابقين عند تغيير المستخدم أو تسجيل الخروج
            unsubscribers.forEach(unsub => unsub());
            unsubscribers = [];
            cloudStatus = 'connected';
            
            if(typeof updateSyncStatus === 'function') updateSyncStatus();

            const role = state.currentUser.role;
            const uid = state.currentUser.id;

            // 1. Settings Listener
            unsubscribers.push(
                db.collection('System').doc('Settings').onSnapshot(doc => {
                    if (doc.exists) { 
                        const _sd = doc.data() || {}; if (!isCustomLogo(_sd.logo)) delete _sd.logo; state.settings = Object.assign({}, state.settings, _sd); rememberLogo(state.settings.logo); updateLogoImages(); 
                        renderActiveViewOnly(); 
                    }
                }, err => handleDbError(err))
            );

            // 2. Users Listener
            unsubscribers.push(
                db.collection('Users').onSnapshot(snap => {
                    state.users = snap.docs.map(d => d.data());
                    const updatedMe = state.users.find(u => u.id === uid && !u.isDeleted);
                    if(updatedMe) {
                        state.currentUser = updatedMe;
                    } else {
                        handleLogout(); 
                        return;
                    }
                    subscribeClients();
                    subscribeExcelFiles();
                    renderActiveViewOnly();
                }, err => handleDbError(err))
            );

            // 3. Projects Listener
            unsubscribers.push(
                db.collection('Projects').onSnapshot(snap => {
                    state.projects = snap.docs.map(d => d.data());
                    renderActiveViewOnly();
                }, err => handleDbError(err))
            );

            // 4. Clients Listener (Server-Side Filtering)
            clientsListenerKey = null;
            unsubscribers.push(() => { if (clientsUnsub) { clientsUnsub(); clientsUnsub = null; } clientsListenerKey = null; });
            subscribeClients();

            // 5. ExcelFiles Listener (مقيّد من السيرفر: المدير = الكل، التيم ليدر = فريقه + ملفاته، غيرهم = ملفاتهم فقط)
            excelListenerKey = null;
            unsubscribers.push(() => { excelUnsubs.forEach(u => u()); excelUnsubs = []; excelListenerKey = null; });
            subscribeExcelFiles();

            // 6. Archive Listener
            unsubscribers.push(
                db.collection('Archive').orderBy('date', 'desc').limit(200).onSnapshot(snap => {
                    state.archive = snap.docs.map(d => d.data());
                    renderActiveViewOnly();
                    updateNotificationsUI(); // Update bell icon
                }, err => handleDbError(err))
            );
        }

        function updateSyncStatus() {
            const indMain = document.getElementById('sync-indicator');
            const indMobile = document.getElementById('sync-indicator-mobile');
            const isOnline = navigator.onLine;
            
            let isGreen = false;
            let titleText = "";

            if (!isOnline) { 
                isGreen = false; 
                titleText = "أوفلاين (الإنترنت مقطوع)"; 
            } else if (cloudStatus === 'error') { 
                isGreen = false;

                } else {

            };
            
            setStatus(indMain);

        function escapeHTML(str) {
            return String(str === undefined || str === null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

        function showToast(message, type = 'success', persist = false, options = {}) {
            const container = document.getElementById('toast-container'); 
            if (!container) return null;
            const key = options && options.key ? options.key : null;
            if (key) {
                container.querySelectorAll('[data-toast-key="' + key + '"]').forEach(old => old.remove());
            }
            const toast = document.createElement('div');
            if (key) toast.setAttribute('data-toast-key', key);
            let bgColor = type === 'success' ? 'bg-green-500' : (type === 'error' ? 'bg-red-500' : (type === 'warning' ? 'bg-vivid-orange' : 'bg-blue-500'));
            
            toast.className = `pointer-events-auto ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 opacity-0 translate-y-[-20px] flex items-center gap-3 font-bold border border-white/20 max-w-[92vw]`;
            
            let icon = type === 'error' ? 'fa-exclamation-circle' : (type === 'warning' ? 'fa-bell' : 'fa-check-circle');
            toast.innerHTML = `<i class="fas ${icon} text-xl animate-pulse"></i><span class="flex-1">${message}</span>`;

            let closed = false;
            const dismiss = () => {
                if (closed) return;
                closed = true;
                toast.removeAttribute('data-toast-key');
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
                if (options && typeof options.onClose === 'function') { try { options.onClose(); } catch(e) { console.error(e); } }
            };

            // زر الإغلاق الدائم (event listener حقيقي وليس inline)
            if (persist) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.setAttribute('aria-label', 'إغلاق');
                btn.className = 'shrink-0 w-9 h-9 flex items-center justify-center text-white bg-white/20 hover:bg-white/40 rounded-full transition-colors focus:outline-none';
                btn.innerHTML = '<i class="fas fa-times"></i>';
                btn.addEventListener('click', (ev) => { ev.preventDefault(); ev.stopPropagation(); dismiss(); });
                toast.appendChild(btn);
            }
            
            container.appendChild(toast); 
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-[-20px]'), 10);
            if (!persist) setTimeout(dismiss, 4000);
            toast.dismissToast = dismiss;
            return toast;
        }

        const readMultipleFiles = async (files) => {
            const cloudName = "ok4jlpdx"; 
            const uploadPreset = "BETAK realestate_preset"; 
            const results = [];
            for (let i = 0; i < files.length; i++) {
                const formData = new FormData(); 
                formData.append("file", files[i]); 
                formData.append("upload_preset", uploadPreset);
                try { 
                    const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, { method: "POST", body: formData }); 
                    const data = await response.json(); 
                    if (data.secure_url) results.push(data.secure_url); 
                } catch (error) { console.error("حصل خطأ في رفع الصورة:", error); }
            } 
            return results; 
        };

        // ===== تخزين حالة الإشعارات المقفولة لكل مستخدم =====
        function loadNotiStore() {
            const today = getTodayStr();
            const empty = { date: today, toastAck: [], bellDismissed: [], logsDismissed: [] };
            if (!state.currentUser) return empty;
            try {
                const raw = localStorage.getItem('betak_noti_' + state.currentUser.id);
                if (!raw) return empty;
                const st = JSON.parse(raw);
                if (st.date !== today) { st.date = today; st.toastAck = []; st.bellDismissed = []; }
                st.toastAck = st.toastAck || [];
                st.bellDismissed = st.bellDismissed || [];
                st.logsDismissed = st.logsDismissed || [];
                return st;
            } catch(e) { return empty; }
        }

        function saveNotiStore(st) {
            if (!state.currentUser) return;
            try {
                st.logsDismissed = (st.logsDismissed || []).slice(-300);
                localStorage.setItem('betak_noti_' + state.currentUser.id, JSON.stringify(st));
            } catch(e) {}
        }

        function getMyDueClients() {
            if(!state.currentUser) return [];
            const today = getTodayStr();
            return state.clients.filter(c => c.agentId === state.currentUser.id && c.followUpDate === today && !c.isDeleted);
        }

        function getVisibleNotiLogs(st) {
            return state.archive
                .filter(a => a.userId === state.currentUser.id && !st.logsDismissed.includes(String(a.id)))
                .sort((a,b) => new Date(b.date) - new Date(a.date))
                .slice(0, 5);
        }

            if (event) { event.preventDefault(); event.stopPropagation(); }
            const st = loadNotiStore();
            const sid = String(id);
            if (kind === 'client') { if (!st.bellDismissed.includes(sid)) st.bellDismissed.push(sid); }
            else if (kind === 'log') { if (!st.logsDismissed.includes(sid)) st.logsDismissed.push(sid); }
            saveNotiStore(st);
            updateNotificationsUI();
        }

        window.clearAllNotis = function(event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            if (!state.currentUser) return;
            const st = loadNotiStore();
            getMyDueClients().forEach(c => {
                const sid = String(c.id);
                if (!st.bellDismissed.includes(sid)) st.bellDismissed.push(sid);
                if (!st.toastAck.includes(sid)) st.toastAck.push(sid);

        window.checkReminders = function() {
            if(!state.currentUser) return;
            const st = loadNotiStore();
            const pending = getMyDueClients().filter(c => !st.toastAck.includes(String(c.id)));

            // مفيش متابعات جديدة (أو اتقفلت) => نشيل أي تذكير ظاهر وما نكررش
            if (pending.length === 0) { clearReminderToast(); return; }

            const sig = pending.map(c => String(c.id)).sort().join(',');
            const container = document.getElementById('toast-container');
            const alreadyShown = container && container.querySelector('[data-toast-key="followup-reminder"]');
            if (alreadyShown && sig === lastReminderSig) return; // نفس التذكير ظاهر بالفعل: لا تكرار

            const isNewSet = sig !== lastReminderSig;
            lastReminderSig = sig;

            const names = pending.map(c => escapeHTML(c.name)).join('، ');
            showToast(`تذكير هام! لديك متابعات اليوم مع: ${names}`, 'warning', true, {
                key: 'followup-reminder',
                onClose: () => {
                    // عند الضغط على X: نسجل إن التذكير اتشاف عشان ما يتكررش النهاردة
                    const s2 = loadNotiStore();
                    pending.forEach(c => { const id = String(c.id); if (!s2.toastAck.includes(id)) s2.toastAck.push(id); });
                    saveNotiStore(s2);
                    lastReminderSig = '';
                }
            });

            if (isNewSet) {
                const audio = document.getElementById('reminder-sound');
                if(audio) { 
                    audio.volume = 0.7; 
                    audio.play().catch(e => console.log('Audio blocked.')); 
                }
            }
        };
        
        setInterval(() => { 
            if(window.checkReminders) window.checkReminders(); 
            if(typeof updateNotificationsUI === 'function') updateNotificationsUI();
        }, 30 * 60 * 1000);

                case 'properties': mainContent.innerHTML = getProjectsHTML(); break;
                case 'construction': mainContent.innerHTML = getConstructionHTML(); break;
                case 'archive': mainContent.innerHTML = getArchiveHTML(); break;
                case 'reports': if(!checkPerm('canViewReports')) changeView('dashboard'); else mainContent.innerHTML = getReportsHTML(); break;
                case 'users': if(!checkPerm('canManageUsers')) changeView('dashboard'); else mainContent.innerHTML = getUsersHTML(); break;
                case 'targets': if(!checkPerm('canManageTargets')) changeView('dashboard'); else mainContent.innerHTML = getTargetsHTML(); break;

            if(state.currentUser.role !== 'admin') return;
            let collectionName = '';
            if(type === 'client') collectionName = 'Clients'; 
            else if(type === 'project') collectionName = 'Projects'; 
            else if(type === 'user') collectionName = 'Users'; 
            else if(type === 'excel') collectionName = 'ExcelFiles';
            
            if(collectionName) {
                db.collection(collectionName).doc(id.toString()).update({ isDeleted: false, deletedAt: null }).then(() => {
                    showToast('تم الاسترجاع بنجاح'); 
                    logActivity(state.currentUser.id, 'استرجاع من المهملات', `تم الاسترجاع من سلة المهملات`);

            }
        }

            if(state.currentUser.role !== 'admin') return;
            showConfirmModal('سيتم حذف هذا العنصر نهائياً وللأبد من قاعدة البيانات. هل أنت متأكد؟', 'حذف نهائي', 'bg-red-700', () => {
                let collectionName = '';
                if(type === 'client') collectionName = 'Clients'; 
                else if(type === 'project') collectionName = 'Projects'; 
                else if(type === 'user') collectionName = 'Users'; 
                else if(type === 'excel') collectionName = 'ExcelFiles';

                if(collectionName) {
                    db.collection(collectionName).doc(id.toString()).delete().then(() => {
                        logActivity(state.currentUser.id, 'حذف نهائي', `تم الحذف النهائي لعنصر من نوع ${type}`);

            });

            const activeUsers = state.users.filter(u => !u.isDeleted && u.role !== 'data_entry' && u.role !== 'admin');
            
            let myClients = state.clients.filter(c => !c.isDeleted && c.agentId === state.currentUser.id);
            let myProps = allUnits.filter(p => p.agentId === state.currentUser.id || p.coAgentId === state.currentUser.id);
            
            if (isAdmin) { 
                myClients = state.clients.filter(c => !c.isDeleted); 
                myProps = allUnits.filter(p => p.status !== 'available'); 
            } 
            else if (isTL) { 
                const myTeamIds = state.users.filter(u => u.teamLeaderId === state.currentUser.id).map(u => u.id);

                myProps = allUnits.filter(p => myTeamIds.includes(p.agentId) || myTeamIds.includes(p.coAgentId)); 
            }

            const mySoldProps = myProps.filter(p => p.status === 'sold'); 
            const mySales = mySoldProps.reduce((sum, p) => sum + p.price, 0);
            
            const activeProps = myProps.filter(p => p.status === 'negotiation' || p.status === 'reserved');
            const activeDeals = activeProps.map(p => `

        window.handleExcelUploadWorker = function(e) {
            const file = e.target.files[0]; 
            if(!file) return; 
            showLoader("جاري قراءة الشيت...");
            const reader = new FileReader();
            reader.onload = function(evt) {
                const workerCode = `
                    importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); 
                    self.onmessage = function(e) { 
                        try { 
                            const workbook = XLSX.read(e.data, { type: 'binary' }); 
                            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 }); 
                            self.postMessage({ success: true, data: json }); 
                        } catch (err) { 
                            self.postMessage({ success: false, error: err.message }); 
                        } 
                    };
                `;
                const blob = new Blob([workerCode], { type: 'application/javascript' }); 
                const workerUrl = URL.createObjectURL(blob); 
                const worker = new Worker(workerUrl);
                
                worker.onmessage = function(msg) {
                    if(msg.data.success) {
                        let extractedLeads = [];
                        for(let i=1; i<msg.data.data.length; i++) { 
                            const row = msg.data.data[i]; 
                            if(row[0] && row[1]) {
                                extractedLeads.push({ id: Date.now() + i, name: row[0], phone: String(row[1]), status: 'new', agentId: state.currentUser.id, notes: row[2] || '' }); 
                            }
                        }
                        const newFile = { 
                            id: 'f' + Date.now(), 
                            name: file.name, 
                            date: new Date().toISOString().split('T')[0], 
                            leads: extractedLeads, 
                            isDeleted: false, 
                            uploadedBy: state.currentUser.id 
                        };
                        
                        db.collection('ExcelFiles').doc(newFile.id).set(newFile);
                        logActivity(state.currentUser.id, 'رفع إكسيل', `تم رفع ملف (${file.name}) يحتوي على ${extractedLeads.length} عميل.`);
                        hideLoader(); 
                        showToast(`تم استيراد ${extractedLeads.length} عميل`);
                    } else { 
                        hideLoader(); 
                        showToast('خطأ في الملف المرفوع', 'error'); 
                    }
                    worker.terminate(); 
                    URL.revokeObjectURL(workerUrl);
                }; 
                worker.postMessage(evt.target.result);
            }; 
            reader.readAsBinaryString(file); 
            e.target.value = '';
        }

                    return c.name.toLowerCase().includes(term) || c.phone.includes(term) || c.interests.toLowerCase().includes(term) || agentName.toLowerCase().includes(term); 
                });

            if(state.filters.clientDateFrom) {
                filteredClients = filteredClients.filter(c => c.followUpDate >= state.filters.clientDateFrom);

            if(state.filters.clientDateTo) {

                const today = getTodayStr();
                const needsCall = c.followUpDate === today ? 'animate-pulse text-red-500' : '';
                
                // Badges logic (6 words chunking)
                let interestsText = c.interests || '';
                let words = interestsText.split(/\s+/);
                let chunks = [];
                for (let i = 0; i < words.length; i += 6) {
                    chunks.push(words.slice(i, i + 6).join(' '));
                }
                const badgeColors = [
                    'bg-blue-50 text-blue-600 border-blue-200 dark:bg-blue-900/30 dark:border-blue-800/50',

                    'bg-orange-50 text-orange-600 border-orange-200 dark:bg-orange-900/30 dark:border-orange-800/50'

                    if(!chunk.trim()) return '';
                    let colorClass = badgeColors[index % badgeColors.length];
                    return `<span class="inline-block px-2 py-1 mb-1 ml-1 rounded-md text-[11px] font-bold border shadow-sm ${colorClass}">${chunk}</span>`;

                    </td>
                    <td class="py-4 px-4 text-sm font-bold dark:text-gray-400 whitespace-normal max-w-xs leading-relaxed">
                        <div class="text-royal-gold mb-1">${c.propertyType}</div>

                    <td class="py-4 px-4 font-black text-green-600 dark:text-green-400">${formatCurrency(c.budget)}</td>
                    <td class="py-4 px-4 text-sm font-bold text-gray-500 ${needsCall}">${formatDate(c.followUpDate)}</td>

                            <button onclick="restoreClient(${c.id})" class="text-green-600 bg-green-50 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors"><i class="fas fa-recycle mr-1"></i> استعادة</button>
                        ` : '') : `

                            <button onclick="openWhatsAppModal(${c.id})" class="bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors hover:scale-105" title="إرسال عرض وحدة للعميل"><i class="fas fa-paper-plane"></i></button>

        window.handleEditClient = function(e, id) {

            const n = document.getElementById('ec-name').value; 
            const ph = document.getElementById('ec-phone').value; 
            const b = parseInt(document.getElementById('ec-budget').value) || 0;

            });
        }

        function normalizePhoneDigits(phone) {
            let str = String(phone || '').trim();
            const ar = '٠١٢٣٤٥٦٧٨٩', fa = '۰۱۲۳۴۵۶۷۸۹';
            return str.replace(/[٠-٩]/g, d => ar.indexOf(d)).replace(/[۰-۹]/g, d => fa.indexOf(d));
        }

        function getTelHref(phone) {
            const str = normalizePhoneDigits(phone);
            return 'tel:' + (str.startsWith('+') ? '+' : '') + str.replace(/\D/g, '');
        }

        // رقم صالح لـ wa.me: أرقام فقط بكود الدولة (افتراضي مصر 20)
        function getWaNumber(phone) {
            const str = normalizePhoneDigits(phone);
            const digits = str.replace(/\D/g, '');
            if (!digits) return '';
            if (str.startsWith('+')) return digits;
            if (digits.startsWith('00')) return digits.substring(2);
            if (digits.startsWith('0')) return '20' + digits.substring(1);
            if (digits.length === 10 && digits.startsWith('1')) return '20' + digits;
            return digits;
        }

        window.openWhatsAppDirect = function(clientId) {
            const client = state.clients.find(c => c.id === clientId);
            if (!client) return showToast('بيانات العميل غير متاحة', 'error');
            const num = getWaNumber(client.phone);
            if (!num) return showToast('رقم العميل غير صالح للواتساب', 'error');
            window.open('https://wa.me/' + num, '_blank', 'noopener');
        }

        window.copyClientPhone = function(clientId) {
            const client = state.clients.find(c => c.id === clientId);
            if (!client) return;
            const text = String(client.phone || '');
            const done = () => showToast('تم نسخ الرقم');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(() => showToast('تعذر نسخ الرقم', 'error'));
            } else {
                const ta = document.createElement('textarea');
                ta.value = text; document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); done(); } catch(e) { showToast('تعذر نسخ الرقم', 'error'); }
                ta.remove();
            }
        }

        window.openClientProfile = function(id, focusNotes = false) {

            const allUnits = getAllUnits();

            if(linkedUnits.length > 0) {

                    </div>`;
                }).join('');
            } else {

                    <div class="flex justify-between items-start mb-2">
                        <div class="flex flex-col gap-0.5">

                        </div>

        window.saveClientNote = function(clientId) {
            const noteInput = document.getElementById('new-client-note');
            const noteText = noteInput ? noteInput.value.trim() : ''; 
            const noteDateEl = document.getElementById('new-client-note-date');
            const noteDateVal = noteDateEl ? noteDateEl.value : null;
            
            if(!noteText) { showToast('اكتب الملاحظة الأول', 'warning'); return; }
            
            const c = state.clients.find(x => x.id === clientId); 
            if(!c) return showToast('بيانات العميل غير متاحة', 'error');
            if(!Array.isArray(c.clientNotes)) c.clientNotes = [];
            if(!Array.isArray(c.history)) c.history = [];
            
            const finalDate = noteDateVal ? new Date(noteDateVal).toISOString() : new Date().toISOString();
            const newNote = { id: Date.now(), text: noteText, date: finalDate, byId: state.currentUser.id, byName: state.currentUser.name }; 
            const historyEntry = { date: new Date().toISOString(), note: `تم إضافة ملاحظة جديدة للعميل بواسطة ${state.currentUser.name}.` };

            // تحديث فوري للشاشة
            c.clientNotes.push(newNote); 
            c.history.push(historyEntry);
            openClientProfile(clientId);
            
            // arrayUnion: بيضيف الملاحظة من غير ما يمسح ملاحظات غيرك (مدير/تيم ليدر/موظف بيكتبوا في نفس الوقت)
            db.collection('Clients').doc(clientId.toString()).update({ 
                clientNotes: firebase.firestore.FieldValue.arrayUnion(newNote), 
                history: firebase.firestore.FieldValue.arrayUnion(historyEntry) 
            }).then(() => { 
                logActivity(state.currentUser.id, 'ملاحظة عميل', `أضاف ملاحظة للعميل ${c.name}`); 
                showToast('تم حفظ الملاحظة'); 
            }).catch(err => {
                console.error('Note save error:', err);
                showToast('تعذر حفظ الملاحظة، تأكد من الاتصال وحاول تاني', 'error');
                openClientProfile(clientId);
            });
        }

                c.clientNotes = c.clientNotes.filter(n => n.id !== noteId);
                db.collection('Clients').doc(clientId.toString()).update({ clientNotes: c.clientNotes }).then(() => { 
                    openClientProfile(clientId); 
                });
            });
        }

        window.loadWaFloors = function(projId) { 
            const floorSel = document.getElementById('wa-floor');

            if(!projId) {

            const proj = state.projects.find(p => p.id == projId);

            floorSel.disabled = false; 
            unitSel.innerHTML = '<option value="">-- اختر الدور أولاً --</option>';

        window.loadWaUnits = function(floorId) { 
            const projId = document.getElementById('wa-proj').value; 
            const unitSel = document.getElementById('wa-unit'); 
            if(!floorId) { 
                unitSel.innerHTML = '<option value="">-- اختر الدور أولاً --</option>';

                return; 
            } 
            const proj = state.projects.find(p => p.id == projId); 
            const floor = (proj.floors || []).find(f => f.id == floorId); 
            let opts = '<option value="">-- اختر الوحدة --</option>';

        window.sendWhatsAppFlow = function(clientId) {
            const client = state.clients.find(c => c.id === clientId); 
            const projId = document.getElementById('wa-proj').value; 
            const floorId = document.getElementById('wa-floor').value; 
            const unitId = document.getElementById('wa-unit').value;
            
            if(!unitId) return showToast('يرجى تحديد الوحدة للإرسال!', 'error');
            
            const proj = state.projects.find(p => p.id == projId); 
            const floor = (proj.floors || []).find(f => f.id == floorId); 
            const unit = (floor.units || []).find(u => u.id == unitId);
            
            let msg = `*عرض وحدة مميزة من ${state.settings.companyName}* 🌟\n\n`; 
            msg += `🏢 *المشروع:* ${proj.name}\n📍 *الموقع:* ${proj.location}\n`; 
            msg += `🚪 *الدور:* ${floor.name}\n`; 
            msg += `🏘️ *الوحدة:* ${unit.title}\n`; 
            msg += `💰 *السعر:* ${formatCurrency(unit.price)}\n`; 
            msg += `📐 *المساحة:* ${unit.area}م²\n`; 
            
            if(unit.type === 'سكني') { 
                msg += `🛏️ *عدد الغرف:* ${unit.beds}\n`; 
                if(unit.baths > 0) msg += `🛁 *الحمامات:* ${unit.baths}\n`; 
            }
            
            const compSlug = state.settings.companyName.replace(/\s+/g, '').toLowerCase(); 
            const smartLink = `https://system.${compSlug}.com/unit/${proj.id}/${floor.id}/${unit.id}`; 
            msg += `\n*🖼️ لمشاهدة جميع صور الوحدة (${(unit.images || []).length} صور) والتفاصيل، برجاء الضغط على الرابط التالي:*\n`; 
            msg += `${smartLink}\n\nنسعد بتواصلكم معنا.`;
            
            const whatsappUrl = `https://wa.me/${getWaNumber(client.phone)}?text=${encodeURIComponent(msg)}`;
            
            client.history.push({ date: getExactDateTime(), note: `إرسال تفاصيل وحدة (${unit.title}) عبر الواتساب.` }); 
            db.collection('Clients').doc(clientId.toString()).update({ history: client.history }).then(() => { 
                logActivity(state.currentUser.id, 'مراسلة عميل', `قام بإرسال تفاصيل الوحدة (${unit.title}) بمشروع (${proj.name}) للعميل (${client.name}) عبر الواتساب.`); 
                window.open(whatsappUrl, '_blank'); 
                closeModal(); 
                showToast('جاري فتح الواتساب...'); 
            });
        }

                                        <button onclick="openHelpUnitModal(${projId}, ${floor.id}, ${u.id})" class="flex-1 bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 py-1 rounded text-[10px] font-bold hover:bg-blue-100 transition-colors">طلب مساعدة</button>

                                ` : u.status === 'sold' ? `
                                    <div class="w-full bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400 text-center py-1.5 rounded-lg font-bold text-sm"><i class="fas fa-lock mr-1"></i> مباع</div>

            return `

                    <div class="flex gap-6 mt-4">
                        <div class="text-center"><span class="block text-2xl font-black dark:text-white">${(proj.floors || []).length}</span><span class="text-sm text-gray-500 font-bold">إجمالي الأدوار</span></div>

                    </div>
                </div>
                <div class="flex gap-2 mt-4 md:mt-0 md:absolute md:bottom-6 md:left-6">
                    ${isDataEntryOrAdmin ? `
                        <button onclick="openEditProjectModal(${projId})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-bold shadow-lg transition-transform hover:-translate-y-1 text-sm"><i class="fas fa-edit"></i> تعديل</button>
                        <button onclick="openAddFloorModal(${projId})" class="bg-vivid-orange hover:bg-vivid-orangeDark text-white px-4 py-2.5 rounded-xl font-bold shadow-lg transition-transform hover:-translate-y-1 text-sm"><i class="fas fa-layer-group"></i> دور جديد</button>
                    ` : ''}
                </div>
            </div>
            
            <div class="mb-10">
                <h3 class="text-xl font-black dark:text-white mb-4"><i class="fas fa-building text-royal-gold"></i> المخطط الداخلي للمشروع</h3>
                ${floorsHTML || '<div class="text-center p-10 bg-white dark:bg-royal-darkCard rounded-xl shadow-sm text-gray-400 font-bold border border-gray-100 dark:border-gray-800">لا يوجد أدوار مسجلة في هذا المشروع</div>'}
            </div>`;

            const proj = state.projects.find(p => p.id === projId);

        window.handleEditProject = async function(e, projId) { 
            e.preventDefault(); 
            const proj = state.projects.find(p => p.id === projId); 
            const fileInput = document.getElementById('eproj-imgs'); 
            
            if (fileInput.files.length > 0) { 
                showLoader('جاري التحديث...'); 
                try { proj.images = await readMultipleFiles(fileInput.files); } catch (err) {} 
                hideLoader(); 
            } 
            
            proj.name = document.getElementById('eproj-name').value; 
            proj.location = document.getElementById('eproj-loc').value; 
            
            db.collection('Projects').doc(projId.toString()).update({ name: proj.name, location: proj.location, images: proj.images }).then(() => { 
                logActivity(state.currentUser.id, 'مشاريع', `تم تعديل بيانات المشروع: ${proj.name}`); 
                closeModal(); 
                showToast('تم تعديل المشروع بنجاح.'); 
            }); 
        }

        window.openAddFloorModal = function(projId) { 
            showPromptModal('أدخل اسم الدور الجديد (مثال: الدور الأرضي، الدور الأول...):', '', (val) => { 
                if(val.trim()) { 
                    const proj = state.projects.find(p => p.id === projId); 
                    if(!proj.floors) proj.floors = []; 
                    proj.floors.push({ id: Date.now(), name: val, units: [] }); 
                    
                    db.collection('Projects').doc(projId.toString()).update({ floors: proj.floors }).then(() => { 
                        logActivity(state.currentUser.id, 'مشاريع', `إضافة ${val} لمشروع ${proj.name}`); 
                        showToast('تم إضافة الدور.'); 
                    }); 
                } 
            }); 
        }

        window.toggleUnitBeds = function(val, wrapId) { 
            document.getElementById(wrapId).style.display = (val === 'سكني') ? 'block' : 'none';

        window.handleAddUnit = async function(e, projId, floorId) {
            e.preventDefault(); 
            const fileInput = document.getElementById('nu-imgs'); 
            let imagesArray = ['https://placehold.co/800x400/1e293b/D4AF37?text=Unit+Image']; 
            
            if (fileInput.files.length > 0) { 
                showLoader('جاري رفع الصور...'); 
                try { imagesArray = await readMultipleFiles(fileInput.files); } catch(err){} 
                hideLoader(); 
            }
            
            const proj = state.projects.find(p => p.id === projId); 
            const floor = proj.floors.find(f => f.id === floorId); 
            const type = document.getElementById('nu-type').value; 
            const beds = type === 'سكني' ? parseInt(document.getElementById('nu-beds').value) || 0 : 0;
            
            const newUnit = { 
                id: Date.now(), 
                title: document.getElementById('nu-title').value, 
                type: type, 
                price: parseInt(document.getElementById('nu-price').value), 
                area: parseInt(document.getElementById('nu-area').value), 
                beds: beds, 
                baths: type === 'سكني' ? 1 : 0, 
                images: imagesArray, 
                status: 'available', 
                agentId: null, 
                coAgentId: null, 
                clientId: null, 
                notes: '', 
                history: [{date: getExactDateTime(), note: 'تم إضافة الوحدة للنظام.'}] 
            };
            
            if(!floor.units) floor.units = []; 
            floor.units.push(newUnit); 
            
            db.collection('Projects').doc(projId.toString()).update({ floors: proj.floors }).then(() => { 
                logActivity(state.currentUser.id, 'مشاريع', `تم إضافة وحدة (${newUnit.title}) بـ ${proj.name}`); 
                closeModal(); 
                showToast('تم الحفظ'); 
            });
        }

                db.collection('Projects').doc(pId.toString()).update({ floors: p.floors }).then(() => {

        }

        window.toggleUnitClientReq = function(val) { 
            document.getElementById('uclient-wrap').style.display = (val === 'available') ? 'none' : 'block'; 
        }

        window.handleUnitStatusChange = function(e, pId, fId, uId) {
            e.preventDefault(); 
            const p = state.projects.find(pr=>pr.id===pId); 
            const u = p.floors.find(f=>f.id===fId).units.find(x=>x.id===uId); 
            const newStatus = document.getElementById('us-status').value; 
            const clientId = document.getElementById('us-client').value; 
            const notes = document.getElementById('us-notes').value; 
            const client = clientId ? state.clients.find(c => c.id == clientId) : null;
            
            if(newStatus !== 'available' && !client) return showToast('يجب اختيار عميل!', 'error');
            
            u.status = newStatus; 
            u.clientId = client ? client.id : null; 
            
            if(u.status === 'available') { 
                u.agentId = null; 
                u.coAgentId = null; 
            } else if(!u.agentId) {
                u.agentId = state.currentUser.id; 
            }
            
            u.notes = notes;
            
            const stTxt = { 'available':'متاح', 'negotiation':'تفاوض', 'reserved':'حجز', 'sold':'مباع' }[newStatus]; 
            const actionTime = getExactDateTime(); 
            u.history.push({ date: actionTime, note: `الحالة: ${stTxt}. الملاحظات: ${notes}` });
            
            if(client) { 
                client.history.push({ date: actionTime, note: `تحديث تفاوض على (${u.title}): ${notes || stTxt}` }); 
                db.collection('Clients').doc(client.id.toString()).update({ history: client.history }); 
            }
            
            db.collection('Projects').doc(pId.toString()).update({ floors: p.floors }).then(() => { 
                if(newStatus === 'sold') { 
                    const comm = u.price * state.settings.commissionRate; 
                    confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } }); 
                    showToast('ألف مبروك! تم إقفال الديل بنجاح.', 'success'); 
                    logActivity(state.currentUser.id, 'تحديث وحدة', `غيّر حالة الوحدة [${u.title}] إلى ${stTxt}. العميل: ${client.name}. **(عمولة: ${formatCurrency(comm)})**`); 
                } else { 
                    showToast('تم التحديث بنجاح'); 
                    logActivity(state.currentUser.id, 'تحديث وحدة', `غيّر حالة الوحدة [${u.title}] إلى ${stTxt}.${client ? ' العميل: ' + client.name : ''}`); 
                } 
                closeModal(); 
            });
        }

        window.handleAddStage = async function(e, projId) { 
            e.preventDefault(); 
            const fileInput = document.getElementById('ns-imgs'); 
            let imagesArray = []; 
            if (fileInput.files.length > 0) { 
                showLoader('جاري الرفع...'); 
                try { imagesArray = await readMultipleFiles(fileInput.files); } catch(err){} 
                hideLoader(); 
            } 
            const proj = state.projects.find(p => p.id === projId); 
            if(!proj.constructionStages) proj.constructionStages = []; 
            
            const newStage = { 
                id: Date.now(), 
                title: document.getElementById('ns-title').value, 
                date: document.getElementById('ns-date').value, 
                description: document.getElementById('ns-desc').value, 
                images: imagesArray 
            }; 
            
            proj.constructionStages.push(newStage); 
            db.collection('Projects').doc(projId.toString()).update({ constructionStages: proj.constructionStages }).then(() => { 
                logActivity(state.currentUser.id, 'مراحل الإنشاء', `تحديث إنشاءات بمشروع ${proj.name}`); 
                closeModal(); 
                showToast('تم النشر بنجاح'); 
            }); 
        }

            const mgrs = state.users.filter(u => !u.isDeleted && u.role === 'admin' && u.id !== excludeId);
            const tls = state.users.filter(u => !u.isDeleted && u.role === 'team_leader' && u.id !== excludeId);
            const opt = u => `<option value="${u.id}" ${u.id === selectedId ? 'selected' : ''}>${escapeHTML(u.name)}</option>`;
            let html = '';
            if (mgrs.length) html += `<optgroup label="تحت المدير مباشرة">${mgrs.map(opt).join('')}</optgroup>`;
            if (tls.length) html += `<optgroup label="تيم ليدر">${tls.map(opt).join('')}</optgroup>`;
            return html;
        }

        window.handleUserSubmit = function(e, id) { 
            e.preventDefault(); 
            const n = document.getElementById('u-name').value; 
            const un = document.getElementById('u-username').value; 
            const r = document.getElementById('u-role') ? document.getElementById('u-role').value : 'admin'; 
            const pass = document.getElementById('u-pass').value; 
            const tlId = r === 'employee' ? (parseInt(document.getElementById('u-tl').value) || null) : null; 
            
            if(id) { 
                const u = state.users.find(x => x.id === id); 
                if(u.username !== un && state.users.find(x => x.username === un && !x.isDeleted)) return showToast('اسم المستخدم محجوز', 'error'); 
                
                const uData = { name: n, username: un, role: r, teamLeaderId: tlId }; 
                if(pass.trim() !== '') uData.password = pass; 
                
                db.collection('Users').doc(id.toString()).update(uData).then(() => { 
                    logActivity(state.currentUser.id, 'إدارة', `تعديل الموظف: ${n}`); 
                    closeModal(); 
                    showToast('تم التعديل'); 
                }); 
            } else { 
                if(state.users.find(x => x.username === un && !x.isDeleted)) return showToast('اسم المستخدم محجوز', 'error'); 
                
                const newUser = { id: Date.now(), name: n, username: un, password: pass, role: r, teamLeaderId: tlId, target: {type: 'money', value: 0}, isDeleted: false }; 
                
                db.collection('Users').doc(newUser.id.toString()).set(newUser).then(() => { 
                    logActivity(state.currentUser.id, 'إدارة', `إنشاء موظف: ${n}`); 
                    closeModal(); 
                    showToast('تمت الإضافة');

        function getReportsHTML() {
            const isTL = state.currentUser.role === 'team_leader'; 
            let myTeamIds = state.users.filter(u => u.teamLeaderId === state.currentUser.id).map(u => u.id); 
            if(isTL) myTeamIds.push(state.currentUser.id);

            const allUnits = getAllUnits(); 
            let filteredProps = allUnits.filter(p => p.status === 'sold');
            
            if(state.filters.reportDateFrom || state.filters.reportDateTo) { 
                const soldEvents = state.archive.filter(a => a.action === 'مباع' || a.action.includes('بيع')); 
                filteredProps = filteredProps.filter(p => { 
                    const event = soldEvents.find(e => e.details.includes(p.title)); 
                    if(event) { 
                        let valid = true; 
                        const evDate = new Date(event.date); 
                        if(state.filters.reportDateFrom && evDate < new Date(state.filters.reportDateFrom)) valid = false; 
                        if(state.filters.reportDateTo) { 
                            const toD = new Date(state.filters.reportDateTo); 
                            toD.setDate(toD.getDate() + 1); 
                            if(evDate >= toD) valid = false; 
                        } 
                        return valid; 
                    } 
                    return true; 
                }); 
            }

            let usersToReport = state.users.filter(u => !u.isDeleted && u.role !== 'data_entry' && u.role !== 'admin'); 
            if(isTL) usersToReport = usersToReport.filter(u => myTeamIds.includes(u.id));

            const empStats = usersToReport.map(u => { 
                const myClients = state.clients.filter(c => !c.isDeleted && c.agentId === u.id).length; 
                const mySoldProps = filteredProps.filter(p => p.agentId === u.id || p.coAgentId === u.id); 
                const salesVol = mySoldProps.reduce((sum, p) => sum + p.price, 0); 
                const myComm = salesVol * state.settings.commissionRate; 
                return { ...u, clients: myClients, deals: mySoldProps.length, vol: salesVol, comm: myComm }; 
            });

            const totalSystemSales = empStats.reduce((sum, u) => sum + u.vol, 0);

            const tableRows = empStats.sort((a,b) => b.vol - a.vol).map(u => `
                <tr class="border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50">
                    <td class="py-4 px-4 font-bold dark:text-white flex items-center gap-2"><i class="fas fa-user-circle text-gray-400"></i> ${u.name}</td>
                    <td class="py-4 px-4 text-center font-bold text-blue-600">${u.clients}</td>
                    <td class="py-4 px-4 text-center font-bold text-green-600">${u.deals}</td>
                    <td class="py-4 px-4 font-black dark:text-gray-200">${formatCurrency(u.vol)}</td>
                    <td class="py-4 px-4 font-black text-royal-gold">${formatCurrency(u.comm)}</td>
                    <td class="py-4 px-4 text-center"><button onclick="viewEmployeeLog(${u.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-md"><i class="fas fa-list-alt mr-1"></i> العمليات</button></td>
                </tr>`).join('');

            return `
            <div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <h2 class="text-3xl font-black dark:text-white">تقارير الأداء ${isTL?'(لفريقي)':''}</h2>
                <div class="flex gap-2 w-full md:w-auto">
                    <button onclick="exportReportExcel()" class="flex-1 md:w-auto bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg"><i class="fas fa-file-excel"></i> إكسيل</button>
                    <button onclick="exportReportPDF()" class="flex-1 md:w-auto bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg"><i class="fas fa-file-pdf"></i> PDF</button>
                </div>
            </div>
            <div class="bg-white dark:bg-royal-darkCard p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-xs font-bold text-gray-500 mb-1">الفترة (من)</label><input type="date" id="fr-from" class="royal-input text-sm" value="${state.filters.reportDateFrom}" onchange="updateReportFilters()"></div>
                <div><label class="block text-xs font-bold text-gray-500 mb-1">الفترة (إلى)</label><input type="date" id="fr-to" class="royal-input text-sm" value="${state.filters.reportDateTo}" onchange="updateReportFilters()"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-gray-900 rounded-2xl p-6 text-white shadow-xl relative overflow-hidden">
                    <i class="fas fa-chart-bar absolute -left-4 -bottom-4 text-7xl opacity-20"></i>
                    <p class="text-gray-400 font-bold mb-1">المبيعات المحققة</p><h3 class="text-4xl font-black text-white">${formatCurrency(totalSystemSales)}</h3>
                </div>
            </div>
            <div class="bg-white dark:bg-royal-darkCard rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden" id="pdf-report-container">
                <div class="p-5 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex justify-between items-center">
                    <h4 class="font-bold text-lg dark:text-white"><i class="fas fa-medal text-royal-gold"></i> كشف الأداء</h4>
                    <img src="${state.settings.logo}" class="h-8 hidden" id="pdf-logo" crossorigin="anonymous">

                    <table class="w-full text-right whitespace-nowrap" id="report-table">

                            <tr><th class="py-3 px-4 font-black">الموظف</th><th class="py-3 px-4 font-black text-center">عملاء</th><th class="py-3 px-4 font-black text-center">إقفال ديل</th><th class="py-3 px-4 font-black">المبيعات</th><th class="py-3 px-4 font-black">العمولة</th><th class="py-3 px-4 font-black text-center html2pdf__page-break-avoid pdf-hide">السجل</th></tr>
                        </thead>
                        <tbody>${tableRows}</tbody>
                    </table>

        function getArchiveHTML() {
            let filteredArchive = state.archive; 

            // Role-based filtering: employees/TLs only see their own logs
            if (state.currentUser.role !== 'admin') {
                filteredArchive = filteredArchive.filter(a => a.userId === state.currentUser.id);
            }

            if(state.filters.archiveSearch) { 
                const term = state.filters.archiveSearch.toLowerCase(); 
                filteredArchive = filteredArchive.filter(a => { 
                    const user = state.users.find(u => u.id === a.userId); 
                    return a.details.toLowerCase().includes(term) || a.action.toLowerCase().includes(term) || (user && user.name.toLowerCase().includes(term)); 
                }); 
            } 
            
            if(state.filters.archiveDateFrom) {
                filteredArchive = filteredArchive.filter(a => a.date >= state.filters.archiveDateFrom); 
            }
            if(state.filters.archiveDateTo) { 
                const toD = new Date(state.filters.archiveDateTo); 
                toD.setDate(toD.getDate() + 1); 
                filteredArchive = filteredArchive.filter(a => new Date(a.date) < toD); 
            }

            const timeline = filteredArchive.sort((a, b) => new Date(b.date) - new Date(a.date)).map(item => { 
                const u = state.users.find(x => x.id === item.userId); 
                return `
                <div class="relative pl-4 pr-6 py-3 border-r-2 border-gray-200 dark:border-gray-700">
                    <div class="absolute right-[-7px] top-4 w-3 h-3 rounded-full bg-royal-gold border-2 border-white dark:border-gray-900"></div>
                    <div class="bg-white dark:bg-royal-darkCard p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
                        <div class="flex justify-between mb-1">
                            <span class="font-bold text-sm dark:text-white">${u?u.name:'النظام'} - <span class="text-blue-600">${item.action}</span></span>
                            <span class="text-xs text-gray-400" dir="ltr">${formatDate(item.date, true)}</span>
                        </div>
                        <p class="text-gray-700 dark:text-gray-300 text-sm font-semibold">${item.details}</p>
                    </div>
                </div>`; 
            }).join('');
            
            return `
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 class="text-3xl font-black dark:text-white">سجل النشاط العام (Log)</h2>
            </div>
            <div class="bg-white dark:bg-royal-darkCard p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div><label class="block text-xs font-bold text-gray-500 mb-1">بحث شامل</label><input type="text" id="fa-search" class="royal-input text-sm" placeholder="ابحث..." value="${state.filters.archiveSearch}" oninput="updateArchiveFilters()"></div>
                <div><label class="block text-xs font-bold text-gray-500 mb-1">التاريخ (من)</label><input type="date" id="fa-from" class="royal-input text-sm" value="${state.filters.archiveDateFrom}" onchange="updateArchiveFilters()"></div>
                <div><label class="block text-xs font-bold text-gray-500 mb-1">التاريخ (إلى)</label><input type="date" id="fa-to" class="royal-input text-sm" value="${state.filters.archiveDateTo}" onchange="updateArchiveFilters()"></div>
            </div>
            <div class="max-w-4xl py-2">${timeline || '<p class="text-center font-bold text-gray-500">لا توجد بيانات مطابقة</p>'}</div>`;
        }
        
        window.updateArchiveFilters = function() { 
            state.filters.archiveSearch = document.getElementById('fa-search').value; 
            state.filters.archiveDateFrom = document.getElementById('fa-from').value; 
            state.filters.archiveDateTo = document.getElementById('fa-to').value; 
            renderActiveViewOnly(); 
        }

        function getLoginHTML() { 
            return `
            <div class="flex-1 flex items-center justify-center bg-cover bg-center relative" style="background-image:url('${LOGIN_BG}')">
                <div class="absolute inset-0 bg-gray-900/80 backdrop-blur-md"></div>
                <div class="relative z-10 glass p-8 rounded-2xl shadow-2xl w-[90%] max-w-md border-t-4 border-royal-gold">
                    <div class="text-center mb-8">
                        <div class="relative inline-block">
                            <img src="${state.settings.logo}" onerror="this.src='https://placehold.co/400x100/transparent/D4AF37?text=BETAK'" class="logo-animated app-logo drop-shadow-2xl h-28 w-auto object-contain mx-auto mb-4 relative z-10">
                        </div>
                        <h1 class="text-3xl font-black text-gray-800 dark:text-white tracking-wide mt-2">${state.settings.companyName}</h1>
                        <p class="text-gray-500 dark:text-gray-400 mt-2 font-bold text-sm">نظام إدارة الأملاك والمبيعات العقارية</p>
                    </div>
                    <form onsubmit="handleLogin(event)" class="space-y-5">
                        <div class="relative">
                            <i class="fas fa-user absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="l-user" class="royal-input text-lg font-bold text-center pr-10" required placeholder="اسم المستخدم" dir="ltr">
                        </div>
                        <div class="relative">
                            <i class="fas fa-lock absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="password" id="l-pass" class="royal-input text-lg font-bold text-center pr-10" required placeholder="كلمة المرور" dir="ltr">
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-royal-gold to-royal-goldDark hover:from-royal-goldDark hover:to-royal-gold text-white font-black py-3.5 rounded-xl transition-all duration-300 transform hover:-translate-y-1">تسجيل الدخول <i class="fas fa-sign-in-alt ml-2"></i></button>
                    </form>
                    
                    <div class="mt-8 text-center pb-2">
                        <div class="creator-badge-wrapper inline-block cursor-pointer mx-auto" title="Developer & Designer">
                            <div class="creator-badge-inner py-1 px-3">
                                <i class="fas fa-paint-brush text-royal-gold animate-pulse-fast text-xs"></i>
                                <span class="font-bold text-gray-800 dark:text-gray-200 text-[10px] tracking-wide font-sans">
                                    Designed by <span class="text-transparent bg-clip-text bg-gradient-to-r from-royal-gold to-vivid-orange font-black">Islam Mahmoud Saad</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`; 
        }

        window.handleLogin = async function(e) { 
            e.preventDefault(); 
            showLoader("جاري تسجيل الدخول...");
            try {
                const snap = await db.collection('Users').get();
                state.users = snap.docs.map(doc => doc.data());
                
                const u = state.users.find(x => x.username === document.getElementById('l-user').value && x.password === document.getElementById('l-pass').value && !x.isDeleted); 
                
                if(u) { 
                    state.currentUser = u; 
                    state.currentView = 'dashboard'; 
                    await initRealtimeListeners(); 
                    logActivity(u.id, 'تسجيل دخول', 'تسجيل دخول للنظام'); 
                    renderApp(); 
                    showToast(`أهلاً بك، ${u.name}!`); 
                } else { 
                    showToast('البيانات غير صحيحة أو الحساب موقوف', 'error'); 
                }
            } catch (err) {
                showToast('خطأ في الاتصال بالخادم', 'error');
            }
            hideLoader();
        }

        window.handleLogout = function() { 
            if(state.currentUser) { 
                logActivity(state.currentUser.id, 'تسجيل خروج', 'تسجيل خروج من النظام'); 
                state.currentUser = null; clearReminderToast(); closeNotifications(); 
                unsubscribers.forEach(u => u()); 
                unsubscribers=[]; 
                renderApp(); 
            } 
        }

        renderApp();
    </script>
</body>
</html>
